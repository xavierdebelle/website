/* ============================================================
   Sync adapter — what this tool hands the shared sync code below
   ============================================================ */
var hadStoredAtBoot = false;      // set in Boot, before load() can create the demo project

function listOf(v) {
  if (Array.isArray(v)) return v;
  if (!v || typeof v !== 'object') return [];
  return Object.keys(v).map(function (k) { return v[k]; });
}

var SYNC = {
  doc: 'project-phases',          // users/{uid}/tools/project-phases
  storageKey: KEY,
  noun: 'work',

  /* Projects and the time log travel. Which project is open does not:
     switching projects on the phone is not an edit. */
  payload: function () { return { projects: state.projects, log: state.log }; },

  /* The Realtime Database drops empty arrays and objects, so a phase with
     no steps comes back without a steps key. normalise() rebuilds them. */
  apply: function (d) {
    if (!listOf(d.projects).length) return false;   // an empty copy never wipes your projects
    var next = normalise({ projects: listOf(d.projects), log: listOf(d.log), currentId: state.currentId });
    if (!next) return false;
    state = next;
    if (!currentProject() && state.projects.length) state.currentId = state.projects[0].id;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    render();
    return true;
  },

  /* A browser that had nothing saved before this visit only holds the demo
     project, which is not worth asking about. */
  untouched: function () { return !hadStoredAtBoot; },

  flush: function () { save(); },

  describe: function (d) {
    var n = listOf(d && d.projects).length;
    return 'It holds ' + n + ' project' + (n === 1 ? '' : 's') + '.';
  },

  buttonClass: function (s) { return 'btn' + (s === 'conflict' || s === 'error' ? ' del' : ''); }
};

/* ============================================================
   Cloud sync — local first, optional, live while signed in

   Shared by Project Phases, Budget Tracker and Idea Bank. Keep the copies
   identical: everything tool-specific lives in the SYNC adapter just above.

   Sync is by invitation: Xavier's account, plus the people he approves on
   the Access page (members/{uid}). Signing in is how someone asks — their
   request appears there, and sync starts on its own once it is approved.

   Signed out, the tool is purely local and the Firebase SDK is never
   fetched. Signed in as the owner, the cloud copy is watched live, so a
   change on one device shows up on the other within a second or two.

   Every write goes through the same pass — read the cloud, compare it
   with the watermark, then act — so a device that is behind can never
   overwrite a newer copy. When both sides changed, it asks.
   ============================================================ */

/* Public Firebase identifiers — not secrets. They ship in every Firebase
   web app; the database rules are what protect the data. */
var FIREBASE = {
  apiKey:      'AIzaSyCu0CA6eLWIkhhl-Z7jr_dDisuXDt1dKco',
  authDomain:  'xdb-tools.firebaseapp.com',
  databaseURL: 'https://xdb-tools-default-rtdb.firebaseio.com',
  projectId:   'xdb-tools',
  appId:       '1:6009567091:web:f7ee8c43ebe1bd25fcb706'
};
var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

/* Who may sync. Courtesy checks only — the database rules enforce all of
   it, and would refuse anyone else even if these lines were edited away. */
var OWNER = 'jGJdt3h4EeaOL3mYWUHA4yMZsRx2';
var ACCESS_URL = '../access.html';   // where requests are approved; tools live in tools/
var META_KEY = SYNC.storageKey + '.meta';   // watermarks live beside the data, not in it

var cloud = {
  on: !!FIREBASE.databaseURL,
  status: 'signedout',  // signedout | working | synced | conflict | pending | private | error
  uid: null,            // set only when the signed-in account owns this sync
  authed: false,
  listening: false,
  at: 0,
  msg: '',
  fb: null,
  timer: null,
  busy: false,          // a sync pass is in flight
  again: false,         // something changed while it was, so run one more
  pending: null,        // a conflict waiting on a decision
  print: null,          // the synced data as last seen, to tell edits from re-saves
  outgoing: 0,          // stamp of our own latest write, so its echo is not news
  unwatch: null,
  unmember: null,       // live watch on this account's membership
  asked: false          // an access request was sent this session
};

function syncEl(id) { return document.getElementById(id); }

function explain(code) {
  var offline = 'No connection. Everything still saves on this device and will sync when you are back online.';
  var map = {
    'auth/unauthorized-domain':
      'This site is not on the Firebase authorised domains list. Add ' + location.hostname +
      ' under Authentication → Settings → Authorized domains.',
    'auth/operation-not-allowed':
      'Google sign-in is not enabled for this Firebase project. Turn it on under Authentication → Sign-in method.',
    'auth/popup-blocked':
      'Your browser blocked the sign-in popup. Allow popups for this site, or try again.',
    'auth/popup-closed-by-user':
      'The sign-in window closed before it finished.',
    'auth/network-request-failed': offline,
    'unavailable': offline,
    'timeout': offline,
    'PERMISSION_DENIED':
      'The database rules refused this account. Check the rules allow users/<your uid>.'
  };
  return map[code] || ('Sync failed' + (code ? ' (' + code + ')' : '') + '.');
}

function deviceName() {
  var ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua)) return 'iPad';
  if (/Android/.test(ua)) return 'Android';
  if (/Mac OS X/.test(ua)) return 'Mac';
  if (/Windows/.test(ua)) return 'Windows';
  return 'this device';
}

/* Kept out of the tool's own data so exports stay clean and an imported
   file never carries another device's watermark. */
function meta() {
  try {
    var m = JSON.parse(localStorage.getItem(META_KEY) || '{}');
    return { updatedAt: +m.updatedAt || 0, lastSyncedAt: +m.lastSyncedAt || 0, signedIn: !!m.signedIn };
  } catch (e) { return { updatedAt: 0, lastSyncedAt: 0, signedIn: false }; }
}
function setMeta(patch) {
  var m = meta();
  for (var k in patch) m[k] = patch[k];
  try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) {}
  return m;
}

/* Stamps only ever move forward past the watermark. Phone and laptop clocks
   disagree by a second or two; without this, an edit made just after
   taking a copy from a device whose clock runs ahead would look older than
   the copy and never be sent. */
function nextStamp() {
  return Math.max(Date.now(), meta().lastSyncedAt + 1, cloud.outgoing + 1);
}

function syncPrint() { return JSON.stringify(SYNC.payload()); }

/* A device that already held real data before sync existed has no
   watermark, which would read as "never edited" and let the cloud replace
   it silently. Mark it as holding unsynced work instead, so the worst case
   is being asked. Runs once at boot, before anything is compared. */
function seedMeta() {
  var noWatermark = false;
  try { noWatermark = localStorage.getItem(META_KEY) == null; } catch (e) {}
  if (noWatermark && !SYNC.untouched()) setMeta({ updatedAt: 1 });
  cloud.print = syncPrint();
}

/* ---- SDK, loaded once and only on demand ---- */
function loadSDK() {
  if (cloud.fb) return Promise.resolve(cloud.fb);
  return Promise.all([
    import(SDK + 'firebase-app.js'),
    import(SDK + 'firebase-auth.js'),
    import(SDK + 'firebase-database.js')
  ]).then(function (mods) {
    var application = mods[0].initializeApp(FIREBASE);
    cloud.fb = { auth: mods[1].getAuth(application), db: mods[2].getDatabase(application), a: mods[1], f: mods[2] };
    return cloud.fb;
  });
}
function docRef() { return cloud.fb.f.ref(cloud.fb.db, 'users/' + cloud.uid + '/tools/' + SYNC.doc); }

function withTimeout(p, ms) {
  return Promise.race([p, new Promise(function (_, no) {
    setTimeout(function () { no({ code: 'timeout' }); }, ms);
  })]);
}

/* ---- the three way decision ----------------------------------------
   Local and cloud timestamps alone cannot tell an edit from a stale copy.
   The watermark — the cloud stamp we last agreed with — is what makes
   "both changed since we last spoke" detectable. */
function reconcile(remote) {
  var m = meta();
  var localAt = m.updatedAt, syncedAt = m.lastSyncedAt;
  var remoteAt = remote ? (+remote.updatedAt || 0) : 0;
  if (!remote) return localAt ? 'push' : 'idle';
  if (remoteAt === syncedAt) return localAt > syncedAt ? 'push' : 'idle';
  return localAt > syncedAt ? 'conflict' : 'pull';
}

/* Taking a copy re-renders the page. If a field had the cursor, put it
   back, so a change arriving from the other device does not throw you out
   of where you were. */
function keepingFocus(fn) {
  function fields() { return Array.prototype.slice.call(document.querySelectorAll('input,textarea,select')); }
  var a = document.activeElement, i = fields().indexOf(a), sel = null;
  try { if (i >= 0 && a.selectionStart != null) sel = [a.selectionStart, a.selectionEnd]; } catch (e) {}
  var result = fn();
  var b = i >= 0 ? fields()[i] : null;
  if (b && b !== document.activeElement) {
    try { b.focus({ preventScroll: true }); if (sel) b.setSelectionRange(sel[0], sel[1]); } catch (e) {}
  }
  return result;
}

function adopt(remote) {
  var d = remote && remote.data;
  if (!d) return false;
  if (!keepingFocus(function () { return SYNC.apply(d, remote); })) return false;
  cloud.print = syncPrint();
  var stamp = +remote.updatedAt || Date.now();
  setMeta({ updatedAt: stamp, lastSyncedAt: stamp });
  return true;
}

function pushNow() {
  var stamp = nextStamp();
  var print = syncPrint();
  cloud.outgoing = stamp;
  return cloud.fb.f.set(docRef(), { data: JSON.parse(print), updatedAt: stamp, device: deviceName() })
    .then(function () {
      var ahead = syncPrint() !== print;   // edited again while this was on its way
      setMeta({ lastSyncedAt: stamp, updatedAt: ahead ? Math.max(meta().updatedAt, stamp + 1) : stamp });
      cloud.at = stamp;
      if (ahead) cloud.again = true;
    });
}
function pullNow() {
  return withTimeout(cloud.fb.f.get(docRef()), 12000).then(function (snap) {
    return snap.exists() ? snap.val() : null;
  });
}

function decide(remote) {
  var move = reconcile(remote);
  if (move === 'pull')     { adopt(remote); cloud.at = Date.now(); setStatus('synced'); return; }
  if (move === 'push')     { return pushNow().then(function () { setStatus('synced'); }); }
  if (move === 'conflict') { cloud.pending = remote; setStatus('conflict'); return; }
  cloud.at = Date.now();
  setStatus('synced');
}

/* One pass. Only one runs at a time; anything that asks while one is in
   flight gets a second pass afterwards rather than being dropped. `known`
   is a copy the live listener already has in hand, which saves a read. */
function syncNow(userAsked, known) {
  if (!cloud.on || !cloud.uid) return Promise.resolve();
  if (cloud.busy) { cloud.again = true; return Promise.resolve(); }
  if (cloud.status === 'conflict' && !userAsked) return Promise.resolve();
  cloud.busy = true;
  cloud.again = false;
  clearTimeout(cloud.timer);
  setStatus('working');
  return (known ? Promise.resolve(known) : pullNow()).then(decide).then(function () {
    cloud.busy = false;
    if (cloud.again && cloud.status !== 'conflict') return syncNow();
  }, function (err) {
    cloud.busy = false;
    cloud.msg = (err && err.code) || 'failed';
    setStatus('error');
    if (userAsked) console.warn('[sync]', err);
  });
}

/* Called on every save. Tools re-save on load, on navigation and on the
   way out, so the fingerprint decides whether anything was really edited —
   otherwise merely opening the tool would count as a change. */
function cloudTouch() {
  if (cloud.print === null) return;          // still booting
  var p = syncPrint();
  if (p === cloud.print) return;
  cloud.print = p;
  setMeta({ updatedAt: nextStamp() });
  if (!cloud.on || !cloud.uid) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(function () { syncNow(); }, 600);
}

/* ---- live ---- */
function watch() {
  if (cloud.unwatch || !cloud.uid) return;
  cloud.unwatch = cloud.fb.f.onValue(docRef(), function (snap) {
    var remote = snap.exists() ? snap.val() : null;
    if (!remote) return;
    var at = +remote.updatedAt || 0;
    if (at === cloud.outgoing || at === meta().lastSyncedAt) return;   // our own write, or one we already have
    if (cloud.status === 'conflict') { cloud.pending = remote; paintSync(); return; }
    if (cloud.busy) { cloud.again = true; return; }
    syncNow(false, remote);
  }, function (err) {
    cloud.unwatch = null;
    cloud.msg = (err && err.code) || 'failed';
    setStatus('error');
  });
}
function stopWatching() {
  if (cloud.unwatch) { cloud.unwatch(); cloud.unwatch = null; }
}

/* ---- membership ----
   Xavier always syncs. Anyone else is watched live at members/{uid}: when
   he approves them, sync starts without a reload; if he removes them, it
   stops and the tool carries on locally. Until then signing in files a
   request (once per session) and the tool says so. */
function admit(uid) {
  if (cloud.uid === uid) return;
  cloud.uid = uid;
  syncNow();
  watch();
}
function stopMembership() {
  if (cloud.unmember) { cloud.unmember(); cloud.unmember = null; }
}
function askForAccess(user) {
  if (cloud.asked) { setStatus('pending'); return; }
  cloud.asked = true;
  var ref = cloud.fb.f.ref(cloud.fb.db, 'requests/' + user.uid);
  cloud.fb.f.set(ref, {
    email: user.email || '', name: (user.displayName || '').slice(0, 120), at: Date.now(), tool: SYNC.doc
  }).then(function () {
    if (!cloud.uid) setStatus('pending');
  }, function () {
    // refused: this account was declined — say so, and keep working locally
    if (!cloud.uid) setStatus('private');
  });
}
function checkMembership(user) {
  if (user.uid === OWNER) { admit(user.uid); return; }
  setStatus('working');
  cloud.unmember = cloud.fb.f.onValue(cloud.fb.f.ref(cloud.fb.db, 'members/' + user.uid), function (snap) {
    if (snap.exists()) { admit(user.uid); return; }
    if (cloud.uid) { cloud.uid = null; stopWatching(); clearTimeout(cloud.timer); }
    askForAccess(user);
  }, function () {
    cloud.uid = null;
    stopWatching();
    setStatus('private');
  });
}

/* ---- sign in / out ---- */
function listen(fb) {
  if (cloud.listening) return;
  cloud.listening = true;
  fb.a.onAuthStateChanged(fb.auth, function (user) {
    cloud.authed = !!user;
    setMeta({ signedIn: !!user });
    stopWatching();
    stopMembership();
    cloud.uid = null;
    cloud.asked = false;
    if (!user) { setStatus('signedout'); return; }
    checkMembership(user);
  });
}

function signIn() {
  if (!cloud.on) return;
  setMeta({ signedIn: true });   // so a redirect sign-in is picked up when the page comes back
  setStatus('working');
  loadSDK().then(function (fb) {
    listen(fb);
    var provider = new fb.a.GoogleAuthProvider();
    return fb.a.signInWithPopup(fb.auth, provider).catch(function (err) {
      // iOS and locked-down browsers block popups; a redirect always works
      if (err && /popup-blocked|operation-not-supported/i.test(err.code || '')) return fb.a.signInWithRedirect(fb.auth, provider);
      throw err;
    });
  }).catch(function (err) {
    setMeta({ signedIn: false });
    cloud.msg = (err && err.code) || 'failed';
    setStatus('error');
  });
}
function signOutNow() { if (cloud.fb) cloud.fb.a.signOut(cloud.fb.auth); }
function syncClick() { if (!cloud.uid) signIn(); else syncNow(true); }

/* ---- conflict resolution ---- */
function keepLocal() {
  var remote = cloud.pending;
  if (!remote) return;
  cloud.pending = null;
  var seen = +remote.updatedAt || 0;
  // acknowledge the copy we saw, and stay ahead of it so this device wins
  setMeta({ lastSyncedAt: seen, updatedAt: Math.max(meta().updatedAt, seen + 1) });
  cloud.status = 'working';
  syncNow(true);
}
function keepCloud() {
  var remote = cloud.pending;
  if (!remote) return;
  cloud.pending = null;
  adopt(remote);
  cloud.at = Date.now();
  setStatus('synced');
}

/* ---- the visible half ---- */
function hhmm(ms) {
  var d = new Date(ms);
  return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
}
function setStatus(s) {
  cloud.status = s;
  if (s === 'synced') cloud.at = cloud.at || Date.now();
  paintSync();
}

function paintSync() {
  var btn = syncEl('btn-sync'), out = syncEl('btn-signout'), bar = syncEl('sync-bar');
  if (!btn) return;
  if (!cloud.on) { btn.style.display = 'none'; out.style.display = 'none'; bar.classList.remove('on'); return; }

  var label, title;
  switch (cloud.status) {
    case 'working':  label = 'Syncing…';                   title = 'Talking to the cloud'; break;
    case 'synced':   label = 'Live · ' + hhmm(cloud.at);   title = 'Signed in — changes on your other devices appear here as they happen'; break;
    case 'conflict': label = 'Both changed';               title = 'This device and the cloud disagree'; break;
    case 'pending':  label = 'Access requested';           title = 'Waiting for Xavier to approve this account'; break;
    case 'private':  label = 'No access';                  title = 'This account is not on the invitation list'; break;
    case 'error':    label = 'Sync failed';                title = explain(cloud.msg); break;
    default:         label = 'Sign in to sync';            title = 'Keep this in step across your devices';
  }
  btn.textContent = label;
  btn.title = title;
  btn.className = SYNC.buttonClass(cloud.status);
  btn.style.display = '';
  out.style.display = cloud.authed ? '' : 'none';

  var what = syncEl('sync-what'), kl = syncEl('sync-keep-local'), kc = syncEl('sync-keep-cloud');
  if (cloud.status === 'pending' || cloud.status === 'private' || cloud.status === 'error') {
    what.textContent = cloud.status === 'pending'
      ? 'Sync is by invitation, and your request is in. Once Xavier approves it, syncing starts here on its own. ' +
        'Until then everything keeps saving in this browser as usual. '
      : cloud.status === 'private'
      ? 'Sync on this site is by invitation, and this account isn\u2019t on the list. ' +
        'Everything still saves in this browser exactly as before, and nothing is sent anywhere. '
      : explain(cloud.msg);
    if (cloud.status !== 'error') {
      var more = document.createElement('a');
      more.href = ACCESS_URL;
      more.textContent = 'About access \u2192';
      what.appendChild(more);
    }
    kl.style.display = 'none';
    kc.style.display = 'none';
    bar.classList.add('on');
    return;
  }
  kl.style.display = '';
  kc.style.display = '';
  if (cloud.status === 'conflict' && cloud.pending) {
    what.textContent =
      'This ' + deviceName() + ' and the cloud copy have both changed since they last agreed. ' +
      'The cloud copy was last written ' + hhmm(+cloud.pending.updatedAt) +
      ' from ' + (cloud.pending.device || 'another device') + '. ' + SYNC.describe(cloud.pending.data);
    bar.classList.add('on');
  } else {
    bar.classList.remove('on');
  }
}

function initCloud() {
  seedMeta();
  paintSync();
  if (!cloud.on) return;

  /* Only someone who has signed in here before gets the SDK on load; a
     visitor who never touches the button never fetches it. */
  if (meta().signedIn) {
    setStatus('working');
    loadSDK().then(listen).catch(function (err) { cloud.msg = (err && err.code) || 'failed'; setStatus('error'); });
  }

  document.addEventListener('visibilitychange', function () {
    if (!cloud.uid) return;
    if (document.hidden) {
      // a phone suspends the page soon after it hides: send anything unsent now
      SYNC.flush();
      if (meta().updatedAt > meta().lastSyncedAt) syncNow();
    } else {
      syncNow();
    }
  });
  window.addEventListener('focus', function () { if (cloud.uid) syncNow(); });
  window.addEventListener('online', function () { if (cloud.uid) syncNow(); });
}


/* ============================================================
   Client links
   ------------------------------------------------------------
   A project can be given a secret link that shows it, read-only, to a
   client. The link carries a random 128-bit token; a copy of just that
   project lives at shares/{token}, which anyone holding the token can
   read and only the account that made it (its `owner`) can write — so
   every approved member can make links, and nobody can touch another's. The copy is refreshed whenever this
   device finishes a sync, so the client watches the work live.

   Turning a link off deletes the copy, so the old link shows nothing.
   ============================================================ */
var PUBLIC_URL = 'https://xavierdebelle.github.io/website/tools/project-tracker.html';
var REVOKE_KEY = KEY + '.revoke';   // links to turn off once this device is signed in again
var sharePrinted = {};              // token -> what this page last published there
var shareError = '';

function newToken() {
  var b = new Uint8Array(16);
  crypto.getRandomValues(b);
  return btoa(String.fromCharCode.apply(null, b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function shareURL(token) {
  var base = /^https?:$/.test(location.protocol) ? location.origin + location.pathname : PUBLIC_URL;
  return base + '#view=' + token;
}
function shareRef(token) { return cloud.fb.f.ref(cloud.fb.db, 'shares/' + token); }

/* Only what the client page shows. No other projects, no sync bookkeeping,
   no collapsed flags. */
function sharePayload(p) {
  var ids = {};
  var project = {
    id: p.id, name: p.name, createdAt: p.createdAt,
    phases: p.phases.map(function (ph) {
      return {
        id: ph.id, name: ph.name,
        steps: ph.steps.map(function (st) {
          ids[st.id] = true;
          return { id: st.id, name: st.name, status: st.status, estimate: st.estimate };
        })
      };
    })
  };
  var log = state.log.filter(function (e) { return ids[e.stepId]; }).map(function (e) {
    return { id: e.id, stepId: e.stepId, phaseId: e.phaseId, start: e.start, end: e.end, note: e.note, source: e.source };
  });
  return { project: project, log: log };
}

function shareFail(err) {
  var code = err && err.code;
  shareError = code === 'PERMISSION_DENIED'
    ? 'The database refused the client link. It may belong to another account, or the Firebase rules need updating.'
    : explain(code);
  if (err) console.warn('[share]', err);
  paintShare();
}

function writeShare(token, p) {
  var body = sharePayload(p);
  var print = JSON.stringify(body);
  body.v = 1;
  body.owner = cloud.uid;      // the rules let only this account change or remove the link
  body.updatedAt = Date.now();
  return cloud.fb.f.set(shareRef(token), body).then(function () {
    sharePrinted[token] = print;
    shareError = '';
  });
}

/* Runs after every completed sync: refresh each shared project whose
   client-visible content changed since this page last published it. */
function publishShares() {
  if (VIEW || !cloud.uid || !cloud.fb) return;
  flushRevokes();
  state.projects.forEach(function (p) {
    if (!p.shareId) return;
    if (sharePrinted[p.shareId] === JSON.stringify(sharePayload(p))) return;
    writeShare(p.shareId, p).catch(shareFail);
  });
}

function queuedRevokes() {
  try { return JSON.parse(localStorage.getItem(REVOKE_KEY) || '[]'); } catch (e) { return []; }
}
function setRevokes(list) {
  try {
    if (list.length) localStorage.setItem(REVOKE_KEY, JSON.stringify(list));
    else localStorage.removeItem(REVOKE_KEY);
  } catch (e) {}
}
function revokeShare(token) {
  delete sharePrinted[token];
  if (!cloud.uid || !cloud.fb) { setRevokes(queuedRevokes().concat([token])); return Promise.resolve(); }
  return cloud.fb.f.remove(shareRef(token)).catch(function (err) {
    setRevokes(queuedRevokes().concat([token]));
    throw err;
  });
}
function flushRevokes() {
  var list = queuedRevokes();
  if (!list.length) return;
  setRevokes([]);
  list.forEach(function (token) { revokeShare(token).catch(shareFail); });
}

function paintShare() {
  var b = $('btn-share');
  if (!b) return;
  var p = state && currentProject();
  b.style.display = !VIEW && cloud.uid && p ? '' : 'none';
  b.textContent = p && p.shareId ? 'Client link · on' : 'Client link';
}

/* The shared sync code is identical across tools, so rather than give it a
   hook, this tool listens in on its status changes: the button follows
   sign-in, and a finished sync is the moment to refresh client copies. */
var coreSetStatus = setStatus;
setStatus = function (s) {
  coreSetStatus(s);
  paintShare();
  if (s === 'synced') publishShares();
};

function copyText(text, btn) {
  function done() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1600); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { $('share-url').select(); document.execCommand('copy'); done(); });
  } else {
    $('share-url').select(); document.execCommand('copy'); done();
  }
}

function openShare() {
  var p = currentProject();
  if (!p || !cloud.uid) return;
  resetSaveBtn();
  $('modal-save').disabled = false;
  var url = p.shareId ? shareURL(p.shareId) : '';

  if (!p.shareId) {
    openModal('Client link',
      '<p class="share-note">Create a read-only link to <strong>' + esc(p.name) + '</strong> for your client. ' +
      'They will see its phases, steps, estimates, logged time and log notes, updating as you work — ' +
      'and nothing they do can change it. Every project gets its own link, and you can turn it off at any time.</p>',
      function () { createShare(p); return false; });
    $('modal-save').textContent = 'Create link';
  } else {
    openModal('Client link — ' + p.name,
      '<p class="share-note">Anyone with this link can see this project and watch it update. ' +
      'They cannot change, add or remove anything.</p>' +
      '<div class="row"><label for="share-url">Link</label><div class="share-row">' +
        '<input type="text" id="share-url" readonly value="' + esc(url) + '">' +
        '<button type="button" class="btn" id="share-copy">Copy</button>' +
        '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Open</a>' +
      '</div></div>' +
      '<div class="share-actions">' +
        '<button type="button" class="btn ghost" id="share-new" title="The current link stops working">Replace with a new link</button>' +
        '<button type="button" class="btn ghost danger" id="share-off">Turn off link</button>' +
      '</div>',
      function () { return true; }, 'share-url');
    $('modal-save').textContent = 'Done';
    $('share-copy').addEventListener('click', function () { copyText(url, this); });
    $('share-off').addEventListener('click', function () {
      var token = p.shareId;
      this.disabled = true;
      revokeShare(token).then(function () {
        p.shareId = null;
        save();
        closeModal();
        render();
      }, function (err) { shareFail(err); modalError(shareError); });
    });
    $('share-new').addEventListener('click', function () {
      var token = p.shareId;
      this.disabled = true;
      revokeShare(token).then(function () {
        p.shareId = null;
        createShare(p);
      }, function (err) { shareFail(err); modalError(shareError); });
    });
  }
  if (shareError) modalError(shareError);
}

function createShare(p) {
  var token = newToken();
  var btn = $('modal-save');
  btn.disabled = true;
  btn.textContent = 'Creating…';
  writeShare(token, p).then(function () {
    p.shareId = token;
    save();
    render();
    openShare();
  }, function (err) {
    btn.disabled = false;
    btn.textContent = 'Create link';
    shareFail(err);
    modalError(shareError);
  });
}

/* ---- the client's side ---- */
function viewMessage(text) {
  var el = $('view-msg');
  el.textContent = text;
  el.classList.toggle('on', !!text);
  document.body.classList.toggle('view-empty', !!text);
}

function viewGone() {
  state = blankState();
  render();
  document.querySelector('.brand h1').textContent = 'Project Phases';
  document.title = 'Link not active';
  viewMessage('This link is not active. It may have been turned off or replaced — ask for a new one.');
}

function showShared(d) {
  var collapsed = {};                       // the client's own expand/collapse survives updates
  var cur = currentProject();
  if (cur) cur.phases.forEach(function (ph) { collapsed[ph.id] = ph.collapsed; });
  var next = normalise({ projects: [d.project], log: listOf(d.log), currentId: d.project.id });
  if (!next || !next.projects.length) return viewGone();
  next.projects[0].shareId = null;
  next.projects[0].phases.forEach(function (ph) { ph.collapsed = !!collapsed[ph.id]; });
  state = next;
  viewMessage('');
  document.querySelector('.brand h1').textContent = state.projects[0].name;
  keepingFocus(render);
  if (!runningEntry()) document.title = state.projects[0].name + ' — Project Phases';
}

function bootView() {
  document.body.classList.add('view');
  document.querySelector('.brand .sub').textContent = 'shared by Xavier de Belle';
  state = blankState();
  render();
  viewMessage('Loading…');

  /* Nothing a client can press changes anything. Hidden controls are also
     refused here, before any handler sees them. Allowed: tabs, expanding a
     phase, the log filters and the CSV download. */
  var allowedIds = /^(tab-board|tab-log|tab-report|btn-collapse-all|f-clear|btn-log-csv)$/;
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest && ev.target.closest('button, [data-act]');
    if (!el) return;
    if (el.getAttribute('data-act') === 'toggle-phase' || allowedIds.test(el.id || '')) return;
    ev.preventDefault();
    ev.stopImmediatePropagation();
  }, true);
  ['pointerdown', 'keydown', 'dblclick'].forEach(function (type) {
    document.addEventListener(type, function (ev) {
      if (ev.target.closest && ev.target.closest('[data-act="handle"]')) {
        ev.preventDefault();
        ev.stopImmediatePropagation();
      }
    }, true);
  });

  Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-database.js')]).then(function (m) {
    var db = m[1].getDatabase(m[0].initializeApp(FIREBASE));
    m[1].onValue(m[1].ref(db, 'shares/' + VIEW), function (snap) {
      var d = snap.exists() ? snap.val() : null;
      if (!d || !d.project) viewGone(); else showShared(d);
    }, function () { viewGone(); });
  }).catch(function () {
    viewMessage('This project could not be loaded. Check the connection and reload the page.');
  });
}

/* ============================================================
   Boot
   ============================================================ */
$('btn-rename-project').innerHTML = ICO.pencil;
$('btn-delete-project').innerHTML = ICO.trash;

if (VIEW) {
  bootView();
} else {
  try { hadStoredAtBoot = localStorage.getItem(KEY) != null; } catch (e) {}
  load();
  render();
  initCloud();
}

$('btn-sync').addEventListener('click', syncClick);
$('btn-signout').addEventListener('click', signOutNow);
$('sync-keep-local').addEventListener('click', keepLocal);
$('sync-keep-cloud').addEventListener('click', keepCloud);
$('btn-share').addEventListener('click', openShare);

// Test/debug hooks — the same shape the tests drive.
window.__app = {
  state: function () { return state; },
  seconds: function (stepId) { return secondsOfStep(stepId, Date.now()); },
  parseDuration: parseDuration,
  fmtHM: fmtHM,
  moveStep: moveStep,
  movePhase: movePhaseTo,
  render: render,
  // sync internals, same spirit: drivable by a test without a live backend
  sync: {
    reconcile: reconcile,
    meta: meta,
    setMeta: setMeta,
    cloud: function () { return cloud; },
    deviceName: deviceName,
    // Realtime Database drops empty arrays and objects, so anything coming
    // back off the wire must survive normalise(). Testable from here.
    normalise: normalise,
    paint: paintSync,
    setStatus: setStatus,
    explain: explain,
    syncNow: syncNow,
    adopt: adopt,
    syncPrint: syncPrint,
    adapter: SYNC
  },
  share: {
    payload: sharePayload,
    publish: publishShares,
    url: shareURL,
    view: function () { return VIEW; },
    printed: function () { return sharePrinted; }
  },
  split: {
    open: openSplit,
    state: function () { return split; },
    addCutAt: addCutAt,
    save: saveSplit
  }
};
window.__sync = { cloud: cloud, meta: meta, setMeta: setMeta, reconcile: reconcile, adopt: adopt,
                  syncPrint: syncPrint, syncNow: syncNow, paintSync: paintSync, setStatus: setStatus,
                  explain: explain, SYNC: SYNC };
})();
