<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Phases · 333 Photo</title>
<style>
@import url("https://use.typekit.net/zxm4vjv.css");
@import url("https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap");
:root{
  /* 333 Photo tokens */
  --ttt-red:#E8232D; --ttt-red-dark:#B81D25; --ttt-yellow:#F8C135; --ttt-maroon:#250303;
  --ttt-black:#000; --ttt-ink:#222; --ttt-text:#282828; --ttt-gray-700:#484848; --ttt-gray-600:#5A5A5A; --ttt-white:#fff;
  --ttt-font-wide:owners-wide,"Inter Tight",sans-serif; --ttt-font-narrow:owners-narrow,"Inter Tight",sans-serif; --ttt-font-body:"Inter Tight",sans-serif;
  --ttt-shadow-cta:0 0 10px rgba(0,0,0,.5); --ttt-ease:cubic-bezier(.4,0,.2,1);
  /* app aliases — the script reads these names */
  --bg:#f3f1f1; --card:var(--ttt-white); --ink:var(--ttt-text); --muted:var(--ttt-gray-600); --line:#e2dcdc;
  --accent:var(--ttt-red); --accent-soft:color-mix(in srgb,var(--ttt-red) 9%,white);
  --run:var(--ttt-black); --run-soft:color-mix(in srgb,var(--ttt-yellow) 22%,white);
  --warn:var(--ttt-red-dark); --warn-soft:color-mix(in srgb,var(--ttt-yellow) 30%,white); --danger:var(--ttt-red-dark);
  --shadow:none; --radius:0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--ink);font:15px/1.5 var(--ttt-font-body);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-color:var(--ttt-maroon);
  background-image:radial-gradient(ellipse at 50% 0%,rgba(232,35,45,.18),rgba(37,3,3,0) 60%),
    linear-gradient(rgba(232,35,45,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(232,35,45,.14) 1px,transparent 1px);
  background-size:100% 100%,64px 64px,64px 64px;background-attachment:fixed;
}
a{color:var(--ttt-red)} a:hover{color:var(--ttt-red-dark)}
h1,h2,h3{margin:0;font-weight:700;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.site-head{background:var(--ttt-black);color:var(--ttt-white);position:sticky;top:0;z-index:40}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto}
.brand .mark{height:30px;width:auto;display:block;flex:none}
.brand h1{font:700 22px/1 var(--ttt-font-narrow);letter-spacing:.5px;color:var(--ttt-white)}
.brand .sub{display:block;font:700 10px/1.2 var(--ttt-font-wide);letter-spacing:.08em;text-transform:uppercase;color:var(--ttt-yellow);margin-top:4px}
.topbar select{background:var(--ttt-ink);color:var(--ttt-white);border:1px solid var(--ttt-gray-700);font-weight:600;min-width:220px}
.topbar .btn{background:transparent;color:var(--ttt-white);border-color:var(--ttt-gray-700)}
.topbar .btn:hover{border-color:var(--ttt-yellow);color:var(--ttt-yellow)}
.topbar .btn.icon{color:var(--ttt-white)}
.topbar .btn.icon:hover{background:transparent;color:var(--ttt-yellow)}
.topbar .btn.icon.del:hover{color:var(--ttt-red)}
#btn-share{border-color:var(--ttt-red)!important;background:var(--ttt-red)!important;color:var(--ttt-white)!important}
#btn-share:hover{background:var(--ttt-red-dark)!important}

.hero{padding:44px 0 8px;color:var(--ttt-white)}
.eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 10px;font:700 13px/1.2 var(--ttt-font-wide);letter-spacing:.08em;text-transform:uppercase;color:var(--ttt-yellow)}
.eyebrow::before{content:'';width:36px;height:2px;background:var(--ttt-yellow)}
#project-title{font:700 clamp(40px,6vw,72px)/.92 var(--ttt-font-narrow);letter-spacing:1px;color:var(--ttt-white);text-wrap:balance}

/* ---------- controls ---------- */
select,input[type=text],input[type=date],input[type=number],input[type=url],input[type=password],input[type=email],textarea{
  background:var(--card);border:1px solid #cfc7c7;border-radius:0;padding:8px 10px;min-width:0;color:var(--ink);
}
select:focus,input:focus,textarea:focus{outline:2px solid var(--ttt-red);outline-offset:-1px;border-color:var(--ttt-red)}
.btn{
  background:var(--card);color:var(--ttt-black);border:1px solid var(--ttt-black);border-radius:0;padding:8px 14px;
  font:700 11px/1.2 var(--ttt-font-wide);letter-spacing:.06em;text-transform:uppercase;transition:background .15s var(--ttt-ease),color .15s var(--ttt-ease),border-color .15s var(--ttt-ease);
}
.btn:hover{background:var(--ttt-black);color:var(--ttt-white)}
.btn.primary{background:var(--ttt-red);border-color:var(--ttt-red);color:var(--ttt-white)}
.btn.primary:hover{background:var(--ttt-red-dark);border-color:var(--ttt-red-dark)}
.btn.primary.danger{background:var(--ttt-black);border-color:var(--ttt-black);color:var(--ttt-white)}
.btn.primary.danger:hover{background:var(--ttt-red-dark);border-color:var(--ttt-red-dark)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:transparent;color:var(--ttt-red);border-color:transparent}
.btn.danger{color:var(--danger)}
.icon{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;border-radius:0;padding:6px;color:var(--muted);line-height:0}
.icon:hover{background:var(--accent-soft);color:var(--ttt-red)}
.icon.del:hover{background:transparent;color:var(--danger)}
.icon:disabled{opacity:.3;cursor:default}
.icon:disabled:hover{background:transparent;color:var(--muted)}
.icon svg{display:block}

/* ---------- app shell ---------- */
#app{max-width:1140px;margin:0 auto;padding:20px 20px 96px}

/* ---------- running bar ---------- */
#running-bar{display:none;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ttt-red);color:var(--ttt-white);padding:14px 20px;margin-bottom:20px;box-shadow:var(--ttt-shadow-cta)}
#running-bar.on{display:flex}
#running-bar .dot{background:var(--ttt-white)}
#running-what{font-weight:700;font-size:16px}
#running-elapsed{font:700 34px/1 var(--ttt-font-narrow);font-variant-numeric:tabular-nums;margin-left:auto;letter-spacing:.5px}
#running-bar .btn{background:var(--ttt-white);color:var(--ttt-black);border-color:var(--ttt-white)}
#running-bar .btn:hover{background:var(--ttt-black);color:var(--ttt-white);border-color:var(--ttt-black)}
#running-bar .btn.ghost{background:transparent;color:var(--ttt-white);border-color:var(--ttt-white)}
#running-bar .btn.ghost:hover{background:var(--ttt-white);color:var(--ttt-red)}
#sync-bar{display:none;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ttt-yellow);color:var(--ttt-black);padding:12px 20px;margin-bottom:20px}
#sync-bar.on{display:flex}
#sync-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--ttt-black);flex:none;animation:none}
#sync-bar #sync-what{flex:1;min-width:240px;font-size:14px;line-height:1.45}
#sync-bar .btn.ghost{border-color:var(--ttt-black)}
#sync-bar .btn.ghost:hover{background:var(--ttt-black);color:var(--ttt-yellow)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ttt-red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid rgba(255,255,255,.18)}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:12px 20px;color:var(--ttt-white);font:700 13px/1 var(--ttt-font-wide);letter-spacing:.08em;text-transform:uppercase}
.tab:hover{color:var(--ttt-yellow)}
.tab.on{color:var(--ttt-white);border-bottom-color:var(--ttt-red)}
.panel{display:none}
.panel.on{display:block}
#panel-log.on,#panel-report.on{background:var(--card);padding:32px;color:var(--ink)}

/* ---------- board ---------- */
.phase{background:var(--card);color:var(--ink);margin-bottom:12px;overflow:hidden;border-left:6px solid var(--ttt-black)}
.phase:has(.step.running){border-left-color:var(--ttt-red)}
.phase-head{display:flex;align-items:center;gap:14px;padding:16px 18px;flex-wrap:wrap}
.phase:not(.collapsed) .phase-head{border-bottom:1px solid var(--line)}
.phase-head h2{font:700 26px/1 var(--ttt-font-narrow);letter-spacing:.4px;color:var(--ttt-black)}
.phase-title{display:flex;align-items:center;gap:10px;min-width:0}
.phase-toggle{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;background:transparent;border:0;padding:0;color:inherit}
.phase-toggle .chev{display:flex;color:var(--ttt-red);transition:transform .15s}
.phase:not(.collapsed) .phase-toggle .chev{transform:rotate(90deg)}
.phase-toggle:hover h2{color:var(--ttt-red)}
.phase.collapsed .steps,.phase.collapsed .add-step{display:none}
.pill{font:700 10px/1 var(--ttt-font-wide);letter-spacing:.06em;text-transform:uppercase;color:var(--ttt-black);background:var(--ttt-yellow);padding:5px 8px;white-space:nowrap}
.phase-meta{display:flex;align-items:center;gap:10px;margin-left:auto}
.phase-time{font:700 22px/1 var(--ttt-font-narrow);font-variant-numeric:tabular-nums;color:var(--ttt-black)}
.bar{width:120px;height:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ttt-red)}
.bar.over i{background:var(--ttt-black)}
.phase-actions{display:flex;gap:2px}

.steps{list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step.running{background:var(--run-soft)}
.step-name{flex:1;min-width:0;color:var(--ink)}
.step.done .step-name{color:var(--muted);text-decoration:line-through}
.step-time{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right;color:var(--ttt-black)}
.step-est{font-variant-numeric:tabular-nums;min-width:58px;font-size:13px}
.step-est.over{color:var(--warn);font-weight:700}
.chip{border:1px solid #cfc7c7;background:var(--card);color:var(--ttt-gray-700);border-radius:0;padding:5px 8px;font:700 10px/1 var(--ttt-font-wide);letter-spacing:.05em;text-transform:uppercase;min-width:92px}
.chip:hover{border-color:var(--ttt-black);color:var(--ttt-black)}
.chip.doing{background:var(--ttt-yellow);border-color:var(--ttt-yellow);color:var(--ttt-black)}
.chip.done{background:var(--ttt-black);border-color:var(--ttt-black);color:var(--ttt-white)}
.step-actions{display:flex;gap:2px}
.tb-label{margin-left:6px}
.timer-btn{border:1px solid var(--ttt-black);background:var(--card);color:var(--ttt-black);border-radius:0;padding:5px 10px;font:700 10px/1.2 var(--ttt-font-wide);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.timer-btn:hover{background:var(--ttt-red);border-color:var(--ttt-red);color:var(--ttt-white)}
.timer-btn.on{background:var(--ttt-red);border-color:var(--ttt-red);color:var(--ttt-white)}
.timer-btn.on:hover{background:var(--ttt-red-dark);border-color:var(--ttt-red-dark)}
.add-step{width:100%;text-align:left;background:transparent;border:0;border-top:1px dashed var(--line);padding:11px 18px;color:var(--ttt-red);font:700 11px/1.2 var(--ttt-font-wide);letter-spacing:.06em;text-transform:uppercase}
.add-step:hover{background:var(--accent-soft);color:var(--ttt-red-dark)}
.empty{background:var(--card);border:2px dashed #cfc7c7;padding:32px;text-align:center;color:var(--muted)}
.on-dark .btn{background:var(--ttt-red);border-color:var(--ttt-red);color:var(--ttt-white)}
.on-dark .btn:hover{background:var(--ttt-red-dark);border-color:var(--ttt-red-dark)}
.on-dark .btn.ghost{background:transparent;border-color:var(--ttt-yellow);color:var(--ttt-yellow)}
.on-dark .btn.ghost:hover{background:var(--ttt-yellow);color:var(--ttt-black)}

/* ---------- reordering ---------- */
.handle{cursor:grab;touch-action:none;padding:6px 3px}
.handle:active{cursor:grabbing}
.handle:focus{outline:none}
.handle:focus-visible{outline:2px solid var(--ttt-red);outline-offset:1px}
.phase-handle{margin-left:-6px}
.step.dragging,.phase.dragging{display:none}
.drop-ph{list-style:none;height:38px;border:2px dashed var(--ttt-red);background:var(--accent-soft);margin:4px 14px}
.drop-ph.phase-ph{height:60px;margin:0 0 12px;border-color:var(--ttt-yellow);background:rgba(248,193,53,.12)}
.phase.drop-into{box-shadow:0 0 0 3px var(--ttt-yellow)}
#drag-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;max-width:70vw;background:var(--ttt-black);color:var(--ttt-white);border-left:4px solid var(--ttt-red);padding:8px 14px;font-weight:700;box-shadow:var(--ttt-shadow-cta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dragging-on{user-select:none;-webkit-user-select:none}

/* ---------- file drop ---------- */
.filedrop{border:2px dashed #cfc7c7;padding:20px 14px;text-align:center;background:var(--bg)}
.filedrop.over{border-color:var(--ttt-red);background:var(--accent-soft)}
.filedrop .hint{margin-top:9px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;background:var(--card);color:var(--ink)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 10px/1.2 var(--ttt-font-wide);text-transform:uppercase;letter-spacing:.07em;color:var(--ttt-white);background:var(--ttt-black);border-bottom:0}
tbody tr:hover td{background:#faf8f8}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:800;background:var(--card);border-top:2px solid var(--ttt-black);font-size:16px}
#report-table td strong{color:var(--ttt-black)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px}
.filters label{display:block;font:700 10px/1.2 var(--ttt-font-wide);letter-spacing:.07em;text-transform:uppercase;color:var(--ttt-black);margin-bottom:6px}
.filters select{max-width:220px}
#btn-log-add{background:var(--ttt-red);border-color:var(--ttt-red);color:var(--ttt-white)}
#btn-log-add:hover{background:var(--ttt-red-dark);border-color:var(--ttt-red-dark)}
.table-wrap{overflow-x:auto}

/* ---------- report ---------- */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ttt-black);padding:16px 18px}
.stat:first-child{background:var(--ttt-black);border-color:var(--ttt-black);border-top-color:var(--ttt-red)}
.stat:first-child .k{color:var(--ttt-yellow)}
.stat:first-child .v{color:var(--ttt-white)}
.stat .k{font:700 10px/1.2 var(--ttt-font-wide);color:var(--ttt-gray-600);text-transform:uppercase;letter-spacing:.07em}
.stat .v{font:700 44px/1 var(--ttt-font-narrow);font-variant-numeric:tabular-nums;margin-top:10px;color:var(--ttt-black)}
.section-title{display:flex;align-items:center;gap:12px;margin:32px 0 12px;font:700 13px/1.2 var(--ttt-font-wide);text-transform:uppercase;letter-spacing:.08em;color:var(--ttt-black)}
.section-title::before{content:'';width:28px;height:2px;background:var(--ttt-red)}
.daily{display:flex;align-items:flex-end;gap:6px;height:160px;background:var(--card);border:1px solid var(--line);padding:14px}
.daily .day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.daily .day i{display:block;width:100%;background:var(--ttt-red);min-height:2px}
.daily .day.zero i{background:var(--line)}
.daily .day:last-child i{background:var(--ttt-black)}
.daily .day span{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;padding:20px;overflow:auto}
#modal-overlay.open{display:flex;align-items:flex-start;justify-content:center}
#modal{background:var(--card);color:var(--ink);border-top:6px solid var(--ttt-red);border-radius:0;width:100%;max-width:460px;margin-top:8vh;padding:28px;max-height:84vh;overflow-y:auto;box-shadow:var(--ttt-shadow-cta)}
#modal h3{font:700 32px/1 var(--ttt-font-narrow);letter-spacing:.4px;margin-bottom:20px;color:var(--ttt-black)}
.row{margin-bottom:14px}
.row label{display:block;font:700 10px/1.2 var(--ttt-font-wide);letter-spacing:.07em;text-transform:uppercase;color:var(--ttt-black);margin-bottom:6px}
.row input,.row textarea,.row select{width:100%}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
#modal-error{color:var(--danger);font-size:13px;font-weight:600;margin-top:8px;display:none}
#modal-error.on{display:block}

/* ---------- phone ---------- */
@media (max-width:900px){
  #app{padding:14px 12px 70px}
  .wrap{padding:0 12px}
  .brand{width:100%;margin-right:0}
  .topbar{gap:8px}
  .topbar .field{flex:1 0 100%}
  .topbar select{width:100%}
  .hero{padding:28px 0 4px}
  #panel-log.on,#panel-report.on{padding:18px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phase-head{gap:8px;padding:14px}
  .phase-meta{width:100%;margin-left:0}
  .phase-actions{margin-left:auto}
  .bar{flex:1;width:auto}
  .step{flex-wrap:wrap;gap:8px 6px;padding:12px 14px}
  .step-name{flex:1 0 100%;order:-1;white-space:normal}
  .step-est{min-width:auto;font-size:12px}
  .step-time{min-width:auto}
  .tb-label{display:none}
  .timer-btn{padding:6px 10px}
  .step-actions{margin-left:auto}
  .handle{padding:8px 6px}
  .chip{min-width:auto}
  #running-elapsed{margin-left:0}
  .tab{padding:12px 14px}
}

/* ---------- client links ---------- */
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.share-note{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
.share-row{display:flex;gap:6px;align-items:center}
.share-row input{flex:1;min-width:0;font-size:13px}
.share-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- client view ---------- */
.view-pill{display:none}
#view-msg{display:none}
body.view .view-pill{display:inline-block;font:700 10px/1 var(--ttt-font-wide);letter-spacing:.07em;text-transform:uppercase;color:var(--ttt-black);background:var(--ttt-yellow);padding:7px 10px;white-space:nowrap}
body.view #view-msg.on{display:block;margin-top:10px}
body.view.view-empty .tabs,body.view.view-empty .panel,body.view.view-empty #running-bar{display:none!important}
body.view .topbar .field,body.view .topbar .btn,body.view #sync-bar,
body.view .handle,body.view .timer-btn,body.view .step-actions,body.view .phase-actions,
body.view .add-step,body.view #btn-add-phase,body.view #running-stop,body.view #btn-log-add,
body.view .log-row .icon{display:none!important}
body.view .chip{pointer-events:none;cursor:default}
body.view .brand .sub::after{content:' · Client view'}

/* ---------- split a time entry ---------- */
#modal.wide{max-width:640px}
.split-hint{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.5}
.split-bar{position:relative;height:40px;margin:6px 7px 4px;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
.split-segs{position:absolute;inset:0;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.split-seg{position:absolute;top:0;bottom:0;opacity:.9}
.split-cut{position:absolute;top:-6px;bottom:-6px;width:18px;margin-left:-9px;cursor:ew-resize;touch-action:none;outline:none}
.split-cut::after{content:'';position:absolute;left:7px;top:0;bottom:0;width:4px;background:var(--ttt-black)}
.split-cut:focus-visible::after,.split-cut.dragging::after{background:var(--ttt-yellow);box-shadow:0 0 0 2px var(--ttt-black)}
.split-scale{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:0 0 6px}
.split-row{display:grid;grid-template-columns:12px 1fr auto;gap:6px 8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.split-row .sw{width:12px;height:12px}
.split-row .when{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.split-row .when input{width:auto;padding:4px 6px}
.split-row select,.split-row .note{grid-column:2 / 4;width:100%}
.split-row .note{font-size:13px}

<script>
(function () {
'use strict';

/* ============================================================
   Storage
   ------------------------------------------------------------
   Everything lives in one localStorage key. `log` is the single
   source of truth for time: a step's, a phase's and a project's
   totals are always summed from it, never stored alongside it.
   ============================================================ */
var KEY = 'ptt.v1';

/* Client view: opened with #view=<token>, this page is a read-only window
   onto one shared project. It never reads or writes this browser's storage. */
var VIEW = (function () {
  var m = /[#&]view=([\w-]{20,64})/.exec(location.hash);
  return m ? m[1] : null;
})();
var state = null;

function uid(p) { return (p || 'x') + '-' + Math.random().toString(36).slice(2, 9); }

function blankState() {
  return { version: 1, projects: [], log: [], currentId: null };
}

// A plan is [phase name, [step names]] — turned into a real project on demand.
function planToProject(name, plan) {
  return {
    id: uid('p'),
    name: name,
    createdAt: Date.now(),
    phases: plan.map(function (n) {
      return {
        id: uid('ph'),
        name: n[0],
        steps: n[1].map(function (s) {
          return { id: uid('st'), name: s, status: 'todo', estimate: 0 };
        })
      };
    })
  };
}

// The generic skeleton behind "New project".
var STARTER_PLAN = [
  ['Discovery', ['Kick-off call', 'Requirements', 'Scope & quote']],
  ['Design', ['Wireframes', 'Visual design', 'Client review']],
  ['Build', ['Setup', 'Implementation', 'QA pass']],
  ['Launch', ['Deploy', 'Handover']]
];
function starterProject() { return planToProject('My project', STARTER_PLAN); }


function load() {
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  if (raw) {
    try { state = normalise(JSON.parse(raw)); } catch (e) { state = null; }
  }
  if (!state) {
    // a fresh browser — a visitor, a new account — starts from the neutral
    // starter, never from anyone's real project
    state = blankState();
    var p = starterProject();
    state.projects.push(p);
    state.currentId = p.id;
    save();
  }
  if (!currentProject() && state.projects.length) state.currentId = state.projects[0].id;
}

// Tolerate hand-edited or older files: fill in whatever is missing rather than throwing.
function normalise(s) {
  if (!s || typeof s !== 'object') return null;
  var out = blankState();
  out.currentId = s.currentId || null;
  out.projects = (s.projects || []).map(function (p) {
    return {
      id: p.id || uid('p'),
      name: String(p.name == null ? 'Untitled' : p.name),
      shareId: typeof p.shareId === 'string' && /^[\w-]{20,64}$/.test(p.shareId) ? p.shareId : null,
      createdAt: p.createdAt || Date.now(),
      phases: (p.phases || []).map(function (ph) {
        return {
          id: ph.id || uid('ph'),
          name: String(ph.name == null ? 'Phase' : ph.name),
          collapsed: !!ph.collapsed,
          steps: (ph.steps || []).map(function (st) {
            return {
              id: st.id || uid('st'),
              name: String(st.name == null ? 'Step' : st.name),
              status: st.status === 'doing' || st.status === 'done' ? st.status : 'todo',
              estimate: Number(st.estimate) || 0
            };
          })
        };
      })
    };
  });
  out.log = (s.log || []).filter(function (e) { return e && e.stepId && e.start; }).map(function (e) {
    return {
      id: e.id || uid('e'),
      projectId: e.projectId || null,
      phaseId: e.phaseId || null,
      stepId: e.stepId,
      start: Number(e.start),
      end: e.end == null ? null : Number(e.end),
      note: String(e.note || ''),
      source: e.source === 'timer' ? 'timer' : 'manual'
    };
  });
  return out;
}

function save() {
  if (VIEW) return;                 // a client's browser is never written to
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* private mode: keep going in memory */ }
  cloudTouch();
}

// A write made moments before the page goes away can still be sitting in the
// browser's pending batch when the document is torn down. Writing again as the
// page hides gets it committed.
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') save();
});

/* ============================================================
   Lookups and derived time
   ============================================================ */
function currentProject() {
  for (var i = 0; i < state.projects.length; i++) {
    if (state.projects[i].id === state.currentId) return state.projects[i];
  }
  return null;
}
function findPhase(id) {
  var p = currentProject(); if (!p) return null;
  for (var i = 0; i < p.phases.length; i++) if (p.phases[i].id === id) return p.phases[i];
  return null;
}
function findStep(id) {
  var p = currentProject(); if (!p) return null;
  for (var i = 0; i < p.phases.length; i++) {
    for (var j = 0; j < p.phases[i].steps.length; j++) {
      if (p.phases[i].steps[j].id === id) return p.phases[i].steps[j];
    }
  }
  return null;
}
function phaseOfStep(id) {
  var p = currentProject(); if (!p) return null;
  for (var i = 0; i < p.phases.length; i++) {
    for (var j = 0; j < p.phases[i].steps.length; j++) {
      if (p.phases[i].steps[j].id === id) return p.phases[i];
    }
  }
  return null;
}

function entrySeconds(e, now) {
  var end = e.end == null ? (now || Date.now()) : e.end;
  return Math.max(0, Math.round((end - e.start) / 1000));
}
function entriesOfStep(stepId) {
  return state.log.filter(function (e) { return e.stepId === stepId; });
}
function secondsOfStep(stepId, now) {
  return entriesOfStep(stepId).reduce(function (s, e) { return s + entrySeconds(e, now); }, 0);
}
function secondsOfPhase(phase, now) {
  return phase.steps.reduce(function (s, st) { return s + secondsOfStep(st.id, now); }, 0);
}
function secondsOfProject(project, now) {
  return project.phases.reduce(function (s, ph) { return s + secondsOfPhase(ph, now); }, 0);
}
function estimateOfPhase(phase) {
  return phase.steps.reduce(function (s, st) { return s + (st.estimate || 0); }, 0);
}

// One timer at a time: the open entry is the one with no end.
function runningEntry() {
  for (var i = 0; i < state.log.length; i++) if (state.log[i].end == null) return state.log[i];
  return null;
}

/* ============================================================
   Formatting
   ============================================================ */
function fmtHM(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  if (sec === 0) return '0m';
  var h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (m === 60) { h += 1; m = 0; }
  if (h && m) return h + 'h ' + m + 'm';
  if (h) return h + 'h';
  if (m) return m + 'm';
  return '<1m';
}
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h ? h + ':' + mm + ':' + ss : m + ':' + ss;
}
function fmtHours(sec) { return (Math.round((sec / 3600) * 100) / 100).toFixed(2); }

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(ms) { var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtDate(ms) {
  var d = new Date(ms);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtTime(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

// "1h30", "1h 30m", "90", "1.5h", "1:30" → seconds. Bare numbers are minutes.
function parseDuration(raw) {
  var s = String(raw == null ? '' : raw).trim().toLowerCase();
  if (!s) return null;
  if (/^\d+:\d{1,2}$/.test(s)) {
    var parts = s.split(':');
    return Number(parts[0]) * 3600 + Number(parts[1]) * 60;
  }
  var re = /(\d+(?:[.,]\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)?/g;
  var total = 0, matched = false, m;
  while ((m = re.exec(s))) {
    if (!m[0].trim()) { if (re.lastIndex >= s.length) break; re.lastIndex++; continue; }
    var v = parseFloat(m[1].replace(',', '.'));
    if (isNaN(v)) continue;
    var unit = m[2] || 'm';
    total += unit.charAt(0) === 'h' ? v * 3600 : v * 60;
    matched = true;
  }
  return matched ? Math.round(total) : null;
}

// Inline icons — emoji glyphs render differently on every platform, these don't.
function svgIcon(d) {
  return '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">' +
    '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
var ICO = {
  pencil: svgIcon('M11.9 1.9l2.2 2.2-8.4 8.4-2.9.7.7-2.9 8.4-8.4z'),
  plus: svgIcon('M8 3.2v9.6M3.2 8h9.6'),
  trash: svgIcon('M2.9 4.3h10.2M6.3 4.3V2.9h3.4v1.4M4.5 4.3l.6 8.3h5.8l.6-8.3'),
  up: svgIcon('M8 12.8V3.6M4.4 7.2L8 3.6l3.6 3.6'),
  down: svgIcon('M8 3.2v9.2M4.4 8.8L8 12.4l3.6-3.6'),
  chev: svgIcon('M6.2 3.4L10.8 8l-4.6 4.6'),
  split: svgIcon('M4.4 5.6a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4zM4.4 13.8a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4zM5.9 4.9l7.6 6.6M5.9 11.1l7.6-6.6'),
  grip: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">' +
    '<path d="M6 4.2h.01M10 4.2h.01M6 8h.01M10 8h.01M6 11.8h.01M10 11.8h.01" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(id) { return document.getElementById(id); }

/* ============================================================
   Modal
   ============================================================ */
var modalSave = null;
function openModal(title, bodyHTML, onSave, focusId) {
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHTML;
  $('modal-error').classList.remove('on');
  $('modal-error').textContent = '';
  modalSave = onSave;
  $('modal-overlay').classList.add('open');
  var f = focusId && $(focusId);
  if (f) { f.focus(); if (f.select) f.select(); }
}
function closeModal() {
  split = null;
  $('modal').classList.remove('wide');
  pendingImport = null;
  $('modal-overlay').classList.remove('open');
  modalSave = null;
  $('modal-body').innerHTML = '';
}
function modalError(msg) {
  var el = $('modal-error');
  el.textContent = msg;
  el.classList.add('on');
}
$('modal').addEventListener('submit', function (ev) {
  ev.preventDefault();
  if (modalSave && modalSave() !== false) { closeModal(); render(); }
});
$('modal-cancel').addEventListener('click', closeModal);
$('modal-overlay').addEventListener('mousedown', function (ev) {
  if (ev.target === $('modal-overlay')) closeModal();
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && $('modal-overlay').classList.contains('open')) closeModal();
});

function confirmModal(title, message, onYes) {
  openModal(title, '<p style="margin:0 0 4px">' + esc(message) + '</p>', function () {
    onYes();
    save();
    return true;
  });
  $('modal-save').textContent = 'Delete';
  $('modal-save').classList.add('danger');
}
function resetSaveBtn() {
  $('modal-save').textContent = 'Save';
  $('modal-save').classList.remove('danger');
}

/* ============================================================
   Timer
   ============================================================ */
function startTimer(stepId) {
  var open = runningEntry();
  if (open) {
    open.end = Date.now();
    if (open.stepId === stepId) { save(); render(); return; }   // second click stops it
  }
  var ph = phaseOfStep(stepId);
  var st = findStep(stepId);
  if (!st) return;
  state.log.push({
    id: uid('e'),
    projectId: state.currentId,
    phaseId: ph ? ph.id : null,
    stepId: stepId,
    start: Date.now(),
    end: null,
    note: '',
    source: 'timer'
  });
  if (st.status === 'todo') st.status = 'doing';
  save();
  render();
}
function stopTimer() {
  var open = runningEntry();
  if (!open) return;
  open.end = Date.now();
  save();
  render();
}

/* ============================================================
   Render
   ============================================================ */
var activeTab = 'board';

function render() {
  renderProjects();
  renderRunning();
  renderBoard();
  renderLogFilters();
  renderLog();
  renderReport();
  paintShare();
}

function renderProjects() {
  var sel = $('project-select');
  sel.innerHTML = state.projects.map(function (p) {
    return '<option value="' + esc(p.id) + '"' + (p.id === state.currentId ? ' selected' : '') + '>' + esc(p.name) + '</option>';
  }).join('');
}

function renderRunning() {
  var open = runningEntry();
  var bar = $('running-bar');
  if (!open) {
    bar.classList.remove('on');
    document.title = VIEW && state.projects.length ? state.projects[0].name + ' — Project Phases' : 'Project Phases & Time Log';
    return;
  }
  var st = findStep(open.stepId), ph = phaseOfStep(open.stepId);
  bar.classList.add('on');
  $('running-what').textContent = (ph ? ph.name + ' · ' : '') + (st ? st.name : 'step');
  tick();
}

function statusLabel(s) { return s === 'done' ? 'Done' : s === 'doing' ? 'In progress' : 'To do'; }

function renderBoard() {
  var p = currentProject();
  var anyOpen = p && p.phases.some(function (ph) { return !ph.collapsed; });
  $('btn-collapse-all').textContent = anyOpen ? 'Collapse all' : 'Expand all';
  $('btn-collapse-all').style.display = p && p.phases.length ? '' : 'none';
  var board = $('board');
  if (!p) { board.innerHTML = '<div class="empty">No project yet. Create one to get started.</div>'; return; }
  if (!p.phases.length) {
    board.innerHTML = '<div class="empty">No phases yet — add the first phase of <strong>' + esc(p.name) + '</strong>.</div>';
    return;
  }
  var open = runningEntry();
  var now = Date.now();

  board.innerHTML = p.phases.map(function (ph, pi) {
    var logged = secondsOfPhase(ph, now);
    var est = estimateOfPhase(ph);
    var done = ph.steps.filter(function (s) { return s.status === 'done'; }).length;
    var pct = est > 0 ? Math.min(100, Math.round(logged / est * 100)) : (ph.steps.length ? Math.round(done / ph.steps.length * 100) : 0);
    var over = est > 0 && logged > est;

    var steps = ph.steps.map(function (st) {
      var sSec = secondsOfStep(st.id, now);
      var isRunning = !!(open && open.stepId === st.id);
      var stepOver = st.estimate > 0 && sSec > st.estimate;
      return '' +
        '<li class="step ' + st.status + (isRunning ? ' running' : '') + '" data-step="' + esc(st.id) + '">' +
          '<button type="button" class="icon handle" data-act="handle" ' +
            'title="Drag to reorder or drop into another phase — or use the arrow keys" ' +
            'aria-label="Move step">' + ICO.grip + '</button>' +
          '<button type="button" class="chip ' + st.status + '" data-act="cycle" title="Change status">' + statusLabel(st.status) + '</button>' +
          '<span class="step-name">' + esc(st.name) + '</span>' +
          '<span class="step-time"' + (isRunning ? ' id="live-step-time"' : '') + '>' + fmtHM(sSec) + '</span>' +
          '<span class="step-est muted' + (stepOver ? ' over' : '') + '">' + (st.estimate ? '/ ' + fmtHM(st.estimate) : '&nbsp;') + '</span>' +
          '<button type="button" class="timer-btn' + (isRunning ? ' on' : '') + '" data-act="timer" title="' + (isRunning ? 'Stop timer' : 'Start timer') + '">' +
            (isRunning ? '■' : '▶') + '<span class="tb-label">' + (isRunning ? 'Stop' : 'Start') + '</span></button>' +
          '<span class="step-actions">' +
            '<button type="button" class="icon" data-act="manual" title="Log time by hand">' + ICO.plus + '</button>' +
            '<button type="button" class="icon" data-act="edit-step" title="Edit step">' + ICO.pencil + '</button>' +
            '<button type="button" class="icon del" data-act="del-step" title="Delete step">' + ICO.trash + '</button>' +
          '</span>' +
        '</li>';
    }).join('');

    return '' +
      '<section class="phase' + (ph.collapsed ? ' collapsed' : '') + '" data-phase="' + esc(ph.id) + '">' +
        '<header class="phase-head">' +
          '<div class="phase-title">' +
            '<button type="button" class="icon handle phase-handle" data-act="handle" ' +
              'title="Drag to reorder this phase — or use the arrow keys" ' +
              'aria-label="Move phase">' + ICO.grip + '</button>' +
            '<button type="button" class="phase-toggle" data-act="toggle-phase" ' +
              'aria-expanded="' + (ph.collapsed ? 'false' : 'true') + '" ' +
              'title="' + (ph.collapsed ? 'Expand' : 'Collapse') + ' this phase">' +
              '<span class="chev">' + ICO.chev + '</span><h2>' + esc(ph.name) + '</h2></button>' +
            '<span class="pill">' + done + '/' + ph.steps.length + ' steps</span></div>' +
          '<div class="phase-meta">' +
            '<span class="phase-time">' + fmtHM(logged) + '</span>' +
            '<span class="muted nowrap">' + (est ? 'of ' + fmtHM(est) : 'no estimate') + '</span>' +
            '<div class="bar' + (over ? ' over' : '') + '"><i style="width:' + pct + '%"></i></div>' +
          '</div>' +
          '<div class="phase-actions">' +
            '<button type="button" class="icon" data-act="phase-up" title="Move up"' + (pi === 0 ? ' disabled' : '') + '>' + ICO.up + '</button>' +
            '<button type="button" class="icon" data-act="phase-down" title="Move down"' + (pi === p.phases.length - 1 ? ' disabled' : '') + '>' + ICO.down + '</button>' +
            '<button type="button" class="icon" data-act="edit-phase" title="Rename phase">' + ICO.pencil + '</button>' +
            '<button type="button" class="icon del" data-act="del-phase" title="Delete phase">' + ICO.trash + '</button>' +
          '</div>' +
        '</header>' +
        '<ul class="steps">' + steps + '</ul>' +
        '<button type="button" class="add-step" data-act="add-step">+ Add step to ' + esc(ph.name) + '</button>' +
      '</section>';
  }).join('');
}

/* ---------- log ---------- */
var filters = { phaseId: '', stepId: '', from: '', to: '' };

function renderLogFilters() {
  var p = currentProject();
  var fp = $('f-phase'), fs = $('f-step');
  var phases = p ? p.phases : [];
  fp.innerHTML = '<option value="">All phases</option>' + phases.map(function (ph) {
    return '<option value="' + esc(ph.id) + '"' + (filters.phaseId === ph.id ? ' selected' : '') + '>' + esc(ph.name) + '</option>';
  }).join('');

  var stepSource = filters.phaseId ? phases.filter(function (ph) { return ph.id === filters.phaseId; }) : phases;
  var opts = '';
  stepSource.forEach(function (ph) {
    ph.steps.forEach(function (st) {
      opts += '<option value="' + esc(st.id) + '"' + (filters.stepId === st.id ? ' selected' : '') + '>' + esc(ph.name) + ' · ' + esc(st.name) + '</option>';
    });
  });
  fs.innerHTML = '<option value="">All steps</option>' + opts;
  if (filters.stepId && !findStep(filters.stepId)) filters.stepId = '';
  $('f-from').value = filters.from;
  $('f-to').value = filters.to;
}

function visibleEntries() {
  var p = currentProject();
  if (!p) return [];
  var now = Date.now();
  return state.log.filter(function (e) {
    if (!findStep(e.stepId)) return false;                       // belongs to another project
    if (filters.stepId && e.stepId !== filters.stepId) return false;
    if (filters.phaseId) {
      var ph = phaseOfStep(e.stepId);
      if (!ph || ph.id !== filters.phaseId) return false;
    }
    var key = dateKey(e.start);
    if (filters.from && key < filters.from) return false;
    if (filters.to && key > filters.to) return false;
    return true;
  }).sort(function (a, b) { return b.start - a.start; }).map(function (e) {
    return { e: e, sec: entrySeconds(e, now) };
  });
}

function renderLog() {
  var rows = visibleEntries();
  var body = $('log-body');
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="6" class="muted" style="padding:22px;text-align:center">No time logged yet for this filter.</td></tr>';
    $('log-total').textContent = '0m';
    return;
  }
  body.innerHTML = rows.map(function (r) {
    var e = r.e;
    var ph = phaseOfStep(e.stepId), st = findStep(e.stepId);
    var running = e.end == null;
    return '' +
      '<tr class="log-row" data-entry="' + esc(e.id) + '">' +
        '<td class="nowrap">' + fmtDate(e.start) + '<br><span class="muted" style="font-size:12px">' +
          fmtTime(e.start) + '–' + (running ? 'now' : fmtTime(e.end)) + '</span></td>' +
        '<td>' + esc(ph ? ph.name : '—') + '</td>' +
        '<td>' + esc(st ? st.name : '—') + '</td>' +
        '<td class="num">' + fmtHM(r.sec) + (running ? ' <span class="muted">(running)</span>' : '') + '</td>' +
        '<td>' + esc(e.note) + '</td>' +
        '<td class="num">' +
          '<button type="button" class="icon" data-act="split-entry" title="Split between steps">' + ICO.split + '</button>' +
          '<button type="button" class="icon" data-act="edit-entry" title="Edit entry">' + ICO.pencil + '</button>' +
          '<button type="button" class="icon del" data-act="del-entry" title="Delete entry">' + ICO.trash + '</button>' +
        '</td>' +
      '</tr>';
  }).join('');
  $('log-total').textContent = fmtHM(rows.reduce(function (s, r) { return s + r.sec; }, 0));
}

/* ---------- report ---------- */
function renderReport() {
  var p = currentProject();
  var body = $('report-body');
  if (!p) { body.innerHTML = ''; return; }
  var now = Date.now();
  var total = secondsOfProject(p, now);
  var estTotal = p.phases.reduce(function (s, ph) { return s + estimateOfPhase(ph); }, 0);
  var allSteps = p.phases.reduce(function (a, ph) { return a.concat(ph.steps); }, []);
  var doneSteps = allSteps.filter(function (s) { return s.status === 'done'; }).length;
  var entries = state.log.filter(function (e) { return !!findStep(e.stepId); });

  $('stat-logged').textContent = fmtHM(total);
  $('stat-est').textContent = fmtHM(estTotal);
  $('stat-steps').textContent = doneSteps + '/' + allSteps.length;
  $('stat-entries').textContent = String(entries.length);

  var html = '';
  p.phases.forEach(function (ph) {
    var logged = secondsOfPhase(ph, now), est = estimateOfPhase(ph);
    var share = total > 0 ? Math.round(logged / total * 100) : 0;
    html += '<tr>' +
      '<td><strong>' + esc(ph.name) + '</strong></td>' +
      '<td class="num"><strong>' + fmtHM(logged) + '</strong></td>' +
      '<td class="num">' + (est ? fmtHM(est) : '—') + '</td>' +
      '<td class="num">' + deltaCell(logged, est) + '</td>' +
      '<td><div class="bar"><i style="width:' + share + '%"></i></div></td>' +
      '</tr>';
    ph.steps.forEach(function (st) {
      var s = secondsOfStep(st.id, now);
      var sShare = total > 0 ? Math.round(s / total * 100) : 0;
      html += '<tr>' +
        '<td style="padding-left:26px" class="muted">' + esc(st.name) + '</td>' +
        '<td class="num">' + fmtHM(s) + '</td>' +
        '<td class="num muted">' + (st.estimate ? fmtHM(st.estimate) : '—') + '</td>' +
        '<td class="num">' + deltaCell(s, st.estimate) + '</td>' +
        '<td><div class="bar"><i style="width:' + sShare + '%"></i></div></td>' +
        '</tr>';
    });
  });
  body.innerHTML = html;

  // last 14 days
  var buckets = {};
  entries.forEach(function (e) {
    var k = dateKey(e.start);
    buckets[k] = (buckets[k] || 0) + entrySeconds(e, now);
  });
  var days = [], max = 0;
  for (var i = 13; i >= 0; i--) {
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - i);
    var k = dateKey(d.getTime());
    var sec = buckets[k] || 0;
    if (sec > max) max = sec;
    days.push({ d: d, sec: sec });
  }
  $('daily').innerHTML = days.map(function (x) {
    var h = max > 0 ? Math.round(x.sec / max * 100) : 0;
    return '<div class="day' + (x.sec ? '' : ' zero') + '" title="' + fmtHM(x.sec) + '">' +
      '<i style="height:' + h + '%"></i><span>' + x.d.getDate() + '</span></div>';
  }).join('');
}

function deltaCell(logged, est) {
  if (!est) return '<span class="muted">—</span>';
  var d = logged - est;
  if (d === 0) return '<span class="muted">on est</span>';
  if (d > 0) return '<span style="color:var(--warn)">+' + fmtHM(d) + '</span>';
  return '<span class="muted">−' + fmtHM(-d) + '</span>';
}

/* ============================================================
   Live tick — updates text only, so nothing loses focus
   ============================================================ */
function tick() {
  var open = runningEntry();
  if (!open) return;
  var sec = entrySeconds(open, Date.now());
  var el = $('running-elapsed');
  if (el) el.textContent = fmtClock(sec);
  var live = $('live-step-time');
  if (live) live.textContent = fmtHM(secondsOfStep(open.stepId, Date.now()));
  document.title = fmtClock(sec) + ' · Project Phases';
}
setInterval(tick, 1000);

/* ============================================================
   Reordering
   ------------------------------------------------------------
   Two ways in, both ending in the same two moves: drag the grip,
   or focus it and press the arrow keys. A step that lands in a
   different phase takes its time entries with it.
   ============================================================ */
function phaseIndex(id) {
  var p = currentProject();
  if (!p) return -1;
  for (var i = 0; i < p.phases.length; i++) if (p.phases[i].id === id) return i;
  return -1;
}

function moveStep(stepId, toPhaseId, toIndex) {
  var from = phaseOfStep(stepId);
  var to = findPhase(toPhaseId) || from;
  if (!from || !to) return false;
  var i = -1;
  for (var k = 0; k < from.steps.length; k++) if (from.steps[k].id === stepId) { i = k; break; }
  if (i < 0) return false;
  var st = from.steps.splice(i, 1)[0];
  var at = toIndex == null ? to.steps.length : Math.max(0, Math.min(toIndex, to.steps.length));
  to.steps.splice(at, 0, st);
  if (to.id !== from.id) {
    // The log derives its phase from the step, but the stored id should not lie.
    state.log.forEach(function (e) { if (e.stepId === stepId) e.phaseId = to.id; });
  }
  save();
  return true;
}

function movePhaseTo(phaseId, toIndex) {
  var p = currentProject();
  var i = phaseIndex(phaseId);
  if (!p || i < 0) return false;
  var ph = p.phases.splice(i, 1)[0];
  p.phases.splice(Math.max(0, Math.min(toIndex, p.phases.length)), 0, ph);
  save();
  return true;
}

// Put the caret back on the grip that just moved, so arrow keys keep working.
function focusHandle(kind, id) {
  var el = document.querySelector(kind === 'step'
    ? '.step[data-step="' + id + '"] .handle'
    : '.phase[data-phase="' + id + '"] .handle');
  if (el) el.focus();
}

/* ---------- drag ---------- */
var drag = null;

function ghostAt(x, y) {
  if (drag) drag.ghost.style.transform = 'translate(' + (x + 14) + 'px,' + (y - 14) + 'px)';
}

function startDrag(handle, ev) {
  var stepEl = handle.closest('.step');
  var phaseEl = handle.closest('.phase');
  var el = stepEl || phaseEl;
  if (!el) return;
  var kind = stepEl ? 'step' : 'phase';
  var id = kind === 'step' ? stepEl.getAttribute('data-step') : phaseEl.getAttribute('data-phase');
  var thing = kind === 'step' ? findStep(id) : findPhase(id);

  var ghost = document.createElement('div');
  ghost.id = 'drag-ghost';
  ghost.textContent = thing ? thing.name : (kind === 'step' ? 'Step' : 'Phase');
  document.body.appendChild(ghost);

  var holder = document.createElement(kind === 'step' ? 'li' : 'div');
  holder.className = 'drop-ph' + (kind === 'phase' ? ' phase-ph' : '');
  el.parentNode.insertBefore(holder, el.nextSibling);

  drag = { kind: kind, id: id, el: el, ghost: ghost, holder: holder };
  el.classList.add('dragging');
  document.body.classList.add('dragging-on');
  ghostAt(ev.clientX, ev.clientY);

  document.addEventListener('pointermove', onDragMove, { passive: false });
  document.addEventListener('pointerup', onDragUp);
  document.addEventListener('pointercancel', onDragCancel);
}

function clearDropInto() {
  var marked = document.querySelectorAll('.phase.drop-into');
  for (var i = 0; i < marked.length; i++) marked[i].classList.remove('drop-into');
}

function placeStep(y) {
  var phases = document.querySelectorAll('#board > .phase');
  if (!phases.length) return;
  var target = null;
  for (var i = 0; i < phases.length; i++) {
    var r = phases[i].getBoundingClientRect();
    if (y >= r.top && y <= r.bottom) { target = phases[i]; break; }
  }
  if (!target) {
    // Off the ends of the board — stick to the nearest phase rather than doing nothing.
    target = y < phases[0].getBoundingClientRect().top ? phases[0] : phases[phases.length - 1];
  }
  clearDropInto();
  var list = target.querySelector('.steps');
  if (!list) return;
  if (target.classList.contains('collapsed')) {
    // Nothing to aim between while it is shut: dropping adds it to the end.
    target.classList.add('drop-into');
    list.appendChild(drag.holder);
    return;
  }
  var items = list.children, before = null;
  for (var j = 0; j < items.length; j++) {
    var it = items[j];
    if (it === drag.el || !it.classList.contains('step')) continue;
    var rr = it.getBoundingClientRect();
    if (y < rr.top + rr.height / 2) { before = it; break; }
  }
  list.insertBefore(drag.holder, before);
}

function placePhase(y) {
  var board = $('board');
  var items = board.children, before = null;
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it === drag.el || !it.classList.contains('phase')) continue;
    var r = it.getBoundingClientRect();
    if (y < r.top + r.height / 2) { before = it; break; }
  }
  board.insertBefore(drag.holder, before);
}

// Dragging past the edge of the window scrolls the board along.
function autoScroll(y) {
  var margin = 80, h = window.innerHeight;
  if (y < margin) window.scrollBy(0, -Math.ceil((margin - y) / 5));
  else if (y > h - margin) window.scrollBy(0, Math.ceil((y - (h - margin)) / 5));
}

function onDragMove(ev) {
  if (!drag) return;
  ev.preventDefault();
  ghostAt(ev.clientX, ev.clientY);
  autoScroll(ev.clientY);
  if (drag.kind === 'step') placeStep(ev.clientY);
  else placePhase(ev.clientY);
}

function onDragUp() { endDrag(true); }
function onDragCancel() { endDrag(false); }

// How many real siblings sit above the placeholder — the index it should land at,
// counted with the dragged element already out of the way.
function holderIndex(d, cls) {
  var n = d.holder.previousElementSibling, i = 0;
  while (n) {
    if (n !== d.el && n.classList.contains(cls)) i++;
    n = n.previousElementSibling;
  }
  return i;
}

function endDrag(commit) {
  if (!drag) return;
  var d = drag;
  drag = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragUp);
  document.removeEventListener('pointercancel', onDragCancel);
  if (d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  d.el.classList.remove('dragging');
  document.body.classList.remove('dragging-on');
  clearDropInto();

  if (commit && d.holder.parentNode) {
    if (d.kind === 'step') {
      var host = d.holder.parentNode.closest('.phase');
      if (host) moveStep(d.id, host.getAttribute('data-phase'), holderIndex(d, 'step'));
    } else {
      movePhaseTo(d.id, holderIndex(d, 'phase'));
    }
  }
  if (d.holder.parentNode) d.holder.parentNode.removeChild(d.holder);
  document.body.classList.remove('dragging-on');
  render();
  focusHandle(d.kind, d.id);
}

$('board').addEventListener('pointerdown', function (ev) {
  var handle = ev.target.closest && ev.target.closest('[data-act="handle"]');
  if (!handle || drag) return;
  if (ev.button != null && ev.button !== 0) return;
  ev.preventDefault();
  startDrag(handle, ev);
});

// Arrow keys off a focused grip. A step at the top or bottom of its phase
// steps into the neighbouring one, which is the whole point.
$('board').addEventListener('keydown', function (ev) {
  if (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') return;
  var handle = ev.target.closest && ev.target.closest('[data-act="handle"]');
  if (!handle) return;
  var p = currentProject();
  if (!p) return;
  ev.preventDefault();
  var up = ev.key === 'ArrowUp';
  var stepEl = handle.closest('.step');

  if (stepEl) {
    var sid = stepEl.getAttribute('data-step');
    var ph = phaseOfStep(sid);
    if (!ph) return;
    var i = -1;
    for (var k = 0; k < ph.steps.length; k++) if (ph.steps[k].id === sid) { i = k; break; }
    var j = up ? i - 1 : i + 1;
    if (j >= 0 && j < ph.steps.length) {
      moveStep(sid, ph.id, j);
    } else {
      var nb = p.phases[phaseIndex(ph.id) + (up ? -1 : 1)];
      if (!nb) return;
      nb.collapsed = false;                       // show where it went
      moveStep(sid, nb.id, up ? nb.steps.length : 0);
    }
    render();
    focusHandle('step', sid);
    return;
  }

  var phaseEl = handle.closest('.phase');
  if (!phaseEl) return;
  var pid = phaseEl.getAttribute('data-phase');
  var t = phaseIndex(pid) + (up ? -1 : 1);
  if (t < 0 || t >= p.phases.length) return;
  movePhaseTo(pid, t);
  render();
  focusHandle('phase', pid);
});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && drag) endDrag(false);
});

/* ============================================================
   Board interactions
   ============================================================ */
$('board').addEventListener('click', function (ev) {
  var btn = ev.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  var stepEl = btn.closest('.step');
  var phaseEl = btn.closest('.phase');
  var stepId = stepEl && stepEl.getAttribute('data-step');
  var phaseId = phaseEl && phaseEl.getAttribute('data-phase');
  if (act === 'handle') return;                 // the grip is dragged, not clicked
  resetSaveBtn();

  if (act === 'timer') return startTimer(stepId);

  if (act === 'toggle-phase') {
    var tph = findPhase(phaseId);
    if (!tph) return;
    tph.collapsed = !tph.collapsed;
    save(); render();
    return;
  }

  if (act === 'cycle') {
    var st = findStep(stepId);
    if (!st) return;
    st.status = st.status === 'todo' ? 'doing' : st.status === 'doing' ? 'done' : 'todo';
    var open = runningEntry();
    if (st.status === 'done' && open && open.stepId === stepId) stopTimer();
    save(); render();
    return;
  }

  if (act === 'manual') return openTimeEntry(null, stepId);
  if (act === 'edit-step') return editStep(stepId);
  if (act === 'del-step') {
    var s = findStep(stepId);
    var n = entriesOfStep(stepId).length;
    return confirmModal('Delete step', 'Delete “' + (s ? s.name : 'step') + '”' +
      (n ? ' and its ' + n + ' time ' + (n === 1 ? 'entry' : 'entries') : '') + '?', function () {
      var ph = phaseOfStep(stepId);
      if (ph) ph.steps = ph.steps.filter(function (x) { return x.id !== stepId; });
      state.log = state.log.filter(function (e) { return e.stepId !== stepId; });
    });
  }
  if (act === 'add-step') return editStep(null, phaseId);
  if (act === 'edit-phase') return editPhase(phaseId);
  if (act === 'del-phase') {
    var ph2 = findPhase(phaseId);
    if (!ph2) return;
    var count = ph2.steps.reduce(function (s, st2) { return s + entriesOfStep(st2.id).length; }, 0);
    return confirmModal('Delete phase', 'Delete “' + ph2.name + '”, its ' + ph2.steps.length + ' steps' +
      (count ? ' and ' + count + ' time ' + (count === 1 ? 'entry' : 'entries') : '') + '?', function () {
      var p = currentProject();
      var ids = ph2.steps.map(function (s) { return s.id; });
      p.phases = p.phases.filter(function (x) { return x.id !== phaseId; });

    });
  }
  if (act === 'phase-up' || act === 'phase-down') {
    var pr = currentProject();
    var i = pr.phases.findIndex(function (x) { return x.id === phaseId; });
    var j = act === 'phase-up' ? i - 1 : i + 1;
    if (i < 0 || j < 0 || j >= pr.phases.length) return;
    var tmp = pr.phases[i]; pr.phases[i] = pr.phases[j]; pr.phases[j] = tmp;
    save(); render();
  }
});

/* ============================================================
   Split a time entry
   ------------------------------------------------------------
   Forgetting to switch timers is normal. Any entry — including the one
   running now — can be cut into consecutive pieces, each given to a
   step. The pieces cover exactly the original span, end to end, so no
   minute is lost or counted twice, and the log stays the only place
   time lives. Split a running timer and its last piece keeps running.
   ============================================================ */
var MIN = 60000;
var SPLIT_COLOURS = ['var(--ttt-red)', 'var(--ttt-black)', 'var(--ttt-yellow)', 'var(--ttt-gray-600)', 'var(--ttt-red-dark)', '#cfc7c7'];
var split = null;       // { entry, start, end, running, cuts:[ms], steps:[id], notes:[text] }

function splitBounds() { return [split.start].concat(split.cuts, [split.end]); }
function snapMin(ms) { return Math.round(ms / MIN) * MIN; }
function fmtWhen(ms) {
  // add the date only when the entry crosses midnight
  return dateKey(split.start) === dateKey(split.end) ? fmtTime(ms) : fmtDate(ms) + ' ' + fmtTime(ms);
}
/* Keep cut i at least a minute clear of its neighbours. */
function clampCut(i, ms) {
  var b = splitBounds();
  return Math.max(b[i] + MIN, Math.min(b[i + 2] - MIN, ms));
}

function openSplit(entryId) {
  var e = state.log.filter(function (x) { return x.id === entryId; })[0];
  if (!e) return;
  resetSaveBtn();
  if (!findStep(e.stepId)) {
    openModal('Split time', '<p class="muted" style="margin:0">That time belongs to another project — switch to it first.</p>', function () { return true; });
    return;
  }
  var end = e.end == null ? Date.now() : e.end;
  if (end - e.start < 2 * MIN) {
    openModal('Split time', '<p class="muted" style="margin:0">This entry is under two minutes — too short to split.</p>', function () { return true; });
    return;
  }
  var mid = snapMin(e.start + (end - e.start) / 2);
  split = { entry: e, start: e.start, end: end, running: e.end == null, cuts: [], steps: [e.stepId], notes: [e.note || ''] };
  split.cuts = [Math.max(e.start + MIN, Math.min(end - MIN, mid))];
  split.steps.push(e.stepId);
  split.notes.push('');

  openModal(split.running ? 'Split the running timer' : 'Split time entry', '<div id="split-ui"></div>', saveSplit);
  $('modal').classList.add('wide');
  $('modal-save').textContent = 'Split';
  wireSplit($('split-ui'));
  paintSplit();
}

function paintSplit() {
  var s = split, n = s.cuts.length + 1, html = '';
  html += '<p class="split-hint">Tap the bar to add a cut, drag a cut to move it, or type the exact time. ' +
    'Give each piece its step' + (s.running ? ' — the last piece keeps running.' : '.') + '</p>';
  html += '<div class="split-bar" id="split-bar"><div class="split-segs">';
  for (var i = 0; i < n; i++) {
    html += '<div class="split-seg" data-seg-bar="' + i + '" style="background:' + SPLIT_COLOURS[i % SPLIT_COLOURS.length] + '"></div>';
  }
  html += '</div>';
  s.cuts.forEach(function (c, k) {
    html += '<span class="split-cut" data-cut-handle="' + k + '" tabindex="0" role="slider" aria-label="Cut ' + (k + 1) + '"></span>';
  });
  html += '</div><div class="split-scale"><span>' + fmtWhen(s.start) + '</span><span>' +
    (s.running ? 'now' : fmtWhen(s.end)) + '</span></div>';

  for (var j = 0; j < n; j++) {
    html += '<div class="split-row">' +
      '<span class="sw" style="background:' + SPLIT_COLOURS[j % SPLIT_COLOURS.length] + '"></span>' +
      '<span class="when"><span data-from="' + j + '"></span> → ' +
        (j < n - 1 ? '<input type="time" step="60" data-cut="' + j + '" aria-label="Piece ' + (j + 1) + ' ends at">'
                   : '<span>' + (s.running ? 'now, and running' : fmtWhen(s.end)) + '</span>') +
        ' <span class="muted" data-dur="' + j + '"></span></span>' +
      (j > 0 ? '<button type="button" class="icon del" data-merge="' + j + '" title="Remove this cut — join with the piece above">' + ICO.trash + '</button>' : '<span></span>') +
      '<select data-seg="' + j + '" aria-label="Step for piece ' + (j + 1) + '">' + stepOptions(s.steps[j]) + '</select>' +
      '<input type="text" class="note" data-note="' + j + '" placeholder="Note (optional)" value="' + esc(s.notes[j]) + '">' +
    '</div>';
  }
  html += '<button type="button" class="btn ghost split-add" id="split-add">+ Add a cut</button>';
  $('split-ui').innerHTML = html;
  layoutSplit();
}

/* Moves things in place, so a cut being dragged keeps hold of the pointer. */
function layoutSplit() {
  var s = split, b = splitBounds(), span = s.end - s.start;
  function pct(ms) { return ((ms - s.start) / span * 100) + '%'; }
  var ui = $('split-ui');
  for (var i = 0; i < b.length - 1; i++) {
    var bar = ui.querySelector('[data-seg-bar="' + i + '"]');
    if (bar) { bar.style.left = pct(b[i]); bar.style.width = ((b[i + 1] - b[i]) / span * 100) + '%'; }
    var from = ui.querySelector('[data-from="' + i + '"]');
    if (from) from.textContent = fmtWhen(b[i]);
    var dur = ui.querySelector('[data-dur="' + i + '"]');
    if (dur) dur.textContent = '· ' + fmtHM(Math.round((b[i + 1] - b[i]) / 1000));
    var inp = ui.querySelector('input[data-cut="' + i + '"]');
    if (inp && document.activeElement !== inp) inp.value = fmtTime(b[i + 1]);
  }
  s.cuts.forEach(function (c, k) {
    var h = ui.querySelector('[data-cut-handle="' + k + '"]');
    if (h) { h.style.left = pct(c); h.setAttribute('aria-valuetext', fmtWhen(c)); }
  });
}

function addCutAt(ms) {
  var s = split, b = splitBounds();
  if (!isFinite(ms)) return;
  ms = snapMin(ms);
  for (var i = 0; i < b.length - 1; i++) {
    if (ms > b[i] && ms < b[i + 1]) {
      if (ms - b[i] < MIN || b[i + 1] - ms < MIN) return;    // too close to an existing edge
      s.cuts.splice(i, 0, ms);
      s.steps.splice(i + 1, 0, s.steps[i]);
      s.notes.splice(i + 1, 0, '');
      paintSplit();
      return;
    }
  }
}

/* A typed time means the first moment at or after the previous edge. */
function resolveTime(k, hhmm) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
  if (!m) return null;
  var b = splitBounds(), lo = b[k], hi = b[k + 2];
  var d = new Date(lo);
  d.setHours(+m[1], +m[2], 0, 0);
  while (d.getTime() <= lo) d.setDate(d.getDate() + 1);
  var ms = d.getTime();
  return ms >= lo + MIN && ms <= hi - MIN ? ms : null;
}

function wireSplit(ui) {
  ui.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-seg')) { split.steps[+t.getAttribute('data-seg')] = t.value; return; }
    if (t.hasAttribute('data-cut')) {
      var k = +t.getAttribute('data-cut');
      var ms = resolveTime(k, t.value);
      if (ms == null) {
        modalError('That time has to fall inside this entry, at least a minute from the next cut.');
      } else {
        $('modal-error').classList.remove('on');
        split.cuts[k] = ms;
      }
      t.blur();
      layoutSplit();
    }
  });
  ui.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-note')) split.notes[+t.getAttribute('data-note')] = t.value;
  });
  ui.addEventListener('click', function (ev) {
    var mg = ev.target.closest('[data-merge]');
    if (mg) {
      var j = +mg.getAttribute('data-merge');
      split.cuts.splice(j - 1, 1);
      var joined = [split.notes[j - 1], split.notes[j]].filter(function (x) { return x && x.trim(); }).join(' · ');
      split.notes.splice(j - 1, 2, joined);
      split.steps.splice(j, 1);
      paintSplit();
      return;
    }
    if (ev.target.id === 'split-add') {
      var b = splitBounds(), best = 0;
      for (var i = 1; i < b.length - 1; i++) if (b[i + 1] - b[i] > b[best + 1] - b[best]) best = i;
      if (b[best + 1] - b[best] >= 2 * MIN) addCutAt(b[best] + (b[best + 1] - b[best]) / 2);
      else modalError('Every piece is already a minute or two — nothing left to cut.');
    }
  });

  var drag = null;
  function msAt(clientX) {
    var r = $('split-bar').getBoundingClientRect();
    if (!(r.width > 0) || !isFinite(clientX)) return null;   // nothing laid out to measure against
    var f = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    return split.start + f * (split.end - split.start);
  }
  ui.addEventListener('pointerdown', function (ev) {
    var h = ev.target.closest('[data-cut-handle]');
    if (h) {
      ev.preventDefault();
      drag = { k: +h.getAttribute('data-cut-handle'), el: h };
      h.classList.add('dragging');
      try { h.setPointerCapture(ev.pointerId); } catch (e) {}
      return;
    }
    if (ev.target.closest('#split-bar')) { ev.preventDefault(); var at = msAt(ev.clientX); if (at != null) addCutAt(at); }
  });
  ui.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var at = msAt(ev.clientX);
    if (at == null) return;
    split.cuts[drag.k] = clampCut(drag.k, snapMin(at));
    layoutSplit();
  });
  function endDrag() {
    if (!drag) return;
    drag.el.classList.remove('dragging');
    drag = null;
  }
  ui.addEventListener('pointerup', endDrag);
  ui.addEventListener('pointercancel', endDrag);

  // a focused cut moves a minute per arrow press, five with shift
  ui.addEventListener('keydown', function (ev) {
    var h = ev.target.closest && ev.target.closest('[data-cut-handle]');
    if (!h || (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight')) return;
    ev.preventDefault();
    var k = +h.getAttribute('data-cut-handle');
    var step = (ev.shiftKey ? 5 : 1) * MIN * (ev.key === 'ArrowLeft' ? -1 : 1);
    split.cuts[k] = clampCut(k, split.cuts[k] + step);
    layoutSplit();
  });
}

function saveSplit() {
  var s = split;
  if (!s) return true;
  var e = s.entry;
  var at = state.log.indexOf(e);
  if (at === -1) { modalError('This entry changed on another device. Close and try again.'); return false; }

  // a running timer stopped meanwhile (here or elsewhere) ends where it stopped
  var last = s.running ? e.end : s.end;
  if (last != null && s.cuts[s.cuts.length - 1] > last - MIN) {
    modalError('The timer stopped before the last cut. Move the cut earlier.');
    return false;
  }

  // never write a piece that isn't a real, forward, minute-or-longer span
  var edges = [s.start].concat(s.cuts, [last == null ? Date.now() : last]);
  for (var q = 1; q < edges.length; q++) {
    if (!isFinite(edges[q]) || edges[q] - edges[q - 1] < MIN) {
      modalError('Those cuts don\'t line up — every piece needs at least a minute. Move a cut and try again.');
      return false;
    }
  }
  var b = [s.start].concat(s.cuts, [last]);
  var pieces = [];
  for (var i = 0; i < s.steps.length; i++) {
    var note = (s.notes[i] || '').trim();
    var prev = pieces[pieces.length - 1];
    if (prev && prev.stepId === s.steps[i]) {           // neighbours on the same step become one piece
      prev.end = b[i + 1];
      if (note) prev.note = prev.note ? prev.note + ' · ' + note : note;
    } else {
      pieces.push({ stepId: s.steps[i], start: b[i], end: b[i + 1], note: note });
    }
  }

  var entries = pieces.map(function (p, i) {
    var ph = phaseOfStep(p.stepId), st = findStep(p.stepId);
    if (st && st.status === 'todo') st.status = 'doing';
    return {
      id: i === 0 ? e.id : uid('e'),
      projectId: e.projectId, phaseId: ph ? ph.id : null, stepId: p.stepId,
      start: p.start, end: p.end, note: p.note, source: e.source
    };
  });
  state.log.splice.apply(state.log, [at, 1].concat(entries));
  split = null;
  save();
  return true;
}

function download(name, mime, text) {
  var blob = new Blob([text], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function csvCell(v) {

function logCSV() {

  var rows = [['Project', 'Phase', 'Step', 'Date', 'Start', 'End', 'Hours', 'Duration', 'Source', 'Note']];
  visibleEntries().forEach(function (r) {
    var e = r.e, ph = phaseOfStep(e.stepId), st = findStep(e.stepId);
    rows.push([
      p ? p.name : '', ph ? ph.name : '', st ? st.name : '',
      dateKey(e.start), fmtTime(e.start), e.end == null ? '' : fmtTime(e.end),
      fmtHours(r.sec), fmtHM(r.sec), e.source, e.note
    ]);
  });
  return rows.map(function (r) { return r.map(csvCell).join(','); }).join('\n');
}

var pendingImport = null;

function describeImport(next) {
  var n = next.projects.length;
  var phases = next.projects.reduce(function (a, x) { return a + x.phases.length; }, 0);
  return n + (n === 1 ? ' project' : ' projects') + ' · ' +
    phases + (phases === 1 ? ' phase' : ' phases') + ' · ' +
    next.log.length + ' time ' + (next.log.length === 1 ? 'entry' : 'entries');
}

// Read the chosen file straight away, so the Import button only ever commits
// something already parsed and checked.
function readImportFile(file) {
  var status = $('imp-status');
  pendingImport = null;
  if (!file) return;
  if (!/\.json$/i.test(file.name) && String(file.type || '').indexOf('json') === -1) {
    modalError('Pick the .json file you exported from this tool.');
    return;
  }
  if (status) status.textContent = 'Reading ' + file.name + '…';
  var reader = new FileReader();
  reader.onload = function () {
    var next = null;
    try { next = normalise(JSON.parse(String(reader.result))); } catch (e) { next = null; }
    if (!next) { modalError('That file is not valid JSON.'); if (status) status.textContent = 'Nothing to import.'; return; }
    if (!next.projects.length) { modalError('No projects found in that file.'); if (status) status.textContent = 'Nothing to import.'; return; }
    pendingImport = next;
    $('modal-error').classList.remove('on');
    if (status) status.innerHTML = '<strong>' + esc(file.name) + '</strong><br>' + esc(describeImport(next));
  };
  reader.onerror = function () { modalError('That file could not be read.'); };
  reader.readAsText(file);
}
