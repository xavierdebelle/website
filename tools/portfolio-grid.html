<style>
  :root {
    --bg: #f3f1ec;
    --surface: #ffffff;
    --surface-sunken: #e9e6df;
    --ink: #201e1c;
    --ink-dim: #726b62;
    --ink-faint: #a39a8d;
    --accent: #a8641f;
    --accent-ink: #ffffff;
    --line: #d9d4c9;
    --danger: #a13a2f;
    --radius-s: 3px;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18171b;
      --surface: #221f24;
      --surface-sunken: #29262b;
      --ink: #f1ece3;
      --ink-dim: #a89f92;
      --ink-faint: #6f665c;
      --accent: #dd9a52;
      --accent-ink: #201205;
      --line: #38343a;
      --danger: #e08677;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #18171b;
    --surface: #221f24;
    --surface-sunken: #29262b;
    --ink: #f1ece3;
    --ink-dim: #a89f92;
    --ink-faint: #6f665c;
    --accent: #dd9a52;
    --accent-ink: #201205;
    --line: #38343a;
    --danger: #e08677;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f1ec;
    --surface: #ffffff;
    --surface-sunken: #e9e6df;
    --ink: #201e1c;
    --ink-dim: #726b62;
    --ink-faint: #a39a8d;
    --accent: #a8641f;
    --accent-ink: #ffffff;
    --line: #d9d4c9;
    --danger: #a13a2f;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--wall-bg, var(--bg));
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  button, input { font: inherit; color: inherit; }
  button {
    cursor: pointer;
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    color: var(--ink);
    padding: .5rem .8rem;
  }
  button:hover { border-color: var(--ink-faint); }
  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { border-color: transparent; color: var(--ink-dim); }
  button.ghost:hover { color: var(--ink); border-color: var(--line); }

  /* ---- topbar ---- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .6rem 1rem;
    padding: .7rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--font-mono);
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }
  .brand .count {
    color: var(--ink-faint);
    font-weight: 400;
    margin-left: .6em;
  }
  .topbar .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  button.icon-label { display: inline-flex; align-items: center; gap: .45rem; }

  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    display: flex;
    flex-direction: column;
    min-width: 120px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    box-shadow: 0 8px 24px rgba(20,18,16,.16);
    overflow: hidden;
    z-index: 30;
  }
  .dropdown-menu[hidden] { display: none; }
  .dropdown-menu button {
    border: none;
    border-radius: 0;
    text-align: left;
    padding: .55rem .75rem;
  }
  .dropdown-menu button + button { border-top: 1px solid var(--line); }
  .dropdown-menu button:hover { background: var(--surface-sunken); }

  /* ---- layout menu: columns, gap, background ---- */
  .swatch-dot {
    display: inline-block;
    width: .85em; height: .85em;
    border-radius: 50%;
    border: 1px solid var(--ink-faint);
    background: var(--bg);
    vertical-align: -1px;
    margin-right: .45em;
  }
  .layout-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    width: 248px;
    max-width: calc(100vw - 24px);
    padding: .85rem;
    display: flex;
    flex-direction: column;
    gap: .6rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(20,18,16,.16);
    z-index: 30;
  }
  .layout-menu[hidden] { display: none; }
  .menu-label {
    font-family: var(--font-mono);
    font-size: .6rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .menu-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .5rem;
  }
  .menu-value {
    font-family: var(--font-mono);
    font-size: .7rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
  }
  .menu-sep { height: 1px; background: var(--line); margin: .15rem 0; }
  .seg {
    display: grid;
    grid-template-columns: repeat(var(--seg-cols, 5), 1fr);
    gap: 4px;
  }
  .seg button {
    padding: .35rem 0;
    font-size: .78rem;
    font-variant-numeric: tabular-nums;
  }
  .seg button.on {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .layout-menu input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  .swatches {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
  }
  .swatch {
    width: 100%;
    aspect-ratio: 1;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(128,120,110,.45);
  }
  .swatch:hover { border-color: var(--ink-dim); }
  .swatch.on { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bg-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
  }
  .bg-row label {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .82rem;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .bg-row button { padding: .35rem .6rem; font-size: .82rem; }

  /* ---- grid ---- */
  /* columns and gap come from the Layout menu; the gap also frames the edges */
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
    gap: var(--gap, 4px);
    padding: var(--gap, 4px);
  }
  body.drag-over .grid { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .tile {
    position: relative;
    aspect-ratio: 4 / 5;
    background: var(--surface-sunken);
    overflow: hidden;
  }
  .tile .media {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: element;
  }
  .tile video.media { pointer-events: none; }
  .tile .media.missing {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    text-align: center;
    font-size: .75rem;
    color: var(--ink-faint);
    background: var(--surface-sunken);
  }
  /* videos play muted; this turns the sound on for one of them */
  .tile .sound-btn {
    position: absolute;
    right: 5px; bottom: 5px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: none;
    background: rgba(20,18,16,.55);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    opacity: 0;
    transition: opacity .12s;
    z-index: 2;
  }
  .tile:hover .sound-btn,
  .tile .sound-btn:focus-visible,
  .tile .sound-btn.on { opacity: 1; }
  .tile .sound-btn:hover { background: var(--accent); }
  .tile.photo { cursor: grab; }
  .tile.photo:active { cursor: grabbing; }
  .tile.photo.dragging { opacity: .35; }
  .tile.photo:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tile.drop-target::after {
    content: "";
    position: absolute; inset: 0;
    border: 2px solid var(--accent);
    pointer-events: none;
  }
  .tile .frame-no {
    position: absolute;
    left: 5px; bottom: 4px;
    font-family: var(--font-mono);
    font-size: .62rem;
    letter-spacing: .02em;
    color: #fff;
    text-shadow: 0 0 3px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.9);
    pointer-events: none;
  }
  .tile .remove {
    position: absolute;
    top: 4px; right: 4px;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(20,18,16,.55);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: .85rem;
    line-height: 1;
    padding: 0;
    opacity: 0;
    transition: opacity .12s;
  }
  .tile.photo:hover .remove,
  .tile .remove:focus-visible { opacity: 1; }
  .tile .remove:hover { background: var(--danger); }

  /* dropping a file from outside onto a tile swaps that photo */
  .tile.replace-target::after {
    content: "";
    position: absolute; inset: 0;
    border: 2px solid var(--accent);
    background: rgba(168,100,31,.3);
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    pointer-events: none;
  }
  .tile.replace-target::before {
    content: "Replace";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    font-family: var(--font-mono);
    font-size: .56rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent-ink);
    background: var(--accent);
    padding: .25rem .45rem;
    border-radius: 2px;
    pointer-events: none;
  }

  /* ---- empty state ---- */
  .empty {
    min-height: 72vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    text-align: center;
    padding: 2rem;
    color: var(--ink-dim);
  }
  .empty p { margin: 0; font-size: .9rem; max-width: 32ch; }
  .empty input { display: none; }

  /* ---- crop modal ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(16,14,12,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 50;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }
  /* keep fixed-height rows (the crop stage above all) from being flex-shrunk
     to nothing on short windows — the modal scrolls instead */
  .modal > * { flex-shrink: 0; }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .8rem 1rem;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .modal-head button {
    border: none;
    padding: 0 .2rem;
    font-size: 1.15rem;
    line-height: 1;
    color: var(--ink-dim);
  }
  .modal-head button:hover { color: var(--ink); }
  .modal-hint {
    padding: .6rem 1rem 0;
    font-size: .74rem;
    color: var(--ink-dim);
  }
  .crop-stage {
    position: relative;
    width: 100%;
    height: 264px;
    margin-top: .6rem;
    background: var(--surface-sunken);
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .crop-stage.grabbing { cursor: grabbing; }
  .crop-stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  /* the frame marks the exact region that survives the 4:5 crop */
  .crop-frame {
    position: absolute;
    left: 0; top: 0;
    width: 0; height: 0;
    outline: 2px solid #fff;
    box-shadow: 0 0 0 9999px rgba(14,12,10,.52);
    pointer-events: none;
  }
  .crop-frame::before,
  .crop-frame::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  .crop-frame::before {
    left: 33.333%; right: 33.333%; top: 0; bottom: 0;
    border-left: 1px solid rgba(255,255,255,.38);
    border-right: 1px solid rgba(255,255,255,.38);
  }
  .crop-frame::after {
    top: 33.333%; bottom: 33.333%; left: 0; right: 0;
    border-top: 1px solid rgba(255,255,255,.38);
    border-bottom: 1px solid rgba(255,255,255,.38);
  }

  .crop-zoom {
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .9rem 1rem 0;
  }
  .crop-zoom label {
    font-family: var(--font-mono);
    font-size: .6rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .crop-zoom input[type="range"] {
    flex: 1;
    min-width: 0;
    accent-color: var(--accent);
  }
  .crop-zoom .zoom-value {
    font-family: var(--font-mono);
    font-size: .7rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
    width: 5ch;
    text-align: right;
  }
  /* touch has no drag-and-drop and no hover, so swapping a photo lives here */
  .crop-replace {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    margin: .7rem 1rem 0;
    padding: .55rem .8rem;
    border: 1px dashed var(--line);
    border-radius: var(--radius-s);
    color: var(--ink-dim);
    font-size: .78rem;
  }
  .crop-replace:hover {
    color: var(--ink);
    border-style: solid;
    border-color: var(--ink-faint);
  }
  .crop-replace svg { flex-shrink: 0; }

  .crop-foot {
    padding: 1rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .crop-preview-wrap { display: flex; flex-direction: column; gap: .4rem; }
  .crop-preview-label {
    font-family: var(--font-mono);
    font-size: .6rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .crop-preview {
    width: 72px;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--surface-sunken);
  }
  .crop-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .crop-actions { display: flex; gap: .5rem; }

  /* ---- lock & present ---- */
  body.presenting .topbar,
  body.presenting .tile .remove,
  body.presenting .tile .replace,
  body.presenting .tile .frame-no,
  body.presenting .empty { display: none; }
  body.presenting .tile.photo { cursor: default; }
  .present-exit {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 120;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    padding: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20,18,16,.62);
    color: #fff;
    opacity: .18;
    transition: opacity .2s;
  }
  body.presenting .present-exit { display: flex; }
  .present-exit:hover, .present-exit:focus-visible { opacity: 1; background: var(--accent); }

  /* no hover on touch — the tile controls have to stay put to be reachable */
  @media (hover: none) {
    .present-exit { opacity: .55; }
    .tile .sound-btn { opacity: 1; }
    .tile .remove {
      opacity: 1;
      width: 26px;
      height: 26px;
      font-size: 1rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="topbar">
  <span class="brand">Portfolio<span class="count" id="brandCount">0</span></span>
  <div class="actions">
    <button class="ghost" id="addBtn" type="button">Add media</button>
    <input type="file" id="photoInput" accept="image/*,video/*" multiple hidden />
    <div class="dropdown" id="layoutDropdown">
      <button class="ghost" id="layoutBtn" type="button" aria-haspopup="true" aria-expanded="false"><span class="swatch-dot" id="bgDot"></span>Layout</button>
      <div class="layout-menu" id="layoutMenu" hidden>
        <span class="menu-label">Columns</span>
        <div class="seg" id="colSeg" role="group" aria-label="Columns"></div>
        <div class="menu-sep"></div>

          <label class="menu-label" for="gapInput">Gap between photos</label>
          <span class="menu-value" id="gapValue">4 px</span>
        </div>
        <input type="range" id="gapInput" min="0" max="40" step="1" value="4" />
        <div class="menu-sep"></div>
        <span class="menu-label">Background</span>
        <div class="swatches" id="bgSwatches"></div>
        <div class="bg-row">
          <label><input type="color" id="bgCustom" value="#ffffff" />Custom</label>
          <button class="ghost" id="bgDefault" type="button">Default</button>
        </div>
      </div>

    <div class="dropdown" id="exportDropdown">
      <button class="ghost" id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false">Export</button>

        <button type="button" data-format="jpeg">JPEG</button>
        <button type="button" data-format="pdf">PDF</button>
      </div>

    <button class="ghost" id="clearBtn" type="button">Clear all</button>
    <button class="primary icon-label" id="presentBtn" type="button" title="Lock the wall and present it full screen"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Lock &amp; present</button>

</div>

<div class="grid" id="grid"></div>

<div class="empty" id="emptyState">
  <p>Drop photos, GIFs or videos anywhere, or add a few to lay out your portfolio grid.</p>
  <button class="primary" id="emptyAddBtn" type="button">Add media</button>
</div>

<button class="present-exit" id="presentExit" type="button" aria-label="Unlock and leave presentation" title="Unlock (Esc)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>

<div class="modal-backdrop" id="cropBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Crop photo">
    <div class="modal-head">
      <span>Crop photo</span>
      <button class="ghost" id="cropClose" type="button" aria-label="Close">×</button>
    </div>
    <p class="modal-hint">Drag the frame to choose what shows in the tile. Zoom to crop in closer. Videos are framed on a still of the moment you opened this.</p>
    <div class="crop-stage" id="cropStage">
      <img id="cropImg" alt="" draggable="false" />
      <div class="crop-frame" id="cropFrame"></div>
    </div>
    <button class="crop-replace" id="cropReplace" type="button">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h14"/><path d="M14 5l3 3-3 3"/><path d="M21 16H7"/><path d="M10 13l-3 3 3 3"/></svg>
      Replace
    </button>
    <input type="file" id="cropReplaceInput" accept="image/*,video/*" hidden />
    <div class="crop-zoom">
      <label for="cropZoom">Zoom</label>
      <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" />
      <span class="zoom-value" id="cropZoomValue">1.00×</span>
    </div>
    <div class="crop-foot">
      <div class="crop-preview-wrap">
        <span class="crop-preview-label">Grid preview</span>
        <div class="crop-preview">
          <img id="cropPreviewImg" alt="" draggable="false" />
        </div>
      </div>
      <div class="crop-actions">
        <button class="ghost" id="cropReset" type="button">Reset crop</button>
        <button class="primary" id="cropSave" type="button">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = "portfolio-tool-state-v1";
  const MEDIA_DB = "portfolio-grid-media";
  const MAX_DIM = 1080;
  const DEFAULT_GAP = 4;
  const DEFAULT_COLS = 3;
  const MAX_COLS = 8;
  const BG_SWATCHES = ["#ffffff", "#f3f1ec", "#e9e6df", "#cfc8bb", "#8a8378",
                       "#3a3633", "#18171b", "#000000", "#ffe800", "#a8641f"];

  const state = loadState();

  const grid = document.getElementById("grid");
  const emptyState = document.getElementById("emptyState");
  const brandCount = document.getElementById("brandCount");
  const addBtn = document.getElementById("addBtn");
  const emptyAddBtn = document.getElementById("emptyAddBtn");
  const photoInput = document.getElementById("photoInput");
  const clearBtn = document.getElementById("clearBtn");
  const exportBtn = document.getElementById("exportBtn");
  const exportMenu = document.getElementById("exportMenu");
  const exportDropdown = document.getElementById("exportDropdown");
  const layoutBtn = document.getElementById("layoutBtn");
  const layoutMenu = document.getElementById("layoutMenu");
  const layoutDropdown = document.getElementById("layoutDropdown");
  const colSeg = document.getElementById("colSeg");
  const gapInput = document.getElementById("gapInput");
  const gapValue = document.getElementById("gapValue");
  const bgSwatches = document.getElementById("bgSwatches");
  const bgCustom = document.getElementById("bgCustom");
  const bgDefault = document.getElementById("bgDefault");
  const bgDot = document.getElementById("bgDot");
  const presentBtn = document.getElementById("presentBtn");
  const presentExit = document.getElementById("presentExit");
  const cropBackdrop = document.getElementById("cropBackdrop");
  const cropStage = document.getElementById("cropStage");
  const cropImg = document.getElementById("cropImg");
  const cropFrame = document.getElementById("cropFrame");
  const cropZoomInput = document.getElementById("cropZoom");
  const cropZoomValue = document.getElementById("cropZoomValue");
  const cropPreviewImg = document.getElementById("cropPreviewImg");
  const cropClose = document.getElementById("cropClose");
  const cropSave = document.getElementById("cropSave");
  const cropReset = document.getElementById("cropReset");
  const cropReplaceBtn = document.getElementById("cropReplace");
  const cropReplaceInput = document.getElementById("cropReplaceInput");

  const MAX_ZOOM = 4;
  const TILE_W = 4, TILE_H = 5;

  const svg = (paths, size = 12) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
  const SOUND_OFF_SVG = svg('<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>');
  const SOUND_ON_SVG = svg('<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>');

  function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // The source rectangle a 4:5 tile shows: the largest tile-shaped window that
  // fits the image (that's plain "cover"), shrunk by the zoom factor.
  function cropWindow(iw, ih, zoom) {
    const sw0 = Math.min(iw, ih * (TILE_W / TILE_H));
    const sh0 = Math.min(ih, iw * (TILE_H / TILE_W));
    return { sw: sw0 / zoom, sh: sh0 / zoom };
  }

  // CSS equivalent: object-position places the cover box, then scaling about
  // that same anchor zooms without shifting the focus.
  function applyPhotoStyle(imgEl, photo) {
    const fx = photo.focusX ?? 50, fy = photo.focusY ?? 50, z = photo.zoom ?? 1;
    imgEl.style.objectPosition = `${fx}% ${fy}%`;
    imgEl.style.transformOrigin = `${fx}% ${fy}%`;
    imgEl.style.transform = z > 1 ? `scale(${z})` : "";
  }

  // Items: type "image" (dataUrl, as before), "gif" and "video" (the file itself
  // lives in IndexedDB under mediaId — too big for localStorage).
  // cols: 1–8 (3 by default). gap in px (0 = borderless).
  function loadState() {
    let s = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) s = JSON.parse(raw);
    } catch (e) {}
    if (!s || !Array.isArray(s.photos)) s = { photos: [] };
    s.photos.forEach(p => {
      if (!p.id) p.id = newId();
      if (!p.type) p.type = "image";
    });
    if (!(s.cols >= 1 && s.cols <= MAX_COLS)) s.cols = DEFAULT_COLS;
    if (typeof s.gap !== "number" || !isFinite(s.gap)) s.gap = DEFAULT_GAP;
    s.gap = clamp(Math.round(s.gap), 0, 40);
    if (typeof s.bg !== "string") s.bg = null;
    s.present = !!s.present;
    return s;
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("Storage full — try removing a few photos.", e);
    }
  }

  // ---- media storage (GIFs and videos) ----
  let dbPromise = null;
  function openDb() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(MEDIA_DB, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("media");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }
  async function mediaTx(mode, fn) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("media", mode);
      const req = fn(tx.objectStore("media"));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  }
  const putMedia = (id, blob) => mediaTx("readwrite", s => s.put(blob, id));
  const getMedia = id => mediaTx("readonly", s => s.get(id));
  const deleteMedia = id => mediaTx("readwrite", s => s.delete(id)).catch(() => {});
  const clearMedia = () => mediaTx("readwrite", s => s.clear()).catch(() => {});

  const mediaUrls = new Map();   // mediaId → object URL
  const mediaEls = new Map();    // item id → <img>/<video>, reused so videos keep playing across re-renders
  let mediaReady = false;

  async function loadStoredMedia() {
    await Promise.all(state.photos.filter(p => p.mediaId).map(async p => {
      try {
        const blob = await getMedia(p.mediaId);
        if (blob) mediaUrls.set(p.mediaId, URL.createObjectURL(blob));
      } catch (e) {}
    }));
    mediaReady = true;
  }

  function forgetMedia(item) {
    if (!item || !item.mediaId) return;
    const url = mediaUrls.get(item.mediaId);
    if (url) URL.revokeObjectURL(url);
    mediaUrls.delete(item.mediaId);
    deleteMedia(item.mediaId);
  }

  function mediaSrc(item) {
    return item.type === "image" ? item.dataUrl : mediaUrls.get(item.mediaId);
  }

  function isMediaFile(f) {
    return !!f && (f.type.startsWith("image/") || f.type.startsWith("video/"));
  }

  function resizeToDataURL(file, maxDim) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => { img.src = reader.result; };
      img.onerror = reject;
      img.onload = () => {
        const ratio = img.width / img.height;
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height >= width && height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve({ dataUrl: canvas.toDataURL("image/jpeg", 0.85), ratio });
      };
      reader.readAsDataURL(file);
    });
  }

  function videoRatio(url) {
    return new Promise((resolve, reject) => {
      const v = document.createElement("video");
      v.preload = "metadata";
      v.muted = true;
      v.onloadedmetadata = () => v.videoWidth ? resolve(v.videoWidth / v.videoHeight) : reject(new Error("no picture"));
      v.onerror = () => reject(v.error || new Error("unreadable"));
      v.src = url;
    });
  }

  async function storeBlob(file) {
    const mediaId = newId();
    try {
      await putMedia(mediaId, file);
    } catch (e) {
      throw new Error("there isn't enough storage space in this browser");
    }
    return mediaId;
  }

  // Photos are shrunk to JPEG as before; GIFs keep their original file so
  // they stay animated, and videos are kept whole.
  async function importMedia(file) {
    if (file.type === "image/gif") {
      const url = URL.createObjectURL(file);
      try {
        const img = await loadImageEl(url);
        const ratio = img.naturalWidth / img.naturalHeight;
        const mediaId = await storeBlob(file);
        mediaUrls.set(mediaId, url);
        return { type: "gif", mediaId, ratio };
      } catch (e) {
        URL.revokeObjectURL(url);
        throw e instanceof Error ? e : new Error("this GIF couldn't be read");
      }
    }
    if (file.type.startsWith("video/")) {
      const url = URL.createObjectURL(file);
      try {
        let ratio;
        try { ratio = await videoRatio(url); }
        catch (e) { throw new Error("this browser can't play that video format"); }
        const mediaId = await storeBlob(file);
        mediaUrls.set(mediaId, url);
        return { type: "video", mediaId, ratio };
      } catch (e) {
        URL.revokeObjectURL(url);
        throw e;
      }
    }
    try {
      const { dataUrl, ratio } = await resizeToDataURL(file, MAX_DIM);
      return { type: "image", dataUrl, ratio };
    } catch (e) {
      throw new Error("this browser can't open that image format");
    }
  }

  function addFailed(file, e) {
    alert(`Couldn't add "${file.name}" — ${(e && e.message) || "this file isn't supported"}.`);
  }

  function mediaElementFor(item) {
    const src = mediaSrc(item);
    if (!src) {
      const ph = document.createElement("div");
      ph.className = "media missing";
      if (mediaReady) ph.textContent = "This file isn't saved in this browser";
      return ph;
    }
    let el = mediaEls.get(item.id);
    if (el && el._src === src) return el;
    if (item.type === "video") {
      el = document.createElement("video");
      el.muted = true;
      el.loop = true;
      el.autoplay = true;
      el.playsInline = true;
      el.setAttribute("muted", "");
      el.setAttribute("playsinline", "");
      el.preload = "auto";
    } else {
      el = document.createElement("img");
      el.alt = "";
      el.draggable = false;
    }
    el.className = "media";
    el.src = src;
    el._src = src;
    mediaEls.set(item.id, el);
    return el;
  }

  // ---- grid layout ----
  function getColumnCount() { return state.cols || DEFAULT_COLS; }

  function layout() {
    grid.style.setProperty("--cols", String(getColumnCount()));
    grid.style.setProperty("--gap", state.gap + "px");
  }

  // ---- grid rendering ----
  function render() {
    grid.innerHTML = "";
    const present = state.present;
    const ids = new Set();

    state.photos.forEach((photo, i) => {
      ids.add(photo.id);
      const tile = document.createElement("div");
      tile.className = "tile photo";
      tile.dataset.index = i;

      const media = mediaElementFor(photo);
      if (media.tagName !== "DIV") applyPhotoStyle(media, photo);
      tile.appendChild(media);

      if (photo.type === "video" && media.tagName === "VIDEO") tile.appendChild(soundButton(media));

      // presenting locks the wall: no reordering, cropping, swapping or removing
      if (!present) {
        tile.draggable = true;
        tile.tabIndex = 0;
        tile.setAttribute("role", "button");
        tile.title = "Click to crop and zoom · drag to reorder";

        tile.addEventListener("click", (e) => {
          if (e.target.closest(".sound-btn")) return;
          openCropModal(i);
        });
        tile.addEventListener("keydown", (e) => {
          if (e.target !== tile) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openCropModal(i);
          }
        });

        const frameNo = document.createElement("span");
        frameNo.className = "frame-no";
        frameNo.textContent = String(i + 1).padStart(2, "0");
        tile.appendChild(frameNo);

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.setAttribute("aria-label", "Remove");
        remove.textContent = "×";
        remove.addEventListener("click", (e) => {
          e.stopPropagation();
          const [gone] = state.photos.splice(i, 1);
          forgetMedia(gone);
          saveState();
          render();
        });
        tile.appendChild(remove);

        wireDrag(tile);
      }

      grid.appendChild(tile);
    });

    // re-attached videos carry on; make sure nothing got left paused
    mediaEls.forEach((el, id) => {
      if (!ids.has(id)) mediaEls.delete(id);
      else if (el.tagName === "VIDEO" && el.paused) el.play().catch(() => {});
    });

    brandCount.textContent = state.photos.length;
    emptyState.style.display = state.photos.length ? "none" : "flex";
    grid.style.display = state.photos.length ? "grid" : "none";
    layout();
  }

  function soundButton(video) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sound-btn";
    const paint = () => {
      b.innerHTML = video.muted ? SOUND_OFF_SVG : SOUND_ON_SVG;
      b.classList.toggle("on", !video.muted);
      b.setAttribute("aria-label", video.muted ? "Sound on" : "Sound off");
      b.title = b.getAttribute("aria-label");
    };
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      if (!video.muted) video.play().catch(() => {});
      paint();
    });
    b.addEventListener("keydown", (e) => e.stopPropagation());
    paint();
    return b;
  }

  let dragIndex = null;

  function wireDrag(tile) {
    tile.addEventListener("dragstart", () => {
      dragIndex = Number(tile.dataset.index);
      tile.classList.add("dragging");
    });
    tile.addEventListener("dragend", () => {
      tile.classList.remove("dragging");
      clearDropHighlights();
    });
    tile.addEventListener("dragover", (e) => {
      e.preventDefault();
      tile.classList.toggle("replace-target", isFileDrag(e));
      tile.classList.toggle("drop-target", !isFileDrag(e));
    });
    tile.addEventListener("dragleave", () => {
      tile.classList.remove("drop-target", "replace-target");
    });
    tile.addEventListener("drop", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      tile.classList.remove("drop-target", "replace-target");
      dragCounter = 0;
      document.body.classList.remove("drag-over");
      const dropIndex = Number(tile.dataset.index);

      // a file dragged in from outside swaps what's in this slot
      if (isFileDrag(e)) {
        const files = Array.from(e.dataTransfer.files || []).filter(isMediaFile);
        if (!files.length) return;
        await replaceMediaAt(dropIndex, files[0]);
        if (files.length > 1) handleFiles(files.slice(1));
        return;
      }

      if (dragIndex === null || dragIndex === dropIndex) return;
      const [moved] = state.photos.splice(dragIndex, 1);
      state.photos.splice(dropIndex, 0, moved);
      dragIndex = null;
      saveState();
      render();
    });
  }

  function isFileDrag(e) {
    return !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
  }

  function clearDropHighlights() {
    grid.querySelectorAll(".drop-target, .replace-target")
      .forEach(t => t.classList.remove("drop-target", "replace-target"));
  }

  // Swap the file in a slot; the crop starts fresh for the new file.
  async function replaceMediaAt(index, file) {
    const item = state.photos[index];
    if (!item || !isMediaFile(file)) return;
    let media;
    try { media = await importMedia(file); }
    catch (e) { addFailed(file, e); return; }
    if (state.photos[index] !== item) { forgetMedia(media); return; }
    forgetMedia(item);
    state.photos[index] = { id: newId(), ...media, focusX: 50, focusY: 50, zoom: 1 };
    saveState();
    render();
  }

  async function handleFiles(fileList) {
    const files = Array.from(fileList).filter(isMediaFile);
    for (const file of files) {
      try {
        const media = await importMedia(file);
        state.photos.push({ id: newId(), ...media, focusX: 50, focusY: 50, zoom: 1 });
      } catch (e) {
        addFailed(file, e);
      }
    }
    saveState();
    render();
  }

  addBtn.addEventListener("click", () => photoInput.click());
  emptyAddBtn.addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", () => {
    handleFiles(photoInput.files);
    photoInput.value = "";
  });

  // whole-page drop zone
  let dragCounter = 0;
  document.addEventListener("dragenter", (e) => {
    if (!e.dataTransfer.types.includes("Files") || state.present) return;
    e.preventDefault();
    dragCounter++;
    document.body.classList.add("drag-over");
  });
  document.addEventListener("dragover", (e) => {
    if (!e.dataTransfer.types.includes("Files")) return;
    e.preventDefault();
  });
  document.addEventListener("dragleave", () => {
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) document.body.classList.remove("drag-over");
  });
  document.addEventListener("drop", (e) => {
    if (!e.dataTransfer.types.includes("Files")) return;
    e.preventDefault();
    dragCounter = 0;
    document.body.classList.remove("drag-over");
    if (state.present) return;
    if (e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  clearBtn.addEventListener("click", () => {
    if (!state.photos.length) return;
    if (!confirm("Remove everything from this portfolio?")) return;
    state.photos = [];
    mediaUrls.forEach(url => URL.revokeObjectURL(url));
    mediaUrls.clear();
    mediaEls.clear();
    clearMedia();
    saveState();
    render();
  });

  // ---- layout menu: columns, gap, background ----
  const COL_CHOICES = [1, 2, 3, 4, 5, 6, 7, 8];
  colSeg.style.setProperty("--seg-cols", "4");
  COL_CHOICES.forEach(n => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = n === null ? "Auto" : String(n);
    b.dataset.cols = n === null ? "" : String(n);
    b.title = n === null ? "Fit to the screen width" : `${n} column${n > 1 ? "s" : ""}`;
    b.addEventListener("click", () => {
      state.cols = n;
      saveState();
      applyLayoutSettings();
    });
    colSeg.appendChild(b);
  });

  BG_SWATCHES.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch";
    b.style.background = c;
    b.dataset.colour = c;
    b.setAttribute("aria-label", "Background " + c);
    b.addEventListener("click", () => setBackground(c));
    bgSwatches.appendChild(b);
  });

  function setBackground(c) {
    state.bg = c || null;
    saveState();
    applyLayoutSettings();
  }

  function applyLayoutSettings() {
    const colKey = state.cols ? String(state.cols) : "";
    colSeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.cols === colKey));
    gapInput.value = state.gap;
    gapValue.textContent = state.gap ? state.gap + " px" : "Borderless";
    if (state.bg) document.documentElement.style.setProperty("--wall-bg", state.bg);
    else document.documentElement.style.removeProperty("--wall-bg");
    bgDot.style.background = state.bg || "";
    bgSwatches.querySelectorAll(".swatch").forEach(s => s.classList.toggle("on", s.dataset.colour === state.bg));
    if (state.bg && /^#[0-9a-f]{6}$/i.test(state.bg)) bgCustom.value = state.bg;
    layout();
  }

  gapInput.addEventListener("input", () => {
    state.gap = clamp(Math.round(Number(gapInput.value) || 0), 0, 40);
    applyLayoutSettings();
  });
  gapInput.addEventListener("change", saveState);
  bgCustom.addEventListener("input", () => setBackground(bgCustom.value));
  bgDefault.addEventListener("click", () => setBackground(null));

  function closeMenus() {
    layoutMenu.hidden = true;
    layoutBtn.setAttribute("aria-expanded", "false");
    exportMenu.hidden = true;
    exportBtn.setAttribute("aria-expanded", "false");
  }

  layoutBtn.addEventListener("click", () => {
    const willOpen = layoutMenu.hidden;
    closeMenus();
    layoutMenu.hidden = !willOpen;
    layoutBtn.setAttribute("aria-expanded", String(willOpen));
    if (willOpen) keepMenuOnScreen(layoutMenu);
  });

  // on a phone the button sits mid-bar, so a right-aligned menu can run off the left edge
  function keepMenuOnScreen(menu) {
    menu.style.right = "";
    const r = menu.getBoundingClientRect();
    const margin = 12;
    if (r.left < margin) menu.style.right = (r.left - margin) + "px";
  }

  // ---- lock & present ----
  let fullscreenByUs = false;
  const fullscreenEl = () => document.fullscreenElement || document.webkitFullscreenElement;

  function enterPresent() {
    closeMenus();
    if (!cropBackdrop.hidden) closeCropModal();
    state.present = true;
    saveState();
    applyPresent();
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !fullscreenEl()) {
      try {
        fullscreenByUs = true;
        const p = req.call(el);
        if (p && p.catch) p.catch(() => { fullscreenByUs = false; });
      } catch (e) {
        fullscreenByUs = false;
      }
    }
  }

  function exitPresent() {
    state.present = false;
    saveState();
    applyPresent();
    if (fullscreenEl() && fullscreenByUs) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      try {
        const p = exit.call(document);
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
    fullscreenByUs = false;
  }

  function applyPresent() {
    document.body.classList.toggle("presenting", !!state.present);
    render();
  }

  // Esc out of full screen ends the presentation too
  function onFullscreenChange() {
    if (!fullscreenEl() && fullscreenByUs) {
      fullscreenByUs = false;
      if (state.present) exitPresent();
    }
    layout();
  }
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);

  presentBtn.addEventListener("click", enterPresent);
  presentExit.addEventListener("click", exitPresent);

  // ---- crop modal ----
  let cropIndex = null;
  let cropFocus = { x: 50, y: 50 };
  let cropZoom = 1;
  let cropDragging = false;
  let grabOffset = { x: 0, y: 0 };

  // the crop window for a video is picked on a still of its current frame
  function videoFrame(v) {
    if (!v || v.tagName !== "VIDEO" || v.readyState < 2 || !v.videoWidth) return null;
    const c = document.createElement("canvas");
    const s = Math.min(1, MAX_DIM / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * s);
    c.height = Math.round(v.videoHeight * s);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85);
  }

  function openCropModal(index) {
    const photo = state.photos[index];
    if (!photo || state.present) return;
    let src = mediaSrc(photo);
    if (photo.type === "video") {
      src = videoFrame(mediaEls.get(photo.id));
      if (!src) { alert("The video is still loading — try again in a moment."); return; }
    }
    if (!src) return;
    cropIndex = index;
    cropFocus = { x: photo.focusX ?? 50, y: photo.focusY ?? 50 };
    cropZoom = photo.zoom ?? 1;
    cropImg.src = src;
    cropPreviewImg.src = src;
    // the stage has no layout box while the modal is hidden — show it, then measure
    cropBackdrop.hidden = false;
    if (cropImg.complete && cropImg.naturalWidth) updateCropVisuals();
    else cropImg.addEventListener("load", updateCropVisuals, { once: true });
  }

  function closeCropModal() {
    cropBackdrop.hidden = true;
    cropIndex = null;
    endCropDrag();
  }

  function stageMetrics() {
    const rect = cropStage.getBoundingClientRect();
    const iw = cropImg.naturalWidth, ih = cropImg.naturalHeight;
    if (!iw || !ih || !rect.width || !rect.height) return null;
    const scale = Math.min(rect.width / iw, rect.height / ih);
    return { rect, iw, ih, scale, ox: (rect.width - iw * scale) / 2, oy: (rect.height - ih * scale) / 2 };
  }

  function updateCropVisuals() {
    cropZoomValue.textContent = cropZoom.toFixed(2) + "×";
    cropZoomInput.value = cropZoom;
    applyPhotoStyle(cropPreviewImg, { focusX: cropFocus.x, focusY: cropFocus.y, zoom: cropZoom });

    const m = stageMetrics();
    if (!m) return;
    const { sw, sh } = cropWindow(m.iw, m.ih, cropZoom);
    const left = (m.iw - sw) * (cropFocus.x / 100);
    const top = (m.ih - sh) * (cropFocus.y / 100);
    cropFrame.style.left = (m.ox + left * m.scale) + "px";
    cropFrame.style.top = (m.oy + top * m.scale) + "px";
    cropFrame.style.width = (sw * m.scale) + "px";
    cropFrame.style.height = (sh * m.scale) + "px";
  }

  // focus is stored as a fraction of the slack, so the frame can never leave the image
  function centerFocusOn(imgX, imgY) {
    const iw = cropImg.naturalWidth, ih = cropImg.naturalHeight;
    const { sw, sh } = cropWindow(iw, ih, cropZoom);
    const slackX = iw - sw, slackY = ih - sh;
    cropFocus = {
      x: slackX > 0.5 ? clamp((imgX - sw / 2) / slackX, 0, 1) * 100 : 50,
      y: slackY > 0.5 ? clamp((imgY - sh / 2) / slackY, 0, 1) * 100 : 50
    };
  }

  function frameCenter() {
    const iw = cropImg.naturalWidth, ih = cropImg.naturalHeight;
    const { sw, sh } = cropWindow(iw, ih, cropZoom);
    return {
      x: (iw - sw) * (cropFocus.x / 100) + sw / 2,
      y: (ih - sh) * (cropFocus.y / 100) + sh / 2
    };
  }

  function setZoom(next) {
    next = clamp(Number(next) || 1, 1, MAX_ZOOM);
    if (!cropImg.naturalWidth) { cropZoom = next; updateCropVisuals(); return; }
    const c = frameCenter();   // zoom around whatever the frame is currently on
    cropZoom = next;
    centerFocusOn(c.x, c.y);
    updateCropVisuals();
  }

  function pointerToImage(e) {
    const m = stageMetrics();
    if (!m) return null;
    return {
      x: (e.clientX - m.rect.left - m.ox) / m.scale,
      y: (e.clientY - m.rect.top - m.oy) / m.scale
    };
  }

  function endCropDrag() {
    cropDragging = false;
    cropStage.classList.remove("grabbing");
  }

  cropStage.addEventListener("pointerdown", (e) => {
    const p = pointerToImage(e);
    if (!p) return;
    const iw = cropImg.naturalWidth, ih = cropImg.naturalHeight;
    const { sw, sh } = cropWindow(iw, ih, cropZoom);
    const left = (iw - sw) * (cropFocus.x / 100);
    const top = (ih - sh) * (cropFocus.y / 100);
    const inside = p.x >= left && p.x <= left + sw && p.y >= top && p.y <= top + sh;
    // grabbing inside the frame keeps your grip on it; clicking outside jumps it there
    grabOffset = inside ? { x: p.x - (left + sw / 2), y: p.y - (top + sh / 2) } : { x: 0, y: 0 };
    if (!inside) { centerFocusOn(p.x, p.y); updateCropVisuals(); }
    cropDragging = true;
    cropStage.classList.add("grabbing");
    cropStage.setPointerCapture(e.pointerId);
  });
  cropStage.addEventListener("pointermove", (e) => {
    if (!cropDragging) return;
    const p = pointerToImage(e);
    if (!p) return;
    centerFocusOn(p.x - grabOffset.x, p.y - grabOffset.y);
    updateCropVisuals();
  });
  cropStage.addEventListener("pointerup", endCropDrag);
  cropStage.addEventListener("pointercancel", endCropDrag);
  cropStage.addEventListener("wheel", (e) => {
    e.preventDefault();
    setZoom(cropZoom * (e.deltaY < 0 ? 1.09 : 1 / 1.09));
  }, { passive: false });

  cropZoomInput.addEventListener("input", () => setZoom(cropZoomInput.value));
  window.addEventListener("resize", () => { if (!cropBackdrop.hidden) updateCropVisuals(); });

  // Swapping the photo from inside the editor: the touch equivalent of dropping
  // a file onto a tile, so it applies straight away just like the drop does.
  cropReplaceBtn.addEventListener("click", () => cropReplaceInput.click());
  cropReplaceInput.addEventListener("change", async () => {
    const file = cropReplaceInput.files[0];
    const index = cropIndex;
    cropReplaceInput.value = "";
    if (!file || index === null) return;
    await replaceMediaAt(index, file);

    // only refresh the editor if it is still showing this same slot
    if (cropIndex !== index) return;
    const photo = state.photos[index];
    if (!photo) { closeCropModal(); return; }
    if (photo.type === "video") {
      // a new video needs a moment to load before a still can be taken
      closeCropModal();
      return;
    }
    cropFocus = { x: 50, y: 50 };
    cropZoom = 1;
    const src = mediaSrc(photo);
    cropImg.src = src;
    cropPreviewImg.src = src;
    if (cropImg.complete && cropImg.naturalWidth) updateCropVisuals();
    else cropImg.addEventListener("load", updateCropVisuals, { once: true });
  });

  cropReset.addEventListener("click", () => {
    cropFocus = { x: 50, y: 50 };
    cropZoom = 1;
    updateCropVisuals();
  });
  cropClose.addEventListener("click", closeCropModal);
  cropBackdrop.addEventListener("click", (e) => { if (e.target === cropBackdrop) closeCropModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!cropBackdrop.hidden) closeCropModal();
    else if (!layoutMenu.hidden || !exportMenu.hidden) closeMenus();
    else if (state.present && !fullscreenEl()) exitPresent();
  });
  cropSave.addEventListener("click", () => {
    if (cropIndex === null) return;
    const photo = state.photos[cropIndex];
    if (!photo) { closeCropModal(); return; }
    photo.focusX = Math.round(cropFocus.x * 10) / 10;
    photo.focusY = Math.round(cropFocus.y * 10) / 10;
    photo.zoom = Math.round(cropZoom * 100) / 100;
    saveState();
    render();
    closeCropModal();
  });

  // ---- export ----
  exportBtn.addEventListener("click", () => {
    const willOpen = exportMenu.hidden;
    closeMenus();
    exportMenu.hidden = !willOpen;
    exportBtn.setAttribute("aria-expanded", String(willOpen));
  });
  document.addEventListener("click", (e) => {
    if (!exportDropdown.contains(e.target) && !layoutDropdown.contains(e.target)) closeMenus();
  });
  exportMenu.querySelectorAll("button[data-format]").forEach(btn => {
    btn.addEventListener("click", () => {
      exportMenu.hidden = true;
      exportBtn.setAttribute("aria-expanded", "false");
      exportGrid(btn.dataset.format);
    });
  });

  function loadImageEl(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // videos are drawn as the frame showing right now; GIFs as their first frame
  function drawableFor(item) {
    if (item.type === "video") {
      const v = mediaEls.get(item.id);
      const ok = v && v.tagName === "VIDEO" && v.readyState >= 2 && v.videoWidth;
      return Promise.resolve(ok ? { el: v, iw: v.videoWidth, ih: v.videoHeight } : null);
    }
    const src = mediaSrc(item);
    if (!src) return Promise.resolve(null);
    return loadImageEl(src).then(img => ({ el: img, iw: img.naturalWidth, ih: img.naturalHeight }));
  }

  // Same columns, gap and background as the screen. Tiles are a fixed width
  // in the file, and the gap is scaled with them so the export looks the same.
  async function composeGridCanvas() {
    const cols = getColumnCount();
    const tileW = 356;
    const tileH = Math.round(tileW * TILE_H / TILE_W);
    const screenGap = state.gap;
    const screenTile = (grid.clientWidth - screenGap * (cols + 1)) / cols;
    const gapPx = screenGap && screenTile > 0 ? Math.max(1, Math.round(screenGap * tileW / screenTile)) : 0;
    const rows = Math.ceil(state.photos.length / cols) || 1;
    const width = tileW * cols + gapPx * (cols + 1);
    const height = tileH * rows + gapPx * (rows + 1);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = state.bg || "#ffffff";
    ctx.fillRect(0, 0, width, height);

    const sources = await Promise.all(state.photos.map(p => drawableFor(p).catch(() => null)));

    state.photos.forEach((photo, i) => {
      const src = sources[i];
      if (!src) return;
      const col = i % cols;
      const row = Math.floor(i / cols);
      const dx = gapPx + col * (tileW + gapPx);
      const dy = gapPx + row * (tileH + gapPx);
      const { iw, ih } = src;

      // same window the tile shows on screen: cover, shrunk by zoom, placed by focus
      const { sw, sh } = cropWindow(iw, ih, photo.zoom ?? 1);
      const sx = (iw - sw) * ((photo.focusX ?? 50) / 100);
      const sy = (ih - sh) * ((photo.focusY ?? 50) / 100);
      ctx.drawImage(src.el, sx, sy, sw, sh, dx, dy, tileW, tileH);
    });

    return canvas;
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function buildSingleImagePdf(jpegBytes, width, height) {
    const enc = new TextEncoder();
    const chunks = [];
    let offset = 0;
    const objOffsets = {};
    function push(data) {
      const bytes = typeof data === "string" ? enc.encode(data) : data;
      chunks.push(bytes);
      offset += bytes.length;
    }
    push("%PDF-1.4\n");
    objOffsets[1] = offset;
    push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    objOffsets[2] = offset;
    push("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
    objOffsets[3] = offset;
    push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${width} ${height}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
    objOffsets[4] = offset;
    push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    push(jpegBytes);
    push("\nendstream\nendobj\n");
    objOffsets[5] = offset;
    const content = `q ${width} 0 0 ${height} 0 0 cm /Im0 Do Q`;
    push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    const xrefStart = offset;
    let xref = "xref\n0 6\n0000000000 65535 f \n";
    for (let i = 1; i <= 5; i++) xref += String(objOffsets[i]).padStart(10, "0") + " 00000 n \n";
    push(xref);
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
    const total = chunks.reduce((a, c) => a + c.length, 0);
    const out = new Uint8Array(total);
    let pos = 0;
    for (const c of chunks) { out.set(c, pos); pos += c.length; }
    return out;
  }

  async function exportGrid(format) {
    if (!state.photos.length) {
      alert("Add a few photos or videos before exporting.");
      return;
    }
    const canvas = await composeGridCanvas();
    const stamp = new Date().toISOString().slice(0, 10);

    if (format === "png") {
      canvas.toBlob(blob => triggerDownload(blob, `portfolio-${stamp}.png`), "image/png");
    } else if (format === "jpeg") {
      canvas.toBlob(blob => triggerDownload(blob, `portfolio-${stamp}.jpg`), "image/jpeg", 0.92);
    } else if (format === "pdf") {
      canvas.toBlob(async blob => {
        const buf = new Uint8Array(await blob.arrayBuffer());
        const pdfBytes = buildSingleImagePdf(buf, canvas.width, canvas.height);
        triggerDownload(new Blob([pdfBytes], { type: "application/pdf" }), `portfolio-${stamp}.pdf`);
      }, "image/jpeg", 0.92);
    }
  }

  // ---- start ----
  applyLayoutSettings();
  document.body.classList.toggle("presenting", !!state.present);
  render();
  loadStoredMedia().then(() => {
    if (state.photos.some(p => p.mediaId)) render();
  });
})();
</script>
