<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/account.js"></script>   <!-- site-wide account; the tool falls back to its own sign-in without it -->
<script defer src="../assets/stats.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production Hub — Xavier de Belle</title>
<meta name="description" content="Today, the work in production, the big picture, the year's goals and the raw ideas, in one place. Reads Pipelines and Project Phases and keeps them in step.">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<!-- installable app: works offline once opened, syncs when back online (pwa.js, pwa-sw.js) -->
<link rel="manifest" href="production-hub.webmanifest">
<link rel="apple-touch-icon" href="icons/production-hub-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<script src="pwa.js" data-app="production-hub"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --red:#E8232D; --red-dark:#B81D25; --yellow:#F8C135; --black:#000; --text:#282828;
  --g7:#484848; --g6:#5A5A5A; --white:#fff; --bg:#f3f1f1; --line:#e2dcdc; --col:#e9e5e5;
  --wide:700 11px/1.2 "Inter Tight",sans-serif; --ease:cubic-bezier(.4,0,.2,1);
  --gut:clamp(14px,2.4vw,24px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
[hidden]{display:none!important}
a{color:inherit}

/* ---------- top ---------- */
.top{background:var(--black);color:var(--white);padding:14px var(--gut) 0;padding-top:max(14px,env(safe-area-inset-top))}
.top-row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.brand{margin-right:auto;min-width:0}
.brand a{display:block;color:#bbb;text-decoration:none;font:var(--wide);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.brand a:hover{color:var(--yellow)}
.brand h1{font:800 24px/1.05 "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.2px}
.brand h1 span{color:var(--yellow)}
.tbtn{background:transparent;border:1px solid var(--g7);color:var(--white);padding:8px 12px;font:var(--wide);font-size:10px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none}
.tbtn:hover{border-color:var(--white)}
.tbtn.ok{border-color:var(--yellow);color:var(--yellow)}
.tbtn.bad{border-color:var(--red);background:var(--red)}
.conn{display:flex;gap:10px;font:var(--wide);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#999}
.conn span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#555;margin-right:5px;vertical-align:1px}
.conn span.live::before{background:var(--yellow)}
.conn span.bad::before{background:var(--red)}
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;padding:12px 14px;color:var(--white);font:800 13px/1 "Inter Tight",sans-serif;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab[aria-selected=true]{border-bottom-color:var(--yellow);color:var(--yellow)}
.tab .lvl{font-size:9px;letter-spacing:.06em;color:#999;font-weight:700;text-transform:lowercase}
.tab[aria-selected=true] .lvl{color:#d9c48a}
.tab .count{background:var(--yellow);color:var(--black);font-size:10px;padding:3px 6px}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}

/* ---------- sync bars ---------- */
.sbar{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;background:var(--yellow);color:var(--black);padding:12px var(--gut);border-bottom:1px solid rgba(0,0,0,.15)}
.sbar .sync-dot{width:10px;height:10px;background:var(--black);flex:none}
.sbar .what{flex:1;min-width:220px;font-size:14px;line-height:1.45}
.sbar .what b{text-transform:uppercase;font-size:11px;letter-spacing:.06em;margin-right:6px}
.sbar button,.sbar a{border:2px solid var(--black);background:var(--black);color:var(--yellow);font:var(--wide);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;text-decoration:none}
.sbar button+button{background:transparent;color:var(--black)}

main{padding:20px var(--gut) 60px}
.wrap{max-width:1180px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ---------- shared ---------- */
.b{border:1px solid var(--black);background:var(--white);color:var(--black);padding:6px 10px;font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;text-decoration:none;display:inline-block}
.b:hover{background:var(--black);color:var(--white)}
.b.y{background:var(--yellow);border-color:var(--yellow)}
.b.y:hover{background:var(--black);border-color:var(--black);color:var(--yellow)}
.b.r{border-color:var(--red);color:var(--red)}
.b.r:hover{background:var(--red);color:var(--white)}
.b.ghost{border-color:transparent;background:transparent;color:var(--g6)}
.b.ghost:hover{background:var(--white);color:var(--black)}
.b.on{background:var(--black);color:var(--yellow)}
.pill{font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--black);background:var(--yellow);padding:4px 7px;white-space:nowrap}
.empty{padding:14px 18px;color:var(--g6);font-size:14px}
.lead{font-size:13px;color:var(--g6);margin:0 0 12px}
.tag{display:inline-block;padding:3px 6px;font:var(--wide);font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--bg);color:var(--black);border:0;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tag.pl{border-left:3px solid var(--yellow)}
.tag.pp{border-left:3px solid var(--red)}
.tag.on{background:var(--black);color:var(--yellow);cursor:default}
.due{display:inline-flex;align-items:center;gap:4px;border:1px solid #cfc7c7;padding:2px 8px;font-size:11px;font-weight:600;border-radius:999px;color:var(--g7);white-space:nowrap}
.due.over{color:var(--red-dark);border-color:var(--red)}
.due.today{color:var(--black);border-color:var(--black);background:var(--yellow)}
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%{background:var(--yellow)}100%{background:var(--white)}}
.connect{background:var(--white);padding:28px;max-width:620px;border-top:6px solid var(--black)}
.connect h2{font:800 22px/1.15 "Inter Tight",sans-serif;text-transform:uppercase;margin-bottom:8px}
.connect p{margin:0 0 14px;color:var(--g6)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.phead h2{font:800 clamp(24px,3.6vw,38px)/1 "Inter Tight",sans-serif;text-transform:uppercase;color:var(--black);margin-right:auto;overflow-wrap:anywhere}
.model{font-size:12px;color:var(--g6);margin:0 0 14px}
.model b{color:var(--black)}

/* ---------- Today ---------- */
.lists{display:flex;gap:18px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.list{background:var(--white);flex:0 0 340px;border-top:4px solid var(--black)}
.list.pullcol{border-top-color:var(--yellow);flex-basis:320px}
.lh{display:flex;align-items:center;gap:8px;padding:16px 14px 6px 20px}
.lh h2{flex:1;font:800 20px/1.15 "Inter Tight",sans-serif;color:var(--black);overflow-wrap:anywhere}
.lh .sub{font-size:12px;color:var(--g6)}
.menu{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 8px;color:var(--g6)}
.menu:hover{color:var(--black);background:var(--bg)}
.grip{cursor:grab;touch-action:none;color:#b5adad;font:800 14px/1 "Inter Tight",sans-serif;letter-spacing:-2px;padding:4px 6px 4px 2px;user-select:none;-webkit-user-select:none;flex:none}
.grip:hover{color:var(--black)}
.dragging{opacity:.3}
.drag-ghost{position:fixed!important;z-index:70;pointer-events:none;margin:0!important;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:rotate(1.2deg);background:var(--white)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.drop-before{box-shadow:0 -3px 0 var(--yellow)!important}
.drop-after{box-shadow:0 3px 0 var(--yellow)!important}
.ggrid .drop-before{box-shadow:-5px 0 0 var(--yellow)!important}
.ggrid .drop-after{box-shadow:5px 0 0 var(--yellow)!important}
.drop-in{outline:2px dashed var(--yellow);outline-offset:-2px}
.addtask{display:flex;align-items:flex-start;gap:12px;margin:4px 10px 6px;padding:8px 10px;cursor:text}
.addtask .af{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.addtask textarea{border:0;background:transparent;outline:none;font-size:13px;color:var(--g6);min-width:0;padding:0;resize:none;overflow:hidden;min-height:20px;line-height:1.45}
.addtask .aa{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--g6)}
.addtask .aa span{flex:1}
.addtask:not(.open) textarea,.addtask:not(.open) .aa{display:none}
.task .grip{margin:1px -6px 0 -12px}
.addtask:hover,.addtask:focus-within{background:var(--bg)}
.addtask .plus{width:22px;height:22px;display:grid;place-items:center;font-weight:800;color:var(--red);font-size:20px;flex:none}

.addtask input{border:0;background:transparent;outline:none;font-weight:600;color:var(--black);min-width:0;padding:0}
.addtask input::placeholder{color:var(--red);font-weight:700}
.task{display:flex;gap:12px;padding:9px 16px 9px 20px;align-items:flex-start;cursor:pointer}
.task:hover{background:#faf8f8}
.circ{width:22px;height:22px;border:2px solid var(--black);border-radius:50%;background:var(--white);flex:none;margin-top:1px;padding:0;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1}
.circ:hover{background:var(--yellow)}
.circ.on{background:var(--black);color:var(--yellow)}
.tb{flex:1;min-width:0}
.tb .t{font-weight:600;color:var(--black);overflow-wrap:anywhere}
.tb .n{font-size:13px;color:var(--g6);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.tb .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.task.done .t{text-decoration:line-through;color:#999;font-weight:500}
.done-toggle{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 20px;font-weight:700;color:var(--black);text-align:left}
.done-toggle .car{display:inline-block;transition:transform .15s var(--ease);font-size:11px}
.done-toggle.open .car{transform:rotate(90deg)}
.newlist{flex:0 0 200px;border:2px dashed #cfc7c7;background:transparent;padding:22px;font:var(--wide);letter-spacing:.07em;text-transform:uppercase;color:var(--g6)}
.newlist:hover{border-color:var(--black);color:var(--black)}
.grp{padding:12px 20px 4px;font:var(--wide);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--g6)}
.prow{display:flex;gap:10px;align-items:center;padding:8px 16px 8px 20px}
.prow .tb .t{font-size:14px}
.prow .tag{margin-top:3px}

/* ---------- boards (In Production) ---------- */
.pswitch{display:flex;gap:0;margin-bottom:16px;border-bottom:3px solid var(--black);overflow-x:auto}
.pswitch button,.pswitch a{border:0;background:transparent;padding:12px 16px 10px;font:800 14px/1 "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--g6);white-space:nowrap;display:flex;gap:8px;align-items:center;text-decoration:none}
.pswitch button span{font:var(--wide);font-size:10px;background:var(--line);color:var(--black);padding:3px 6px}
.pswitch button[aria-pressed=true]{background:var(--black);color:var(--yellow)}
.pswitch button[aria-pressed=true] span{background:var(--yellow)}
.pswitch a{color:var(--red);font-size:12px;margin-left:auto}
.psum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.psum span{background:var(--white);padding:6px 10px;font-size:13px;font-weight:700;border-left:3px solid var(--black)}
.psum span.late{border-left-color:var(--red);color:var(--red-dark)}
.psum span.stuck{border-left-color:var(--yellow)}
.psum span.money-sum{border-left-color:var(--yellow);background:var(--black);color:var(--yellow)}
.pboard{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x proximity}
.pcol{flex:0 0 280px;background:var(--col);padding:0 0 8px;min-height:120px;scroll-snap-align:start}
.pcol.over{background:#fdf1cf;outline:2px dashed var(--black)}
.pcol .ch{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;border-top:4px solid var(--black)}
.pcol.donecol .ch{border-top-color:var(--yellow)}
.pcol .ch b{flex:1;font:800 14px/1.2 "Inter Tight",sans-serif;color:var(--black)}
.pcol .ch span{font:var(--wide);font-size:10px;background:var(--white);padding:3px 6px}
.padd{display:block;width:calc(100% - 16px);margin:0 8px 8px;border:0;background:transparent;text-align:left;padding:8px;font-weight:700;color:var(--g6)}
.padd:hover{background:var(--white);color:var(--black)}
.pcard{background:var(--white);margin:0 8px 8px;padding:10px 12px 8px;cursor:pointer;border-left:4px solid transparent;box-shadow:0 1px 0 rgba(0,0,0,.08);-webkit-user-select:none;user-select:none}
.pcard:hover{border-left-color:var(--black)}
.pcard.late{border-left-color:var(--red)}
.pcard.quest{border-left-color:var(--red)}
.pcard.dragging{opacity:.4}
.pcard .pt{font-weight:700;color:var(--black);line-height:1.3;overflow-wrap:anywhere}
.pcard .pf{font-size:12px;color:var(--g6);margin-top:3px;overflow-wrap:anywhere}
.pcard .nx{font-size:12px;color:var(--text);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.pcard .nx b{font-weight:700}
.pcard .qtag{display:inline-block;margin-top:4px;padding:2px 5px;font:var(--wide);font-size:9px;letter-spacing:.05em;text-transform:uppercase;background:var(--black);color:var(--white);border-left:3px solid var(--red)}
.pm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.cl{font:var(--wide);font-size:10px;padding:3px 6px;background:var(--bg);color:var(--black)}
.cl.full{background:var(--black);color:var(--yellow)}
.cm{font-size:11px;color:var(--g6);font-weight:700}
.age{font-size:11px;color:var(--g6)}
.age.stuck{color:var(--red-dark);font-weight:700}
.tm{font:var(--wide);font-size:10px;padding:3px 6px;background:var(--bg);color:var(--black);font-variant-numeric:tabular-nums;white-space:nowrap}
.tm.run{background:var(--red);color:var(--white)}
.play{border:1px solid #cfc7c7;background:var(--white);color:var(--black);padding:3px 7px;font-size:10px;line-height:1.2;flex:none}
.play:hover{border-color:var(--black)}
.play.on{background:var(--red);border-color:var(--red);color:var(--white)}
#runbar{display:none;background:var(--red);color:var(--white);padding:10px var(--gut);align-items:center;gap:12px;flex-wrap:wrap}
#runbar.on{display:flex}
#runbar .rw{font-weight:800;cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#runbar .rw small{font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin-left:8px}
#runbar .rc{font:800 22px/1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
#runbar button{border:2px solid var(--white);background:var(--white);color:var(--red);font:var(--wide);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px}
.tbig{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.tbig .tt2{font:800 28px/1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
.tbig .b.on{background:var(--red);border-color:var(--red);color:var(--white)}
.sess{max-height:200px;overflow-y:auto;border:1px solid var(--line)}
.sess div{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.sess div:last-child{border-bottom:0}
.sess div span:first-child{flex:1}
.sess .run{color:var(--red);font-weight:700}
.sess button{border:0;background:transparent;color:#bbb;font-size:15px;padding:0 2px}
.sess button:hover{color:var(--red)}
.tadd{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#dlg .tadd input{width:auto;flex:1 1 110px}
.amb{margin-left:auto;border:1px solid #cfc7c7;background:var(--white);color:var(--black);padding:3px 9px;font:800 14px/1 "Inter Tight",sans-serif;letter-spacing:.1em}
.amb:hover,.amb.open{background:var(--black);color:var(--yellow);border-color:var(--black)}

/* ---------- Big Picture ---------- */
.qpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qpick .b[aria-pressed=true]{background:var(--black);color:var(--yellow)}
.qhead{background:var(--black);color:var(--white);padding:18px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.qhead .eyebrow{font:var(--wide);letter-spacing:.08em;text-transform:uppercase;color:var(--yellow)}
.qhead h2{font:800 clamp(26px,4vw,40px)/.95 "Inter Tight",sans-serif;text-transform:uppercase;overflow-wrap:anywhere}
.qhead .b{border-color:var(--yellow)}
.qgoal{all:unset;cursor:pointer;font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow);margin-top:8px;display:inline-block;border:1px solid #555;padding:5px 8px}
.qgoal.none{color:#999}
.panel{background:var(--white);margin-bottom:16px}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:2px solid var(--black);flex-wrap:wrap}
.ph h3{font:800 18px/1.1 "Inter Tight",sans-serif;text-transform:uppercase;color:var(--black)}
.ph .hint{font-size:12px;color:var(--g6);margin-left:auto;display:flex;gap:10px;align-items:center}
.panel.cur .ph{border-bottom-color:var(--yellow)}
.bar{height:6px;background:var(--line);width:120px;display:inline-block}
.bar i{display:block;height:100%;background:var(--black)}
.srow{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow .ttl{flex:1;min-width:140px;font-weight:600}
.srow.done .ttl{text-decoration:line-through;color:#999}
.chk{width:22px;height:22px;border:2px solid var(--black);background:var(--white);flex:none;display:grid;place-items:center;padding:0;font-weight:800;font-size:13px;line-height:1}
.chk.on{background:var(--black);color:var(--yellow)}
.srow .doing{font:var(--wide);font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--yellow);padding:3px 6px}
.dt{border:1px solid #cfc7c7;padding:3px 6px;font-size:12px;background:var(--white)}
.dt.empty{opacity:.45}
.dt.over{border-color:var(--red);color:var(--red-dark)}
.addphase{width:100%;border:2px dashed #cfc7c7;background:transparent;padding:16px;font:var(--wide);letter-spacing:.07em;text-transform:uppercase;color:var(--g6)}
.addphase:hover{border-color:var(--black);color:var(--black)}

/* ---------- Goals ---------- */
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ghead h2{font:800 clamp(34px,5vw,56px)/.9 "Inter Tight",sans-serif;color:var(--black);letter-spacing:-.5px}
.ghead .yr{border:2px solid var(--black);background:var(--white);font:800 18px/1 "Inter Tight",sans-serif;padding:6px 12px}
.ghead .yr:hover{background:var(--black);color:var(--yellow)}
.ghead .sp{flex:1}
.qcheck{background:var(--black);color:var(--white);padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px;border-left:6px solid var(--red)}
.qcheck b{color:var(--yellow);font:800 14px/1.2 "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.05em}
.qcheck span{flex:1;min-width:200px;font-size:14px}
.gsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.gsum span{background:var(--white);padding:8px 12px;font-weight:700;font-size:14px;border-top:3px solid var(--black)}
.gsum .hit{border-top-color:var(--yellow)}
.gsum .missed{border-top-color:var(--red)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.goal{background:var(--white);border-top:6px solid var(--black)}
.goal.hit{border-top-color:var(--yellow)}
.goal.partly{border-top-color:#999}
.goal.missed{border-top-color:var(--red)}
.goal .gh{padding:16px 18px 6px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.goal .gh b{flex:1;font:800 21px/1.15 "Inter Tight",sans-serif;color:var(--black)}
.goal .res{font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;background:var(--black);color:var(--yellow);white-space:nowrap}

.gbar{margin:0 18px 12px;height:8px;background:var(--line)}
.gbar i{display:block;height:100%;background:var(--black)}
.gq{display:flex;align-items:center;gap:10px;padding:8px 18px;border-top:1px solid var(--line);font-size:14px}
.gq button.qn{all:unset;cursor:pointer;flex:1;font-weight:700;color:var(--black)}
.gq button.qn:hover{text-decoration:underline}
.gq .mini{width:70px;height:5px;background:var(--line)}
.gq .mini i{display:block;height:100%;background:var(--black)}
.gq .pc{font-size:12px;font-weight:700;width:36px;text-align:right}
.gwarn{margin:4px 18px 12px;padding:8px 10px;background:#fdecec;color:var(--red-dark);font-size:13px;font-weight:600}
.gf{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line)}
.greview{padding:12px 18px;border-top:2px solid var(--black);background:#faf8f8}
.greview .rb{display:flex;gap:6px;margin-bottom:8px}
.greview .rb button{flex:1;border:2px solid var(--black);background:var(--white);padding:8px;font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.greview .rb button.on{background:var(--black);color:var(--yellow)}
.greview .rb button.on.missed{background:var(--red);border-color:var(--red);color:var(--white)}
.greview textarea{width:100%;border:1px solid #cfc7c7;padding:8px 10px;min-height:60px;resize:vertical;background:var(--white)}
.gnote{padding:8px 18px 14px;font-size:13px;white-space:pre-wrap;border-top:1px solid var(--line)}
.gnote::before{content:"Learned: ";font-weight:700}
.bigin{display:flex;background:var(--white);border:3px solid var(--black);margin-bottom:6px}
.bigin input,.bigin textarea{flex:1;border:0;padding:14px 16px;font-size:17px;font-weight:600;min-width:0;outline:none;resize:none;background:transparent}
.bigin button{border:0;background:var(--black);color:var(--yellow);padding:0 20px;font:var(--wide);letter-spacing:.07em;text-transform:uppercase}
.tip{font-size:12px;color:var(--g6);margin:0 0 18px}
.tip.warn{color:var(--red-dark);font-weight:600}

/* ---------- Brainstorm ---------- */
.bbox{display:flex;gap:0;margin-bottom:18px;border-bottom:3px solid var(--black);overflow-x:auto}
.bbox button{border:0;background:transparent;padding:12px 18px 10px;font:800 15px/1 "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--g6);white-space:nowrap;display:flex;gap:8px;align-items:center}
.bbox button span{font:var(--wide);font-size:10px;background:var(--line);color:var(--black);padding:3px 6px}
.bbox button[aria-pressed=true]{background:var(--black);color:var(--yellow)}
.bbox button[aria-pressed=true] span{background:var(--yellow)}
.bbox-hint{font-size:13px;color:var(--g6);margin:-8px 0 16px}
.bfilter{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.bfilter .b[aria-pressed=true]{background:var(--black);color:var(--yellow)}
.bsearch{display:flex;align-items:center;background:var(--white);border:2px solid var(--black);flex:1 1 220px;max-width:340px}
.bsearch span{padding:0 4px 0 10px;font-size:14px;color:var(--g6)}
.bsearch input{flex:1;border:0;outline:none;padding:8px 6px;font-weight:600;min-width:0;background:transparent}
.bsearch button{border:0;background:transparent;color:var(--g6);font-size:16px;padding:0 10px}
.bsearch:focus-within{box-shadow:0 0 0 3px var(--yellow)}
.vsw{display:flex;margin-left:auto}
.vsw .b{border-width:2px}
.vsw .b[aria-pressed=true]{background:var(--black);color:var(--yellow)}
.bfound{font-size:13px;color:var(--g6);margin:-6px 0 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bfound button{border:0;background:var(--line);padding:4px 8px;font:var(--wide);font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.bfound button:hover{background:var(--black);color:var(--yellow)}
mark{background:var(--yellow);color:inherit;padding:0 1px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.bcard{background:var(--white);border-top:4px solid var(--black);display:flex;flex-direction:column}
.bcard.lit{border-top-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.bcard.shelf{border-top-color:#999}
.bcard.archive{border-top-color:#ccc;opacity:.75}
.bcard .bb{padding:14px 16px 8px;cursor:pointer;flex:1}
.bcard .bt{font:700 17px/1.3 "Inter Tight",sans-serif;color:var(--black);overflow-wrap:anywhere;flex:1}
.bcard .bn{font-size:13px;color:var(--g6);white-space:pre-wrap;margin-top:4px;overflow-wrap:anywhere}
.bcard .bm{font-size:11px;color:#aaa;margin-top:8px}
.bcard .ied{font-size:11px;color:var(--g6);margin-top:6px}
.bcard .bf{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}
.spark{border:0;background:transparent;font-size:18px;line-height:1;padding:2px 4px;color:#ccc}
.spark.on{color:var(--black);background:var(--yellow)}
.bscore{border:0;font:800 16px/1 "Inter Tight",sans-serif;background:var(--black);color:var(--yellow);padding:5px 7px;flex:none}
.bscore.none{background:transparent;border:1px dashed #bbb;color:#999;font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.graph-wrap{background:var(--white);padding:16px}
.graph{width:100%;height:auto;display:block}
.graph text{font-family:"Inter Tight",sans-serif}
.graph .dot{cursor:pointer}
.graph .dot:hover circle{stroke-width:4}
.unplot{margin-top:14px}
.unplot h4{margin:0 0 8px;font:var(--wide);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--g6)}
.unplot .chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- menu ---------- */
#amenu{position:fixed;z-index:80;background:var(--white);border:2px solid var(--black);box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:220px;max-width:290px;padding:6px 0;max-height:calc(100vh - 24px);overflow:auto}
#amenu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 14px;font:600 14px/1.2 "Inter Tight",sans-serif;color:var(--black)}
#amenu button:hover{background:var(--yellow)}
#amenu button i{font-style:normal;width:16px;text-align:center;color:var(--g6)}
#amenu button.red{color:var(--red)}
#amenu button.sub{padding-left:40px;font-weight:500}
#amenu .sec{font:var(--wide);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--g6);padding:8px 14px 4px;border-top:1px solid var(--line);margin-top:4px}
#amenu .sec:first-child{border-top:0;margin-top:0}

/* ---------- dialogs ---------- */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:60;padding:16px}
#dlg.on{display:grid}
#dlg .box{background:var(--white);max-width:480px;width:100%;border-top:6px solid var(--black);max-height:calc(100vh - 32px);overflow:auto}
#dlg .box.wide{max-width:660px}
#dlg h3{font:800 20px/1.15 "Inter Tight",sans-serif;padding:18px 18px 6px}
#dlg .body{padding:6px 18px 12px}
#dlg label{display:block;font:var(--wide);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--g6);margin:12px 0 4px}
#dlg input,#dlg textarea,#dlg select{width:100%;border:1px solid #cfc7c7;padding:9px 10px;background:var(--white);border-radius:0}
#dlg textarea{min-height:84px;resize:vertical}
#dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#dlg .foot{padding:12px 18px;display:flex;gap:8px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--white)}
#dlg .foot .sp{flex:1}
#dlg .pick{display:flex;flex-direction:column;gap:6px}
#dlg .pick button{text-align:left;padding:12px 14px;font-size:15px;font-weight:700;letter-spacing:0;text-transform:none}
#dlg textarea.cw-title{line-height:1.2!important;width:100%;border:0!important;font:800 22px/1.2 "Inter Tight",sans-serif;padding:0!important;outline:none;resize:none;overflow:hidden;min-height:0!important;display:block}
textarea[data-grow]{min-height:40px!important;height:40px;overflow:hidden;resize:none;line-height:1.45}
.cw-stage{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 2px}
.cw-stage button{border:1px solid #cfc7c7;background:var(--white);padding:7px 10px;font:var(--wide);font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.cw-stage button:hover{border-color:var(--black)}
.cw-stage button.on{background:var(--black);color:var(--yellow);border-color:var(--black)}
.cw-fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px}
.cw-fields div{font-size:14px}
.cw-fields div small{display:block;font:var(--wide);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--g6)}
.cw-fields .full{grid-column:1/-1;white-space:pre-wrap}
.sec-h{margin:16px 0 8px;padding-top:12px;border-top:2px solid var(--black);font:800 14px/1 "Inter Tight",sans-serif;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.sec-h .bar{flex:1;width:auto}
.ctask{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dpick{position:relative;display:inline-flex;align-items:center;font:var(--wide);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#999;padding:4px 7px;cursor:pointer;white-space:nowrap;border:1px dashed #cfc7c7;flex:none}
.dpick:hover{color:var(--black);border-color:var(--black)}
.dpick.set{border:0;padding:0}
.dpick input{position:absolute!important;inset:0;opacity:0;width:100%!important;height:100%!important;max-width:none!important;padding:0!important;margin:0;border:0!important;cursor:pointer;min-width:0}
.dclr{border:0;background:transparent;color:#bbb;font-size:15px;line-height:1;padding:0 2px;flex:none}
.dclr:hover{color:var(--red)}
.rm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}

#dlg .ctask .tt{flex:1 1 160px;border:0;padding:4px 2px;font-weight:600;min-width:0;background:transparent}
#dlg .ctask.done .tt{text-decoration:line-through;color:#999}
#dlg .ctask .td{width:auto;flex:none;border:1px solid #cfc7c7;padding:3px 6px;font-size:12px;max-width:140px}
#dlg .ctask .td.empty{opacity:.45}
#dlg .ctask .td.over{border-color:var(--red);color:var(--red-dark)}
.ctask .x{border:0;background:transparent;color:#bbb;font-size:17px;padding:0 4px;flex:none}
.ctask .x:hover{color:var(--red)}
.ctask .tod{border:0;background:var(--yellow);font:var(--wide);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;flex:none}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1}
.cm-new .row{display:flex;gap:8px;align-items:center;margin-top:6px}
.cm-new .row span{font-size:11px;color:var(--g6);flex:1}
.cm-list{max-height:260px;overflow-y:auto;border:1px solid var(--line);background:#faf8f8;margin-top:10px}
.cm-item{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--white)}
.cm-item:last-child{border-bottom:0}
.cm-item .cd{display:flex;align-items:center;gap:8px;font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--g6);margin-bottom:4px}
.cm-item .cd button{margin-left:auto;border:0;background:transparent;color:#bbb;font-size:15px;padding:0 2px}
.cm-item .ct{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45}
.smode{display:flex;margin:4px 0 6px}
.smode button{flex:1;border:2px solid var(--black);background:var(--white);padding:9px;font:var(--wide);letter-spacing:.06em;text-transform:uppercase}
.smode button[aria-pressed=true]{background:var(--black);color:var(--yellow)}
.big-score{font:800 64px/1 "Inter Tight",sans-serif;color:var(--black);text-align:center;margin:12px 0 2px}
.big-score small{font-size:20px;color:#aaa}
.sl{margin:14px 0 4px}
.sl .top2{display:flex;justify-content:space-between;align-items:baseline}
.sl .top2 b{font:800 15px/1 "Inter Tight",sans-serif}
.sl .top2 span{font:800 18px/1 "Inter Tight",sans-serif}
.sl .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--g6)}
#dlg input[type=range]{accent-color:var(--black);padding:0;border:0;height:26px}
.formula{font-size:12px;color:var(--g6);margin-top:12px;background:var(--bg);padding:8px 10px}

/* toast */
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,180%);background:var(--black);color:var(--white);padding:12px 16px;display:flex;gap:14px;align-items:center;transition:transform .25s var(--ease);z-index:90;max-width:calc(100vw - 32px);border-left:4px solid var(--yellow)}
#toast.on{transform:translate(-50%,0)}
#toast button{background:var(--yellow);border:0;color:var(--black);padding:6px 10px;font:var(--wide);font-size:10px;letter-spacing:.06em;text-transform:uppercase}

@media (max-width:760px){
  .lists{flex-direction:column;overflow:visible}
  .list,.list.pullcol,.newlist{flex:none;width:100%}
  .pcol{flex-basis:84vw}
  .cw-fields,#dlg .two{grid-template-columns:1fr}
  .conn{display:none}
  .srow .rm,.ctask .rm{flex-basis:100%;padding-left:32px}
  .ctask.done .rm{flex-basis:auto;padding-left:0}
  .ctask.done .tt{flex-basis:0}
  .srow .ttl{min-width:0}
  #dlg{padding:0;place-items:stretch}
  #dlg .box,#dlg .box.wide{max-width:none;max-height:100vh;height:100%;border-top-width:4px}
}

/* iPhone zooms into any text box under 16px when you tap it; on touch screens every box is 16px so the page stays put */
@media (pointer: coarse){
  input:not([type=range]):not([type=checkbox]):not([type=radio]):not(.cw-title),textarea:not(.cw-title),select{font-size:16px!important}
  .addtask .aa span{visibility:hidden}   /* no keyboard shortcuts on a phone: the Add button does it */
}

      if (!SYNC.apply(d, remote)) return false;
      cloud.print = syncPrint();
      var stamp = +remote.updatedAt || Date.now();
      setMeta({ updatedAt: stamp, lastSyncedAt: stamp });
      return true;
    }
    function pushNow() {
      var stamp = nextStamp(), print = syncPrint();
      cloud.outgoing = stamp;
      return cloud.fb.f.set(docRef(), { data: JSON.parse(print), updatedAt: stamp, device: deviceName() }).then(function () {
        var ahead = syncPrint() !== print;
        setMeta({ lastSyncedAt: stamp, updatedAt: ahead ? Math.max(meta().updatedAt, stamp + 1) : stamp });
        cloud.at = stamp;
        if (ahead) cloud.again = true;
      });
    }
    function pullNow() {
      return withTimeout(cloud.fb.f.get(docRef()), 12000).then(function (snap) { return snap.exists() ? snap.val() : null; });
    }
    function decide(remote) {
      var move = reconcile(remote);
      if (move === 'pull') { adopt(remote); cloud.at = Date.now(); setStatus('synced'); return; }
      if (move === 'push') { return pushNow().then(function () { setStatus('synced'); }); }
      if (move === 'conflict') { cloud.pending = remote; setStatus('conflict'); return; }
      cloud.at = Date.now();
      setStatus('synced');
    }
    function syncNow(userAsked, known) {
      if (!cloud.on || !cloud.uid) return Promise.resolve();
      if (cloud.busy) { cloud.again = true; return Promise.resolve(); }
      if (cloud.status === 'conflict' && !userAsked) return Promise.resolve();
      cloud.busy = true; cloud.again = false;
      clearTimeout(cloud.timer);
      setStatus('working');
      return (known ? Promise.resolve(known) : pullNow()).then(decide).then(function () {
        cloud.busy = false;
        if (cloud.again && cloud.status !== 'conflict') return syncNow();
      }, function (err) {
        cloud.busy = false;
        cloud.msg = (err && err.code) || 'failed';
        setStatus('error');
        if (userAsked) console.warn('[sync]', err);
      });
    }
    function touch() {
      if (cloud.print === null) return;
      var p = syncPrint();
      if (p === cloud.print) return;
      cloud.print = p;
      setMeta({ updatedAt: nextStamp() });
      if (!cloud.on || !cloud.uid) return;
      clearTimeout(cloud.timer);
      cloud.timer = setTimeout(function () { syncNow(); }, 600);
    }
    function watch() {
      if (cloud.unwatch || !cloud.uid) return;
      cloud.unwatch = cloud.fb.f.onValue(docRef(), function (snap) {
        var remote = snap.exists() ? snap.val() : null;
        if (!remote) return;
        var at = +remote.updatedAt || 0;
        if (at === cloud.outgoing || at === meta().lastSyncedAt) return;
        if (cloud.status === 'conflict') { cloud.pending = remote; paint(); return; }
        if (cloud.busy) { cloud.again = true; return; }
        syncNow(false, remote);
      }, function (err) {
        cloud.unwatch = null;
        cloud.msg = (err && err.code) || 'failed';
        setStatus('error');
      });
    }
    function stopWatching() { if (cloud.unwatch) { cloud.unwatch(); cloud.unwatch = null; } }
    /* Membership — same rules as the classic core: Xavier always syncs;
       anyone else is watched live at members/{uid}, and signing in files an
       access request that he approves on the Access page. */
    function admit(uid) {
      if (cloud.uid === uid) return;
      cloud.uid = uid;
      syncNow();
      watch();
    }
    function stopMembership() { if (cloud.unmember) { cloud.unmember(); cloud.unmember = null; } }
    function askForAccess(user) {
      if (cloud.asked) { setStatus('pending'); return; }
      cloud.asked = true;
      cloud.fb.f.set(cloud.fb.f.ref(cloud.fb.db, 'requests/' + user.uid), {
        email: user.email || '', name: (user.displayName || '').slice(0, 120), at: Date.now(), tool: SYNC.doc
      }).then(function () { if (!cloud.uid) setStatus('pending'); },
              function () { if (!cloud.uid) setStatus('private'); });
    }
    function checkMembership(user) {
      if (user.uid === OWNER) { admit(user.uid); return; }
      setStatus('working');
      cloud.unmember = cloud.fb.f.onValue(cloud.fb.f.ref(cloud.fb.db, 'members/' + user.uid), function (snap) {
        if (!cloud.on) return;
        if (snap.exists()) { admit(user.uid); return; }
        if (cloud.uid) { cloud.uid = null; stopWatching(); clearTimeout(cloud.timer); }
        askForAccess(user);
      }, function () {
        cloud.uid = null;
        stopWatching();
        setStatus('private');
      });
    }
    function listen(fb) {
      if (cloud.listening) return;
      cloud.listening = true;
      cloud.unauth = fb.a.onAuthStateChanged(fb.auth, function (user) {
        if (!cloud.on) return;
        cloud.authed = !!user;
        setMeta({ signedIn: !!user });
        stopWatching();
        stopMembership();
        cloud.uid = null;
        cloud.asked = false;
        if (!user) { setStatus('signedout'); return; }
        checkMembership(user);
      });
    }
    function signIn() {
      if (!cloud.on) return;
      setMeta({ signedIn: true });
      setStatus('working');
      if (account()) {
        loadSDK().then(listen).catch(function () {});
        account().signIn().catch(function (err) {
          if (err && err.code === 'auth/popup-closed-by-user') { if (!cloud.authed) setStatus('signedout'); return; }
          cloud.msg = (err && err.code) || 'failed';
          setStatus('error');
        });
        return;
      }
      loadSDK().then(function (fb) {
        listen(fb);
        var provider = new fb.a.GoogleAuthProvider();
        if (provider.setCustomParameters) provider.setCustomParameters({ prompt: 'select_account' });
        return fb.a.signInWithPopup(fb.auth, provider).catch(function (err) {
          if (err && /popup-blocked|operation-not-supported/i.test(err.code || '')) return fb.a.signInWithRedirect(fb.auth, provider);
          throw err;
        });
      }).catch(function (err) {
        setMeta({ signedIn: false });
        cloud.msg = (err && err.code) || 'failed';
        setStatus('error');
      });
    }
    function signOut() {
      if (account()) { account().signOut(); return; }
      if (cloud.fb) cloud.fb.a.signOut(cloud.fb.auth);
    }
    function click() {
      if (account() && cloud.authed) { account().openPanel(); return; }
      if (!cloud.uid) signIn(); else syncNow(true);
    }
    /* The choice in plain words, and a week-long backup of the version not
       chosen — same behaviour as the classic core. */
    var BACKUP_KEY = SYNC.storageKey + '.backup', BACKUP_DAYS = 7;
    function summary(d) {
      var s = '';
      try { s = String(SYNC.describe(d) || ''); } catch (e) {}
      return s.replace(/^It holds /, '').replace(/\.$/, '') || 'a copy';
    }
    function whenLabel(ms) {
      if (!ms) return '';
      var d = new Date(ms), now = new Date();
      var day = d.toDateString() === now.toDateString() ? 'today'
        : new Date(now.getTime() - 864e5).toDateString() === d.toDateString() ? 'yesterday'
        : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      return day + ' at ' + hhmm(ms);
    }
    function otherDevice(remote) {
      var other = (remote && remote.device) || '';
      if (!other) return 'your other device';
      return other === deviceName() ? 'your other ' + other : 'your ' + other;
    }
    function choiceWords(remote) {
      var here = deviceName(), m = meta();
      var mine = summary(JSON.parse(syncPrint())), theirs = summary(remote.data);
      var remoteAt = +remote.updatedAt || 0;
      var other = otherDevice(remote), otherShort = other.replace(/^your /, 'the ');
      if (!m.lastSyncedAt) {
        return {
          text: 'This browser already has its own ' + SYNC.noun + ' (' + mine + '). Your account has ' + theirs +
            ', last saved from ' + other + ' ' + whenLabel(remoteAt) + '. Which should this browser use? ' +
            'Whichever you don\u2019t pick is kept here as a backup for ' + BACKUP_DAYS + ' days.',
          local: 'Keep this browser\u2019s', cloud: 'Use my account\u2019s'
        };
      }
      var localNewer = m.updatedAt > remoteAt;
      return {
        text: 'This ' + here + ' and ' + other + ' both made changes before they could sync. ' +
          'This ' + here + (m.updatedAt > 1e12 ? ', ' + whenLabel(m.updatedAt) : '') + ': ' + mine + (localNewer ? ' (newer)' : '') + '. ' +
          other.charAt(0).toUpperCase() + other.slice(1) + ', ' + whenLabel(remoteAt) + ': ' + theirs + (localNewer ? '' : ' (newer)') + '. ' +
          'Which version do you want? The other is kept here as a backup for ' + BACKUP_DAYS + ' days.',
        local: 'Keep this ' + here + '\u2019s', cloud: 'Use ' + otherShort + '\u2019s'
      };
    }
    function readBackup() {
      try {
        var b = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null');
        if (b && b.data && Date.now() - (+b.at || 0) < BACKUP_DAYS * 864e5) return b;
      } catch (e) {}
      return null;
    }
    function writeBackup(b) { try { localStorage.setItem(BACKUP_KEY, JSON.stringify(b)); } catch (e) {} }
    function keepBackup(data, label, restored) {
      writeBackup({ data: data, at: Date.now(), label: label, summary: summary(data), shown: true, restored: !!restored });
    }
    function dismissBackup() {
      var b = readBackup();
      if (b) { b.shown = false; writeBackup(b); }
      paint();
    }
    function restoreBackup() {
      var b = readBackup(); if (!b) return;
      var current = JSON.parse(syncPrint());
      if (!SYNC.apply(b.data, { data: b.data, updatedAt: Date.now(), device: deviceName() })) return;
      keepBackup(current, 'the version you just replaced', true);
      cloud.print = syncPrint();
      setMeta({ updatedAt: nextStamp() });
      if (cloud.uid) syncNow(true); else paint();
    }

    function keepLocal() {
      var remote = cloud.pending;
      if (!remote) { restoreBackup(); return; }
      keepBackup(remote.data, 'the version from ' + otherDevice(remote).replace(/^your /, 'the '));
      cloud.pending = null;
      var seen = +remote.updatedAt || 0;
      setMeta({ lastSyncedAt: seen, updatedAt: Math.max(meta().updatedAt, seen + 1) });
      cloud.status = 'working';
      syncNow(true);
    }
    function keepCloud() {
      var remote = cloud.pending;
      if (!remote) { dismissBackup(); return; }
      keepBackup(JSON.parse(syncPrint()), 'this ' + deviceName() + '\u2019s version');
      cloud.pending = null;
      adopt(remote);
      cloud.at = Date.now();
      setStatus('synced');
    }
    function hhmm(ms) {
      var d = new Date(ms);
      return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    }
    function setStatus(s) {
      cloud.status = s;
      if (s === 'synced') cloud.at = cloud.at || Date.now();
      paint();
    }
    function paint() {
      var v = { status: cloud.status, authed: cloud.authed, barOn: false, barText: '', showKeep: false };
      var acct = account();
      if (acct && cloud.authed) {
        var st = acct.state(), u = st.user;
        v.initial = u ? ((u.name || u.email || '?').trim().charAt(0).toUpperCase() || '?') : '';
        v.accountDot = st.status === 'owner' || st.status === 'member' ? 'live' : st.status === 'pending' || st.status === 'checking' ? 'wait' : 'no';
        v.siteAccount = true;              // signing out lives in the account panel
      }
      switch (cloud.status) {
        case 'working':  v.label = 'Syncing…'; v.title = 'Talking to the cloud'; break;
        case 'synced':   v.label = 'Live · ' + hhmm(cloud.at); v.title = 'Signed in. Changes on your other devices appear here as they happen'; break;
        case 'conflict': v.label = 'Pick a version'; v.title = 'Two versions to choose between \u2014 see the note below'; break;
        case 'pending':  v.label = 'Access requested'; v.title = 'Waiting for Xavier to approve this account'; break;
        case 'private':  v.label = 'No access'; v.title = 'This account is not on the invitation list'; break;
        case 'error':    v.label = 'Sync failed'; v.title = explain(cloud.msg); break;
        default:         v.label = 'Sign in to sync'; v.title = 'Keep this in step across your devices';
      }
      if (cloud.status === 'pending' || cloud.status === 'private' || cloud.status === 'error') {
        v.barOn = true;
        v.barText = cloud.status === 'pending'
          ? 'Sync is by invitation, and your request is in. Once Xavier approves it, syncing starts here on its own. Until then everything keeps saving in this browser as usual.'
          : cloud.status === 'private'
          ? 'Sync on this site is by invitation, and this account isn\u2019t on the list. Everything still saves in this browser exactly as before, and nothing is sent anywhere.'
          : explain(cloud.msg);
        if (cloud.status !== 'error') v.link = { href: ACCESS_URL, text: 'About access \u2192' };
      } else if (cloud.status === 'conflict' && cloud.pending) {
        var w = choiceWords(cloud.pending);
        v.barOn = true; v.showKeep = true;
        v.barText = w.text; v.keepLabel = w.local; v.cloudLabel = w.cloud;
      } else {
        var b = readBackup();
        if (b && b.shown) {
          v.barOn = true; v.showKeep = true;
          v.barText = b.restored
            ? 'Restored. The version you replaced (' + b.summary + ') is saved here in case you want it back.'
            : 'Done. The version you didn\u2019t keep \u2014 ' + b.label + ' (' + b.summary + ') \u2014 is saved on this device for ' + BACKUP_DAYS + ' days.';
          v.keepLabel = b.restored ? 'Switch back' : 'Restore it';
          v.cloudLabel = 'OK';
        }
      }
      SYNC.paint(v);
    }
    function onVis() {
      if (!cloud.uid) return;
      if (document.hidden) { SYNC.flush(); if (meta().updatedAt > meta().lastSyncedAt) syncNow(); }
      else syncNow();
    }
    function onWake() { if (cloud.uid) syncNow(); }
    function init() {
      seedMeta();
      paint();
      if (!cloud.on) return;
      var acct = account();
      if (acct) {
        acct.registerTool({ doc: SYNC.doc, syncNow: function () { syncNow(true); } });
        cloud.unacct = acct.on(function (st) {
          if (!cloud.on) return;
          if (st.user && !cloud.listening) loadSDK().then(listen).catch(function () {});
          paint();
        });
      }
      if (meta().signedIn || (acct && acct.wanted())) {
        setStatus('working');
        loadSDK().then(listen).catch(function (err) { cloud.msg = (err && err.code) || 'failed'; setStatus('error'); });
      }
      document.addEventListener('visibilitychange', onVis);
      window.addEventListener('focus', onWake);
      window.addEventListener('online', onWake);
    }
    function destroy() {
      cloud.on = false;
      cloud.uid = null;
      if (cloud.unauth) { cloud.unauth(); cloud.unauth = null; }
      if (cloud.unacct) { cloud.unacct(); cloud.unacct = null; }
      stopWatching();
      stopMembership();
      clearTimeout(cloud.timer);
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', onWake);
      window.removeEventListener('online', onWake);
    }
    return { init: init, destroy: destroy, touch: touch, click: click, signOut: signOut, keepLocal: keepLocal, keepCloud: keepCloud,
             cloud: cloud, meta: meta, reconcile: reconcile };
  }

  window.createCloudSync = createCloudSync;
})();
</script>
<script>
/* ============================================================
   Production Hub — one place for:
     Today        · tasks       (this hub's own lists)
     In Production · projects   (reads + writes the Pipelines app's doc)
     Big Picture  · quests      (reads + writes the Project Phases app's doc)
     Goals        · this year   (this hub)
     Brainstorm   · raw ideas   (this hub)

   Three synced docs: production-hub (ours), pipelines, project-phases.
   The other two apps own their data. The hub keeps the copy exactly as it
   arrived and only changes the few fields it touches (a tick, a stage, a
   new task), so nothing those apps know about is ever dropped. Extra things
   the hub knows about their items (step dates, which stage a phase sits in
   on the Projects board, pinned quests) live in the hub's own doc.
   ============================================================ */
var HUB_KEY = 'xdb.hub.v1', UI_KEY = 'xdb.hub.v1.ui';
var PL_KEY = 'xdb.hub.v1.pipelines', PP_KEY = 'xdb.hub.v1.phases';   // the hub's copies of the other apps' docs

function $(id) { return document.getElementById(id); }
function uid(p) { return (p || 'x') + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3); }
function ppid(p) { return p + '-' + Math.random().toString(36).slice(2, 9); }   // Project Phases' own id style
function listOf(v) { return Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []); }
function arr(o, k) { if (!Array.isArray(o[k])) o[k] = listOf(o[k]); return o[k]; }   // a real array we can push to
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayOff(n) { var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function isDate(v) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5); }
function niceDate(v, withDay) { return new Date(v + 'T12:00').toLocaleDateString('en-CA', withDay ? { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' }); }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function linesOf(note) { return String(note || '').split('\n').map(function (l) { return l.replace(/^\s*[-•]\s*/, '').trim(); }).filter(Boolean); }
function dueChip(due, repeat) {
  if (!isDate(due)) return '';
  var d = daysBetween(today(), due), txt, cls = '';
  if (d === 0) { txt = 'Today'; cls = 'today'; }
  else if (d === 1) txt = 'Tomorrow';
  else if (d < 0) { cls = 'over'; var n = -d; txt = n < 7 ? n + ' day' + (n > 1 ? 's' : '') + ' ago' : Math.floor(n / 7) + ' week' + (n >= 14 ? 's' : '') + ' ago'; }
  else txt = new Date(due + 'T12:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
  return '<span class="due ' + cls + '">◷ ' + txt + (repeat ? ' ⟳' : '') + '</span>';
}
/* a date that looks like a chip (or “+ Date”), with the real picker on top of it */
function dateCtl(v, attr, clr, done) {
  return '<label class="dpick' + (v ? ' set' : '') + '">' + (v ? dueChip(v).replace(/ over/, done ? '' : ' over') : '+ Date') + '<input type="date" value="' + (v || '') + '" ' + attr + ' aria-label="Date"></label>'
    + (v ? '<button class="dclr" data-dclr="' + clr + '" title="Remove the date">×</button>' : '');
}
function money(v) { var n = Number(v); return '$' + n.toLocaleString('en-CA', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
function shortCard(t) { return /^\d{6}\S* · /.test(t) ? t.replace(/^\S+ · /, '') : t; }

/* ============================================================ hub state */
function defaultHub() {
  return { lists: [{ id: 'l1', name: 'Tasks' }], tasks: [], brain: [], goals: [], checks: {}, pins: {}, due: {}, stage: {} };
}
function normHub(s) {
  if (!s || typeof s !== 'object') return null;
  var out = defaultHub();
  var lists = listOf(s.lists).filter(Boolean).map(function (l) { return { id: String(l.id || uid('l')), name: String(l.name == null ? 'List' : l.name) }; });
  if (lists.length) out.lists = lists;
  out.tasks = listOf(s.tasks).filter(Boolean).map(function (t) {
    var ref = t.ref && typeof t.ref === 'object' ? t.ref : null;
    if (ref && ref.app === 'pl') ref = { app: 'pl', pl: String(ref.pl), c: String(ref.c), t: String(ref.t) };
    else if (ref && ref.app === 'pp') ref = { app: 'pp', p: String(ref.p), ph: String(ref.ph), s: String(ref.s) };
    else ref = null;
    return { id: String(t.id || uid('t')), list: String(t.list || out.lists[0].id), title: String(t.title == null ? '' : t.title), notes: String(t.notes || ''),
      due: isDate(t.due) ? t.due : null, repeat: ['daily', 'weekly', 'monthly'].indexOf(t.repeat) > -1 ? t.repeat : null,
      done: !!t.done, doneAt: isDate(t.doneAt) ? t.doneAt : null, ref: ref, at: isDate(t.at) ? t.at : today() };
  });
  out.tasks.forEach(function (t) { if (!out.lists.some(function (l) { return l.id === t.list; })) t.list = out.lists[0].id; });
  out.brain = listOf(s.brain).filter(Boolean).map(function (b) {
    var o = { id: String(b.id || uid('b')), text: String(b.text || ''), note: String(b.note || ''), spark: !!b.spark, at: isDate(b.at) ? b.at : today(),
      box: b.box === 'shelf' || b.box === 'archive' ? b.box : 'fresh', movedAt: isDate(b.movedAt) ? b.movedAt : null, why: String(b.why || '') };
    ['score', 'impact', 'time', 'ease'].forEach(function (k) { if (b[k] != null && isFinite(+b[k])) o[k] = Math.max(0, Math.min(100, Math.round(+b[k]))); });
    if (o.impact == null || o.time == null || o.ease == null) { delete o.impact; delete o.time; delete o.ease; }
    return o;
  }).filter(function (b) { return b.text; });
  out.goals = listOf(s.goals).filter(Boolean).map(function (g) {
    return { id: String(g.id || uid('g')), year: +g.year || new Date().getFullYear(), title: String(g.title || 'Goal'), measure: String(g.measure || ''),
      result: ['hit', 'partly', 'missed'].indexOf(g.result) > -1 ? g.result : null, note: String(g.note || ''), quests: listOf(g.quests).map(String) };
  });
  ['checks', 'pins'].forEach(function (k) { var v = s[k] && typeof s[k] === 'object' ? s[k] : {}; Object.keys(v).forEach(function (x) { if (v[x]) out[k][x] = true; }); });
  var due = s.due && typeof s.due === 'object' ? s.due : {}; Object.keys(due).forEach(function (x) { if (isDate(due[x])) out.due[x] = due[x]; });
  var st = s.stage && typeof s.stage === 'object' ? s.stage : {}; Object.keys(st).forEach(function (x) { if (st[x]) out.stage[x] = String(st[x]); });
  return out;
}

var S = defaultHub();
try { var sv = normHub(JSON.parse(localStorage.getItem(HUB_KEY) || 'null')); if (sv) S = sv; } catch (e) {}
var U = { tab: 'today', lastList: null, open: {}, showPull: true, brainBox: 'fresh', brainFilter: 'all', brainSort: 'new', brainView: 'cards', brainQ: '', year: new Date().getFullYear(), review: false, prodView: 'projects', quest: null, showArch: false };
try { var su = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); if (su) U = Object.assign(U, su); } catch (e) {}
U.year = U.year || new Date().getFullYear();

/* The other apps' docs, exactly as they came from the cloud (null until known) */
var PLD = null, PPD = null;
try { PLD = JSON.parse(localStorage.getItem(PL_KEY) || 'null'); } catch (e) {}
try { PPD = JSON.parse(localStorage.getItem(PP_KEY) || 'null'); } catch (e) {}

var hubTimer = null;
function saveHubNow() { clearTimeout(hubTimer); try { localStorage.setItem(HUB_KEY, JSON.stringify(S)); } catch (e) {} if (SH) SH.touch(); }
function saveHub() { clearTimeout(hubTimer); hubTimer = setTimeout(saveHubNow, 300); }
function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify(U)); } catch (e) {} }

/* ============================================================ reading Pipelines (raw) */
function pls() { return PLD ? listOf(PLD.pipelines).filter(Boolean) : []; }
function plById(id) { return pls().find(function (p) { return p.id === id; }); }
function stagesOf(pl) { var s = listOf(pl.stages).filter(Boolean); return s.length ? s : [{ id: '_', name: 'To do' }]; }
function stageOf(pl, c) { var st = stagesOf(pl); return st.some(function (x) { return x.id === c.stage; }) ? c.stage : st[0].id; }
function stageObj(pl, id) { var st = stagesOf(pl); return st.find(function (x) { return x.id === id; }) || st[0]; }

function cardLate(c) { var t = today(); return ctasks(c).some(function (x) { return !x.done && isDate(x.due) && x.due < t; }); }
function daysIn(c) { return isDate(c.stageAt) ? daysBetween(c.stageAt, today()) : 0; }
function fieldText(f, v) {
  if (v === '' || v == null) return '';
  if (f.type === 'date') return isDate(v) ? niceDate(v) : String(v);
  if (f.type === 'money') return isNaN(Number(v)) ? String(v) : money(v);
  if (f.type === 'number') return isNaN(Number(v)) ? String(v) : Number(v).toLocaleString('en-CA') + ' ' + String(f.name).toLowerCase();
  if (f.type === 'multi') { var l = String(v).split('\n')[0]; return l.length > 40 ? l.slice(0, 39) + '…' : l + (String(v).indexOf('\n') > -1 ? '…' : ''); }
  return String(v);
}
function newPlTask(title) { return { id: uid('t'), title: title, done: false, due: null, doneAt: null }; }

  return { id: uid('c'), title: title, stage: stageId, stageAt: today(), createdAt: today(), fields: {},
    tasks: taskTitles.map(newPlTask), comments: [], pinned: false, archived: false, log: [] };
}

/* ============================================================ reading Project Phases (raw) */
function quests() { return PPD ? listOf(PPD.projects).filter(Boolean) : []; }
function questById(id) { return quests().find(function (p) { return p.id === id; }); }
function phasesOf(p) { return listOf(p.phases).filter(Boolean); }
function stepsOf(ph) { return listOf(ph.steps).filter(Boolean); }
function stepDone(st) { return st.status === 'done'; }
function phaseNow(p) { return phasesOf(p).find(function (ph) { var s = stepsOf(ph); return !s.length || s.some(function (x) { return !stepDone(x); }); }) || null; }
function findStep(pid, phid, sid) {
  var p = questById(pid), ph = p && phasesOf(p).find(function (x) { return x.id === phid; }), st = ph && stepsOf(ph).find(function (x) { return x.id === sid; });
  return st ? { p: p, ph: ph, st: st } : null;
}
function questPct(p) { var all = phasesOf(p).reduce(function (a, ph) { return a.concat(stepsOf(ph)); }, []); return all.length ? Math.round(all.filter(stepDone).length / all.length * 100) : 0; }

  var ms = listOf(PPD && PPD.log).filter(function (e) { return e && e.projectId === p.id && e.start; }).reduce(function (n, e) { return n + ((e.end || Date.now()) - e.start); }, 0);
  var h = Math.floor(ms / 36e5), m = Math.round(ms % 36e5 / 6e4);
  return ms ? (h ? h + 'h' + String(m).padStart(2, '0') : m + 'm') : '';
}

/* ============================================================ Today: linked tasks read through to their owner */
function resolve(t) {
  if (!t.ref) return { title: t.title, done: t.done, due: t.due, repeat: t.repeat, tag: null };
  if (t.ref.app === 'pl') {
    if (!PLD) return { title: t.title, done: false, due: null, tag: { cls: 'pl', label: 'Pipelines · not loaded' }, waiting: true };
    var h = findCard(t.ref.pl, t.ref.c), x = h && ctasks(h.c).find(function (y) { return y.id === t.ref.t; });
    if (!x) return null;
    return { title: x.title, done: !!x.done, due: isDate(x.due) ? x.due : null, src: x, tag: { cls: 'pl', label: shortCard(h.c.title) + ' · ' + h.pl.name, go: function () { openCard(h.pl.id, h.c.id); } } };
  }
  if (!PPD) return { title: t.title, done: false, due: null, tag: { cls: 'pp', label: 'Project Phases · not loaded' }, waiting: true };
  var f = findStep(t.ref.p, t.ref.ph, t.ref.s);
  if (!f) return null;
  return { title: f.st.name, done: stepDone(f.st), due: S.due[f.st.id] || null, src: f.st, tag: { cls: 'pp', label: f.p.name + ' · ' + f.ph.name, go: function () { U.quest = f.p.id; flashId = f.st.id; show('big'); } } };
}
/* A linked task whose source was deleted in its own app quietly leaves the list (only once that app's copy is here). */
function pruneLinks() {
  var keep = S.tasks.filter(function (t) {
    if (!t.ref) return true;
    if (t.ref.app === 'pl') { if (!PLD) return true; var h = findCard(t.ref.pl, t.ref.c); return !!(h && ctasks(h.c).some(function (x) { return x.id === t.ref.t; })); }
    if (!PPD) return true; return !!findStep(t.ref.p, t.ref.ph, t.ref.s);
  });
  if (keep.length !== S.tasks.length) { S.tasks = keep; saveHub(); }
}
function linkedTo(id) { return S.tasks.find(function (t) { return t.ref && (t.ref.t === id || t.ref.s === id); }); }
function listName(id) { return (S.lists.find(function (l) { return l.id === id; }) || {}).name || ''; }

/* ---------------------------------------------------------------- Today */
function taskRow(t) {
  var r = resolve(t); if (!r) return '';
  var chips = (r.done ? '' : dueChip(r.due, r.repeat)) + (r.tag ? '<button class="tag ' + r.tag.cls + '" data-go="' + t.id + '">' + esc(r.tag.label) + (r.tag.go ? ' ↗' : '') + '</button>' : '');
  return '<div class="task' + (r.done ? ' done' : '') + (flashId === t.id ? ' flash' : '') + '" data-edit="' + t.id + '">'
    + (r.done ? '' : '<span class="grip" title="Drag to reorder" aria-hidden="true">⋮⋮</span>')
    + '<button class="circ' + (r.done ? ' on' : '') + '" data-tick="' + t.id + '" aria-label="Done">' + (r.done ? '✓' : '') + '</button>'
    + '<div class="tb"><div class="t">' + esc(r.title) + '</div>' + (t.notes && !r.done ? '<div class="n">' + esc(t.notes) + '</div>' : '')
    + (chips && !r.done ? '<div class="chips">' + chips + '</div>' : '') + '</div></div>';
}
function pullItems() {
  var soon = dayOff(14), free = function (id) { return !linkedTo(id); }, dated = [], seen = {};
  pls().forEach(function (pl) { cardsOf(pl).forEach(function (c) { if (c.archived) return; ctasks(c).forEach(function (x) {
    if (!x.done && isDate(x.due) && x.due <= soon && free(x.id)) dated.push({ title: x.title, due: x.due, tag: shortCard(c.title) + ' · ' + pl.name, cls: 'pl', ref: { app: 'pl', pl: pl.id, c: c.id, t: x.id } });
  }); }); });
  quests().forEach(function (p) { phasesOf(p).forEach(function (ph) { stepsOf(ph).forEach(function (st) {
    var d = S.due[st.id]; if (!stepDone(st) && d && d <= soon && free(st.id)) dated.push({ title: st.name, due: d, tag: p.name + ' · ' + ph.name, cls: 'pp', ref: { app: 'pp', p: p.id, ph: ph.id, s: st.id } });
  }); }); });
  dated.sort(function (a, b) { return a.due.localeCompare(b.due); });
  dated.forEach(function (x) { seen[x.ref.t || x.ref.s] = 1; });
  var ok = function (id) { return free(id) && !seen[id]; };
  var pinnedCards = [];
  pls().forEach(function (pl) { cardsOf(pl).forEach(function (c) { if (c.pinned && !c.archived) pinnedCards.push({ pl: pl, c: c }); }); });
  var pinC = pinnedCards.length > 0, pp = projectsPipe();
  var prodSrc = pinC ? pinnedCards : (pp ? cardsOf(pp).filter(function (c) { return !c.archived && stageOf(pp, c) === stagesOf(pp)[0].id; }).slice(0, 4).map(function (c) { return { pl: pp, c: c }; }) : []);
  var prod = prodSrc.map(function (o) { var x = ctasks(o.c).find(function (y) { return !y.done && ok(y.id); }); return x && { title: x.title, due: x.due, tag: shortCard(o.c.title) + ' · ' + o.pl.name, cls: 'pl', ref: { app: 'pl', pl: o.pl.id, c: o.c.id, t: x.id } }; }).filter(Boolean);
  var pinQ = quests().some(function (p) { return S.pins[p.id]; });
  var big = quests().filter(function (p) { return !pinQ || S.pins[p.id]; }).map(function (p) {
    var ph = phaseNow(p), st = ph && stepsOf(ph).find(function (x) { return !stepDone(x) && ok(x.id); });
    return st && { title: st.name, due: S.due[st.id], tag: p.name + ' · ' + ph.name, cls: 'pp', ref: { app: 'pp', p: p.id, ph: ph.id, s: st.id } };
  }).filter(Boolean);
  return { dated: dated, prod: prod, pinC: pinC, big: big, pinQ: pinQ };
}

function nextDue(due, rep) {
  var d = new Date((isDate(due) ? due : today()) + 'T12:00'), t = today(), g = 0;
  do { if (rep === 'daily') d.setDate(d.getDate() + 1); else if (rep === 'weekly') d.setDate(d.getDate() + 7); else d.setMonth(d.getMonth() + 1); g++; }
  while (dateStr(d) < t && g < 4000);
  return dateStr(d);
}
function dateStr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function tickTask(t) {
  var r = resolve(t); if (!r || r.waiting) return;

    if (!t.done && t.repeat) { t.due = nextDue(t.due, t.repeat); flashId = t.id; commit(); return toast('Done. Next one ' + niceDate(t.due, true)); }
    t.done = !t.done; t.doneAt = t.done ? today() : null; return commit();
  }
  if (t.ref.app === 'pl') { r.src.done = !r.src.done; r.src.doneAt = r.src.done ? today() : null; savePL(); }
  else { setStepDone(r.src, !stepDone(r.src)); savePP(); }
  commit();
  if (!r.done) toast('Ticked here and in ' + (t.ref.app === 'pl' ? 'Pipelines' : 'Project Phases'));
}

    var r = it.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top, px = e.clientX, py = e.clientY;
    var ghost = it.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.classList.remove('flash');
    ghost.style.width = r.width + 'px'; ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost); it.classList.add('dragging'); document.body.classList.add('is-dragging');
    var target = null, before = true, cont = null;
    function clear() { document.querySelectorAll('.drop-before,.drop-after,.drop-in').forEach(function (x) { x.classList.remove('drop-before', 'drop-after', 'drop-in'); }); }
    function place() {
      ghost.style.left = (px - dx) + 'px'; ghost.style.top = (py - dy) + 'px';
      var el = document.elementFromPoint(px, py), over = el && el.closest(o.item);
      cont = el && el.closest(o.container); clear(); target = null;
      if (!cont) return;
      if (over && over !== it && cont.contains(over)) {
        var b = over.getBoundingClientRect();
        before = o.grid ? (px < b.left + b.width / 2) : (py < b.top + b.height / 2);
        over.classList.add(before ? 'drop-before' : 'drop-after'); target = over;
      } else cont.classList.add('drop-in');
    }
    var scroller = setInterval(function () {        // keep scrolling while held near an edge
      if (py < 70) window.scrollBy(0, -14); else if (py > innerHeight - 70) window.scrollBy(0, 14);
      var row = document.elementFromPoint(px, py); row = row && row.closest('.pboard,.lists');
      if (row) { var rb = row.getBoundingClientRect(); if (px < rb.left + 50) row.scrollLeft -= 14; else if (px > rb.right - 50) row.scrollLeft += 14; }
      place();
    }, 30);
    function move(ev) { px = ev.clientX; py = ev.clientY; place(); }
    function end(ev) {
      removeEventListener('pointermove', move); removeEventListener('pointerup', end); removeEventListener('pointercancel', end);
      clearInterval(scroller); ghost.remove(); it.classList.remove('dragging'); document.body.classList.remove('is-dragging'); clear();
      if (ev.type === 'pointercancel' || !cont || !document.contains(it)) return;
      var beforeEl = target;
      if (target && !before) { beforeEl = target.nextElementSibling; while (beforeEl && !beforeEl.matches(o.item)) beforeEl = beforeEl.nextElementSibling; }
      if (beforeEl === it) return;
      o.onDrop(it, cont, beforeEl || null);
    }
    addEventListener('pointermove', move); addEventListener('pointerup', end); addEventListener('pointercancel', end);

}
/* move x inside arr so it sits before `beforeX` (or right after the last item `sameGroup` accepts, or at the end) */
function reorder(arr, x, beforeX, sameGroup) {
  var a = arr.filter(function (y) { return y !== x; }), i = beforeX ? a.indexOf(beforeX) : -1;
  if (i < 0) { i = a.length; for (var k = a.length - 1; k >= 0; k--) if (sameGroup(a[k])) { i = k + 1; break; } }
  a.splice(i, 0, x); return a;
}

/* Today: tasks within a list or into another list */
sortable({ handle: '.task .grip', item: '.task[data-edit]', container: '[data-tlist]', onDrop: function (el, cont, bef) {
  var t = S.tasks.find(function (x) { return x.id === el.getAttribute('data-edit'); }), list = cont.getAttribute('data-tlist'); if (!t) return;
  var b = bef && S.tasks.find(function (x) { return x.id === bef.getAttribute('data-edit'); });
  t.list = list; S.tasks = reorder(S.tasks, t, b, function (x) { return x.list === list && !(resolve(x) || {}).done; }); flashId = t.id; commit();
} });
/* In Production: cards within a stage or into another stage (the order is the Pipelines app's order too) */
sortable({ handle: '.pcard .grip', item: '.pcard[data-card]', container: '[data-col]', onDrop: function (el, cont, bef) {
  var h = cardHit(el.getAttribute('data-card')); if (!h) return;
  var sid = cont.getAttribute('data-col'), b = bef && cardsOf(h.pl).find(function (x) { return x.id === bef.getAttribute('data-card'); });
  moveStage(h.c, sid); h.pl.cards = reorder(cardsOf(h.pl), h.c, b, function (x) { return !x.archived && stageOf(h.pl, x) === sid; }); savePL(); flashId = h.c.id; render();
} });
/* Goals: within the year */
sortable({ handle: '.goal .grip', item: '.goal[data-goal]', container: '.ggrid', grid: true, onDrop: function (el, cont, bef) {
  var g = S.goals.find(function (x) { return x.id === el.getAttribute('data-goal'); }), b = bef && S.goals.find(function (x) { return x.id === bef.getAttribute('data-goal'); }); if (!g) return;
  S.goals = reorder(S.goals, g, b, function (x) { return x.year === g.year; }); flashId = g.id; commit();
} });

addEventListener('pagehide', saveHubNow);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveHubNow(); });
setInterval(function () { if (!$('dlg').classList.contains('on') && !document.activeElement.matches('input,textarea')) render(); }, 30 * 60 * 1000);


/* ---------- time per card (stored in the Pipelines doc: card.log = [{ id, start, end }], end null while running) ---------- */
function cardMs(c, now) { now = now || Date.now(); return listOf(c.log).filter(Boolean).reduce(function (n, e) { return n + Math.max(0, (e.end || now) - e.start); }, 0); }
function dur(ms) { var m = Math.round(ms / 60000), h = Math.floor(m / 60); return h ? h + 'h' + String(m % 60).padStart(2, '0') : m + 'm'; }
function clockOf(ms) { var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h + ':' + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function runningTimer() {
  var ps = pls();
  for (var i = 0; i < ps.length; i++) { var cs = cardsOf(ps[i]); for (var j = 0; j < cs.length; j++) { var e = listOf(cs[j].log).find(function (x) { return x && !x.end; }); if (e) return { pl: ps[i], c: cs[j], e: e }; } }
  return null;
}
function cardRunning(c) { return listOf(c.log).some(function (x) { return x && !x.end; }); }
function stopTimer() { var r = runningTimer(); if (!r) return; r.e.end = Date.now(); if (r.e.end - r.e.start < 1000) r.c.log = listOf(r.c.log).filter(function (x) { return x !== r.e; }); PLD.timers = 1; }
function startTimer(c) { stopTimer(); arr(c, 'log').push({ id: uid('e'), start: Date.now(), end: null }); PLD.timers = 1; }
function tickTimers() {
  var r = runningTimer(), bar = $('runbar');
  if (!r) { bar.classList.remove('on'); return; }
  var now = Date.now();
  bar.classList.add('on');
  bar.querySelector('.rw').innerHTML = esc(r.c.title) + '<small>' + esc(r.pl.name) + '</small>';
  bar.querySelector('.rw').setAttribute('data-open', r.pl.id + ':' + r.c.id);
  bar.querySelector('.rc').textContent = clockOf(now - r.e.start);
  document.querySelectorAll('[data-tclock="' + r.c.id + '"]').forEach(function (el) { el.textContent = '⏱ ' + clockOf(cardMs(r.c, now)); });
}
setInterval(tickTimers, 1000);

/* ============================================================ sync: three docs, one sign-in */
var VIEWS = { hub: null, pl: null, pp: null };
function paintAll() {
  var h = VIEWS.hub || { label: 'Sign in to sync', status: 'signedout' }, btn = $('btn-sync');
  btn.textContent = (h.initial ? h.initial + ' · ' : '') + h.label; btn.title = h.title || '';
  btn.className = 'tbtn' + (h.status === 'synced' ? ' ok' : '') + (h.status === 'conflict' || h.status === 'error' ? ' bad' : '');
  var dot = function (v, name) { var s = v ? v.status : 'signedout'; return '<span class="' + (s === 'synced' ? 'live' : s === 'error' || s === 'conflict' ? 'bad' : '') + '" title="' + name + ': ' + esc(v ? v.label : 'not connected') + '">' + name + '</span>'; };
  $('conn').innerHTML = h.authed ? dot(VIEWS.pl, 'Pipelines') + dot(VIEWS.pp, 'Project Phases') : '';
  var bars = '';
  [['hub', 'Hub', SH], ['pl', 'Pipelines', SP], ['pp', 'Project Phases', SQ]].forEach(function (x) {
    var v = VIEWS[x[0]]; if (!v || !v.barOn) return;
    if (x[0] !== 'hub' && (v.status === 'pending' || v.status === 'private') && VIEWS.hub && VIEWS.hub.barOn) return;   // one access note is enough
    bars += '<div class="sbar"><span class="sync-dot"></span><span class="what"><b>' + x[1] + '</b>' + esc(v.barText) + '</span>'
      + (v.showKeep ? '<button data-keep="' + x[0] + '">' + esc(v.keepLabel || 'Keep this device') + '</button><button data-keepc="' + x[0] + '">' + esc(v.cloudLabel || 'Keep cloud copy') + '</button>' : '')
      + (v.link ? '<a href="' + v.link.href + '">' + esc(v.link.text) + '</a>' : '') + '</div>';
  });
  $('bars').innerHTML = bars;
}
document.addEventListener('click', function (e) {
  var k = e.target.closest('[data-keep],[data-keepc]'); if (!k) return;
  var inst = { hub: SH, pl: SP, pp: SQ }[k.getAttribute('data-keep') || k.getAttribute('data-keepc')];
  if (k.hasAttribute('data-keep')) inst.keepLocal(); else inst.keepCloud();
});
$('btn-sync').addEventListener('click', function () { if (SH) SH.click(); });

function foreign(doc, key, noun, get, set, describe) {
  return window.createCloudSync({
    doc: doc, storageKey: key, noun: noun,
    payload: function () { return get() || {}; },          // exactly what arrived, plus the hub's few edits
    apply: function (d) { set(clone(d)); try { localStorage.setItem(key, JSON.stringify(get())); } catch (e) {} pruneLinks(); render(); return true; },
    untouched: function () { return get() == null; },      // the hub never owns these docs: it only follows them
    flush: function () {},
    describe: describe,
    paint: function (v) { VIEWS[doc === 'pipelines' ? 'pl' : 'pp'] = v; paintAll(); }
  });
}
var SH = null, SP = null, SQ = null;
render();
if (window.createCloudSync) {
  SH = window.createCloudSync({
    doc: 'production-hub', storageKey: HUB_KEY, noun: 'hub',
    payload: function () { return S; },
    apply: function (d) { var n = normHub(d); if (!n) return false; S = n; try { localStorage.setItem(HUB_KEY, JSON.stringify(S)); } catch (e) {} render(); return true; },
    untouched: function () { return JSON.stringify(S) === JSON.stringify(defaultHub()); },
    flush: function () { saveHubNow(); },
    describe: function (d) { var t = listOf(d && d.tasks).length, b = listOf(d && d.brain).length, g = listOf(d && d.goals).length; return t + ' task' + (t === 1 ? '' : 's') + ', ' + b + ' idea' + (b === 1 ? '' : 's') + ', ' + g + ' goal' + (g === 1 ? '' : 's'); },
    paint: function (v) { VIEWS.hub = v; paintAll(); }
  });
  SP = foreign('pipelines', PL_KEY, 'pipelines', function () { return PLD; }, function (v) { PLD = v; },
    function (d) { var p = listOf(d && d.pipelines), c = p.reduce(function (n, x) { return n + listOf(x && x.cards).length; }, 0); return p.length + ' pipelines, ' + c + ' cards'; });
  SQ = foreign('project-phases', PP_KEY, 'projects', function () { return PPD; }, function (v) { PPD = v; },
    function (d) { var p = listOf(d && d.projects); return p.length + ' project' + (p.length === 1 ? '' : 's') + ' in Project Phases'; });
  SH.init(); SP.init(); SQ.init();
  tickTimers();
}
</script>
