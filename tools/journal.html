<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/account.js"></script>   <!-- site-wide account; the tool falls back to its own sign-in without it -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal — Xavier de Belle</title>
<meta name="description" content="A page a day. How it went, three good things, and whatever else needs writing down — with a calendar, streaks and what you wrote on this day before.">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<!-- installable app: works offline once opened, syncs when back online (pwa.js, pwa-sw.js) -->
<link rel="manifest" href="journal.webmanifest">
<link rel="apple-touch-icon" href="icons/journal-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<script src="pwa.js" data-app="journal"></script>
<style>
:root{
  --ink:#000;--paper:#fff;--volt:#ffe800;--smoke:#141414;--ash:#2a2a2a;--dust:#8a8a8a;
  --hair:#e2e2e2;--grey:#6a6a6a;
  --stack:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut:clamp(14px,3vw,32px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--stack)}
button{font:inherit;color:inherit}
a{color:var(--volt);text-decoration:none}
.k{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dust)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:12px var(--gut);border-bottom:3px solid var(--paper);
  padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand a{color:var(--paper);font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand a:hover{color:var(--volt)}
.brand h1{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;font-size:26px;line-height:1}
.brand h1 span{color:var(--volt)}
.btn{background:transparent;border:3px solid var(--paper);color:var(--paper);font-weight:900;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:9px 13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border-radius:0}
.btn:hover{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.btn.solid{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.btn.solid:hover{background:var(--paper);border-color:var(--paper)}
.btn.dark{border-color:var(--ink);color:var(--ink)}
.btn.dark.solid{background:var(--ink);color:var(--volt)}
.btn.dark:hover{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.sync-btn.ok{border-color:var(--ash);color:var(--dust)}
.sync-btn.ok:hover{color:var(--ink)}
.sync-btn.bad{border-color:var(--volt);color:var(--volt)}
.ghost{background:transparent;border:0;color:var(--grey);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 4px;cursor:pointer}
.ghost:hover{color:var(--ink)}
.dark-ghost{color:var(--dust)}
.dark-ghost:hover{color:var(--volt)}

/* ---------- sync bar ---------- */
#sync-bar{display:none;align-items:center;gap:10px 18px;flex-wrap:wrap;background:var(--volt);color:var(--ink);padding:12px var(--gut)}
#sync-bar.on{display:flex}
#sync-bar .sync-dot{width:10px;height:10px;background:var(--ink);flex:none}
#sync-what{flex:1 1 280px;font-family:var(--mono);font-size:11px;line-height:1.6;letter-spacing:.04em}
#sync-bar button{border:3px solid var(--ink);background:var(--ink);color:var(--volt);font-weight:900;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 12px;cursor:pointer}
#sync-bar button+button{background:transparent;color:var(--ink)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:26px;padding:0 var(--gut);border-bottom:3px solid var(--paper);background:var(--smoke);overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;padding:16px 2px 12px;cursor:pointer;font-family:var(--mono);
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust);white-space:nowrap}
.tab:hover{color:var(--paper)}
.tab.on{color:var(--paper);border-bottom-color:var(--volt)}
.tab i{font-style:normal;font-size:10px;color:var(--volt);margin-left:8px;letter-spacing:.06em}
.tab-cal{display:none}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:clamp(18px,3vw,36px) var(--gut) 80px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.aside{display:flex;flex-direction:column;gap:22px;position:sticky;top:16px}
[hidden]{display:none!important}

/* ---------- write ---------- */
.page{background:var(--paper);color:var(--ink)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;padding:clamp(18px,2.6vw,28px) clamp(16px,2.6vw,30px);border-bottom:3px solid var(--ink)}
.date{margin-right:auto;min-width:0}
.date .k{color:var(--grey)}
.date h2{margin:6px 0 0;font-weight:900;text-transform:uppercase;letter-spacing:-.045em;line-height:.86;font-size:clamp(34px,5.4vw,64px)}
.date h2 span{display:block}
.date h2 em{font-style:normal;color:var(--grey)}
.nav{display:flex;gap:8px}
.sq{width:44px;height:44px;border:3px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--mono);font-size:16px;font-weight:700;cursor:pointer}
.sq:hover{background:var(--volt);border-color:var(--volt)}
.sq:disabled{opacity:.25;cursor:default;background:transparent;border-color:var(--ink)}
.block{padding:clamp(16px,2.4vw,26px) clamp(16px,2.6vw,30px);border-bottom:2px solid var(--hair)}
.block>.k{display:flex;justify-content:space-between;gap:12px;color:var(--grey);margin-bottom:12px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:3px solid var(--ink);background:transparent;padding:12px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.mood b{font-size:20px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.mood span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.mood:hover{background:#f4f4f4}
.mood.on{background:var(--volt);border-color:var(--ink)}
.good{display:flex;flex-direction:column}
.good label{display:flex;align-items:center;gap:14px;border-top:2px solid var(--hair);padding:2px 0}
.good label:first-child{border-top:0}
.good label span{font-family:var(--mono);font-size:11px;font-weight:700;flex:none;width:22px}
.good input{flex:1;min-width:0;border:0;outline:none;background:transparent;padding:11px 0;font-family:var(--stack);font-size:16px;font-weight:700;color:var(--ink)}
.good input::placeholder{color:#a8a8a8;font-weight:400}
textarea#body{display:block;width:100%;min-height:240px;border:0;outline:none;background:transparent;resize:none;color:var(--ink);padding:0;
  font-family:var(--stack);font-size:18px;line-height:1.6;field-sizing:content;tab-size:2}
textarea#body::placeholder{color:#a8a8a8}
.prompt{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--volt);padding:12px 14px;margin-bottom:14px}
.prompt p{flex:1 1 240px;margin:0;font-weight:700;font-size:16px;line-height:1.35}
.tags-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tags-row input{flex:1 1 200px;min-width:0;border:2px solid #dcdcdc;padding:10px 12px;font-family:var(--stack);font-size:14px;font-weight:700;color:var(--ink);background:#fff;border-radius:0;outline:none}
.tags-row input:focus{border-color:var(--ink)}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:5px 8px;border:2px solid #dcdcdc;background:transparent;color:var(--grey);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.page-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px clamp(16px,2.6vw,30px)}
.page-foot .k{margin-right:auto;color:var(--grey)}

/* ---------- aside: calendar, stats, on this day ---------- */
.panel{border:3px solid var(--paper)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:3px solid var(--paper)}
.panel-head b{font-weight:900;text-transform:uppercase;letter-spacing:-.03em;font-size:20px}
.panel-head .sq{width:34px;height:34px;border-color:var(--paper);color:var(--paper);font-size:13px}
.panel-head .sq:hover{color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 14px 14px}
.cal .wd{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dust);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1;border:2px solid var(--ash);background:transparent;color:var(--dust);font-family:var(--mono);font-size:11px;font-weight:700;
  cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.day:hover{border-color:var(--paper);color:var(--paper)}
.day.has{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.day.good{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.day.today{outline:2px solid var(--volt);outline-offset:2px}
.day.sel{box-shadow:inset 0 0 0 3px var(--ink);border-color:var(--paper)}
.day.sel:not(.has):not(.good){box-shadow:none;border:3px solid var(--paper);color:var(--paper)}
.day:disabled{opacity:.25;cursor:default}
.day.out{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 14px 14px}
.legend span{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
.legend i{width:10px;height:10px;display:inline-block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--paper);border:3px solid var(--paper)}
.stat{background:var(--ink);padding:14px}
.stat:first-child{background:var(--volt);color:var(--ink)}
.stat:first-child .k{color:rgba(0,0,0,.6)}
.stat b{display:block;margin-top:8px;font-weight:900;letter-spacing:-.045em;font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
.stat b small{font-size:12px;letter-spacing:0;font-weight:700;margin-left:4px}
.past{display:flex;flex-direction:column}
.past button{text-align:left;background:transparent;border:0;border-top:2px solid var(--ash);padding:12px 14px;cursor:pointer;color:var(--paper)}
.past button:first-child{border-top:0}
.past button:hover{background:var(--smoke)}
.past .k{color:var(--volt)}
.past p{margin:6px 0 0;font-size:14px;line-height:1.45;color:#cfcfcf;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.past .none{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);padding:14px;line-height:1.7}

/* ---------- entries ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters input,.filters select{background:transparent;border:3px solid var(--ash);color:var(--paper);padding:10px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;border-radius:0;outline:none}
.filters input{flex:1 1 220px;min-width:0}
.filters input:focus,.filters select:focus{border-color:var(--volt)}
.filters select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--volt) 50%),linear-gradient(135deg,var(--volt) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.filters select option{color:#000}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tagbar .chip{border-color:var(--ash);color:var(--dust)}
.tagbar .chip:hover{border-color:var(--paper);color:var(--paper)}
.tagbar .chip.on{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.entries{display:flex;flex-direction:column;gap:12px}
.entry{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;text-align:left;background:var(--paper);color:var(--ink);border:0;padding:16px 18px;cursor:pointer}
.entry:hover{outline:3px solid var(--volt);outline-offset:3px}
.entry .d{grid-row:span 3;min-width:66px}
.entry .d b{display:block;font-weight:900;font-size:40px;letter-spacing:-.05em;line-height:.85;font-variant-numeric:tabular-nums}
.entry .d span{display:block;margin-top:6px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.entry .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.entry .meta i{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:4px 7px;border:2px solid #dcdcdc;color:var(--grey)}
.entry .meta i.m{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.entry .meta i.m.hi{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.entry p{margin:0;font-size:15px;line-height:1.5;color:#3a3a3a;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.entry .g{font-size:13px;color:var(--grey)}
.nothing{background:var(--paper);color:var(--ink);padding:clamp(24px,4vw,44px)}
.nothing h3{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.88;font-size:clamp(26px,3.4vw,40px)}
.nothing p{margin:14px 0 0;max-width:46ch;font-size:15px;line-height:1.6;color:#4a4a4a}
.list-foot{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:22px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:none;
  align-items:center;gap:16px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);outline:3px solid var(--volt);
  padding:11px 14px;max-width:calc(100vw - 32px)}
#toast.on{display:flex}
#toast span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.5}
#toast button{background:var(--ink);color:var(--volt);border:0;font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 11px;cursor:pointer}

/* ---------- narrower: the calendar becomes its own tab ---------- */
@media (max-width:980px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .aside{position:static}
  .tab-cal{display:inline-block}
  body:not(.view-cal) .aside{display:none}
  body.view-cal .main-col{display:none}
}
@media (max-width:560px){
  .brand a{display:none}
  .brand h1{font-size:22px}
  .mood{padding:10px 2px 8px}
  .mood b{font-size:17px}
  .mood span{font-size:8px;letter-spacing:.08em}
  .entry{grid-template-columns:1fr}
  .entry .d{grid-row:auto;display:flex;align-items:baseline;gap:10px}
  .entry .d b{font-size:28px}
}
@media print{.top,#sync-bar,.tabs,.aside,.page-foot,.nav,.prompt,.suggest{display:none!important}.wrap{display:block}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><a href="../index.html">Xavier de Belle</a><h1>Journal<span>.</span></h1></div>
  <button class="btn" type="button" data-pwa-install style="display:none" title="Install as an app: its own icon, works offline">Install app</button>
  <button class="btn sync-btn" id="btn-sync" onclick="syncClick()" style="display:none">Sign in to sync</button>
  <button class="btn" id="btn-signout" onclick="signOutNow()" style="display:none" title="Sign out of sync">Sign out</button>
</header>

<div id="sync-bar" role="status">
  <span class="sync-dot"></span>
  <span id="sync-what"></span>
  <button id="sync-keep-local" onclick="keepLocal()">Keep this device</button>
  <button id="sync-keep-cloud" onclick="keepCloud()">Keep cloud copy</button>
</div>

<nav class="tabs" aria-label="Views">
  <button class="tab on" type="button" data-view="write">Write</button>
  <button class="tab tab-cal" type="button" data-view="cal">Calendar</button>
  <button class="tab" type="button" data-view="list">Entries<i id="count"></i></button>
</nav>

<div class="wrap">
  <div class="main-col">

    <!-- ============ WRITE ============ -->
    <section id="v-write" class="page" aria-label="Journal entry">
      <div class="page-head">
        <div class="date"><span class="k" id="d-week"></span><h2 id="d-date"></h2></div>
        <div class="nav">
          <button class="sq" id="prev" type="button" aria-label="Previous day" title="Previous day (Alt+←)">←</button>
          <button class="btn dark" id="today" type="button">Today</button>
          <button class="sq" id="next" type="button" aria-label="Next day" title="Next day (Alt+→)">→</button>
        </div>
      </div>

      <div class="block">
        <div class="k"><span>How was the day?</span><span id="mood-word"></span></div>
        <div class="moods" id="moods" role="radiogroup" aria-label="Mood"></div>
      </div>

      <div class="block">
        <div class="k"><span>Three good things</span></div>
        <div class="good" id="good">
          <label><span>01</span><input type="text" data-g="0" placeholder="Something that went right" maxlength="240"></label>
          <label><span>02</span><input type="text" data-g="1" placeholder="Someone you were glad to see" maxlength="240"></label>
          <label><span>03</span><input type="text" data-g="2" placeholder="Anything small counts" maxlength="240"></label>
        </div>
      </div>

      <div class="block">
        <div class="k"><span>Write</span><button class="ghost" id="btn-prompt" type="button" style="padding:0">Prompt me</button></div>
        <div class="prompt" id="prompt" hidden>
          <p id="prompt-text"></p>
          <button class="btn dark solid" id="prompt-use" type="button">Use it</button>
          <button class="ghost" id="prompt-next" type="button" style="color:var(--ink)">Another</button>
          <button class="ghost" id="prompt-close" type="button" style="color:var(--ink)">×</button>
        </div>
        <textarea id="body" spellcheck="true" placeholder="What happened, what you're thinking, what's next.&#10;&#10;- a dash and a space makes a bullet"></textarea>
      </div>

      <div class="block">
        <div class="k"><span>Tags</span></div>
        <div class="tags-row"><input type="text" id="tags" placeholder="work, family, training — comma separated" autocomplete="off"></div>
        <div class="suggest" id="suggest"></div>
      </div>

      <div class="page-foot">
        <span class="k" id="stamp"></span>
        <button class="ghost" id="btn-copy" type="button">Copy</button>
        <button class="ghost" id="btn-del" type="button">Delete entry</button>
      </div>
    </section>

    <!-- ============ ENTRIES ============ -->
    <section id="v-list" hidden aria-label="All entries">
      <div class="filters">
        <input type="search" id="q" placeholder="Search everything you've written" aria-label="Search entries">
        <select id="f-mood" aria-label="Filter by mood">
          <option value="">Any day</option>
          <option value="5">Great days</option><option value="4">Good days</option><option value="3">Okay days</option>
          <option value="2">Low days</option><option value="1">Rough days</option>
        </select>
      </div>
      <div class="tagbar" id="tagbar"></div>
      <div class="entries" id="entries"></div>
      <div class="list-foot">
        <button class="ghost dark-ghost" id="btn-md" type="button">Export as text (.md)</button>
        <button class="ghost dark-ghost" id="btn-json" type="button">Export backup (.json)</button>
        <button class="ghost dark-ghost" id="btn-import" type="button">Import backup</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </section>
  </div>

  <!-- ============ ASIDE ============ -->
  <aside class="aside" aria-label="Calendar and stats">
    <div class="panel">
      <div class="panel-head">
        <button class="sq" id="m-prev" type="button" aria-label="Previous month">←</button>
        <b id="m-name"></b>
        <button class="sq" id="m-next" type="button" aria-label="Next month">→</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="legend">
        <span><i style="background:var(--paper)"></i>Written</span>
        <span><i style="background:var(--volt)"></i>Good or great</span>
        <span><i style="outline:2px solid var(--volt);outline-offset:1px"></i>Today</span>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="panel">
      <div class="panel-head"><b>On this day</b></div>
      <div class="past" id="past"></div>
    </div>
  </aside>
</div>

<div id="toast" role="status"><span id="toast-msg"></span><button id="toast-undo" type="button">Undo</button></div>

<script>
/* ============================================================
   JOURNAL — Xavier de Belle
   One entry per day: a mood, three good things, free writing,
   tags. Saved in this browser as you type; synced while signed in.
   ============================================================ */
var STORAGE_KEY = 'xdb.journal.v1';
var $ = function (id) { return document.getElementById(id); };
var MOODS = [null, 'Rough', 'Low', 'Okay', 'Good', 'Great'];
var PROMPTS = [
  'What took more energy than it should have?', 'What are you looking forward to this week?',
  'What did you learn today, even something small?', 'Who made today better, and did you tell them?',
  'What would you do differently if you had today again?', 'What is on your mind that you haven’t said out loud?',

/* ---------- dates (local, as YYYY-MM-DD) ---------- */

}

/* ---- the visible half ---- */
function hhmm(ms) {
  var d = new Date(ms);
  return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
}
function setStatus(s) {
  cloud.status = s;
  if (s === 'synced') cloud.at = cloud.at || Date.now();
  paintSync();
}

function paintSync() {
  var btn = syncEl('btn-sync'), out = syncEl('btn-signout'), bar = syncEl('sync-bar');
  if (!btn) return;
  if (!cloud.on) { btn.style.display = 'none'; out.style.display = 'none'; bar.classList.remove('on'); return; }

  var label, title;
  switch (cloud.status) {
    case 'working':  label = 'Syncing…';                   title = 'Talking to the cloud'; break;
    case 'synced':   label = 'Live · ' + hhmm(cloud.at);   title = 'Signed in — changes on your other devices appear here as they happen'; break;
    case 'conflict': label = 'Pick a version';             title = 'Two versions to choose between \u2014 see the note below'; break;
    case 'pending':  label = 'Access requested';           title = 'Waiting for Xavier to approve this account'; break;
    case 'private':  label = 'No access';                  title = 'This account is not on the invitation list'; break;
    case 'error':    label = isOffline(cloud.msg) ? 'Offline \u00b7 saved here' : 'Sync failed';                title = explain(cloud.msg); break;
    default:         label = 'Sign in to sync';            title = 'Keep this in step across your devices';
  }
  var acct = account();
  if (acct && cloud.authed) {
    btn.innerHTML = acct.badgeHTML() + ' <span>' + label.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) + '</span>';
    title += ' \u2014 open your account';
  } else {
    btn.textContent = label;
  }
  btn.title = title;
  btn.className = SYNC.buttonClass(cloud.status);
  btn.style.display = '';
  out.style.display = cloud.authed && !acct ? '' : 'none';   // with the site account, signing out lives in its panel

  var what = syncEl('sync-what'), kl = syncEl('sync-keep-local'), kc = syncEl('sync-keep-cloud');
  if (cloud.status === 'pending' || cloud.status === 'private' || cloud.status === 'error') {
    what.textContent = cloud.status === 'pending'
      ? 'Sync is by invitation, and your request is in. Once Xavier approves it, syncing starts here on its own. ' +
        'Until then everything keeps saving in this browser as usual. '
      : cloud.status === 'private'
      ? 'Sync on this site is by invitation, and this account isn\u2019t on the list. ' +
        'Everything still saves in this browser exactly as before, and nothing is sent anywhere. '
      : explain(cloud.msg);
    if (cloud.status !== 'error') {
      var more = document.createElement('a');
      more.href = ACCESS_URL;
      more.textContent = 'About access \u2192';
      what.appendChild(more);
    }
    kl.style.display = 'none';
    kc.style.display = 'none';
    bar.classList.add('on');
    return;
  }
  kl.style.display = '';
  kc.style.display = '';
  var b = readBackup();
  if (cloud.status === 'conflict' && cloud.pending) {
    var w = choiceWords(cloud.pending);
    what.textContent = w.text;
    kl.textContent = w.local;
    kc.textContent = w.cloud;
    bar.classList.add('on');
  } else if (b && b.shown) {
    what.textContent = b.restored
      ? 'Restored. The version you replaced (' + b.summary + ') is saved here in case you want it back.'
      : 'Done. The version you didn\u2019t keep \u2014 ' + b.label + ' (' + b.summary + ') \u2014 is saved on this device for ' + BACKUP_DAYS + ' days.';
    kl.textContent = b.restored ? 'Switch back' : 'Restore it';
    kc.textContent = 'OK';
    bar.classList.add('on');
  } else {
    bar.classList.remove('on');
  }
}

function initCloud() {
  seedMeta();
  paintSync();
  if (!cloud.on) return;

  /* Only someone who has signed in here before gets the SDK on load; a
     visitor who never touches the button never fetches it. Signed in
     anywhere on the site counts. */
  var acct = account();
  if (acct) {
    acct.registerTool({ doc: SYNC.doc, syncNow: function () { syncNow(true); } });
    acct.on(function (st) {
      if (st.user && !cloud.listening) loadSDK().then(listen).catch(function () {});   // signed in from the panel
      paintSync();
    });
  }
  if (meta().signedIn || (acct && acct.wanted())) {
    setStatus('working');
    loadSDK().then(listen).catch(function (err) { cloud.msg = errCode(err); setStatus('error'); });
  }

  document.addEventListener('visibilitychange', function () {
    if (!cloud.uid) return;
    if (document.hidden) {
      // a phone suspends the page soon after it hides: send anything unsent now
      SYNC.flush();
      if (meta().updatedAt > meta().lastSyncedAt) syncNow();
    } else {
      syncNow();
    }
  });
  window.addEventListener('focus', function () { if (cloud.uid) syncNow(); });
  window.addEventListener('online', function () { if (cloud.uid) syncNow(); });
}

/* ---------- boot ---------- */
renderAll();
initCloud();
window.addEventListener('beforeunload', saveNow);
window.addEventListener('pagehide', saveNow);

// test hooks
window.__journal = { state: function () { return state; }, go: go };
</script>
