<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Hub — de Belle Photography</title>
<meta name="robots" content="noindex, nofollow">
<meta name="xdb-companion" content="wedding-schedule.html">
<link rel="canonical" href="https://xavierdebelle.com/tools/wedding-hub.html">
<meta name="description" content="Your wedding, before and after: checklist, budget, day schedule, family photos, and everything that comes once the day is done.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* de Belle Photography design system: pure black and white, Georgia for
     headings and accents, Lato for text, spaced caps for labels, square
     edges, no shadows. Space does the separating. */
  :root{
    --noir:#0D0D0D; --charcoal:#1A1A1A; --graphite:#4A4A4A; --grey:#888888;
    --silver:#C2C2C2; --mist:#F5F5F5; --white:#FFFFFF;
    --serif:Georgia,"Times New Roman",serif;
    --sans:"Lato","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--white); color:var(--graphite); font-family:var(--sans); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased}
  [hidden]{display:none !important}
  a{color:var(--noir)}
  .wrap{max-width:920px; margin:0 auto; padding:48px 24px 96px}
  header.brand{text-align:center; margin-bottom:28px}
  header.brand img{width:190px; height:auto; display:block; margin:0 auto}
  .caps{font-size:11px; font-weight:300; letter-spacing:.32em; text-transform:uppercase; color:var(--grey)}
  header.brand .caps{margin-top:20px}
  .couple{font-family:var(--serif); font-style:italic; font-size:clamp(24px,4vw,32px); color:var(--noir); margin:18px 0 4px; font-weight:400}
  .count{font-family:var(--serif); font-size:15px; color:var(--graphite)}
  .count b{font-weight:400; color:var(--noir)}
  .linkish{background:none; border:0; padding:0; font:inherit; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey); cursor:pointer; text-decoration:underline; text-decoration-color:var(--silver); text-underline-offset:4px}
  .linkish:hover{opacity:.6}
  .next-pay{margin-top:8px; font-size:13px; color:var(--grey)}

  /* phase switch */
  .phases{display:grid; grid-template-columns:1fr 1fr; margin:40px 0 0; border-bottom:1px solid var(--silver)}
  .phases button{background:none; border:0; padding:18px 8px 16px; font-family:var(--serif); font-size:clamp(17px,2.6vw,22px); color:var(--grey); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:opacity .3s ease-in-out}
  .phases button[aria-selected="true"]{color:var(--noir); border-bottom-color:var(--noir)}
  .phases button:hover{opacity:.7}
  nav.tabs{display:flex; gap:28px; overflow-x:auto; padding:18px 2px 4px; scrollbar-width:none; justify-content:center}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:none; background:none; border:0; padding:6px 0; font-family:var(--sans); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--grey); cursor:pointer; border-bottom:1px solid transparent}
  nav.tabs button[aria-selected="true"]{color:var(--noir); border-bottom-color:var(--noir)}
  @media(max-width:700px){nav.tabs{justify-content:flex-start; gap:22px}}

  h2.section{font-family:var(--serif); font-weight:400; font-size:clamp(26px,3.4vw,34px); line-height:1.3; color:var(--noir); margin:56px 0 10px}
  .lede{font-family:var(--serif); font-style:italic; font-size:17px; line-height:1.7; color:var(--graphite); margin:0 0 32px; max-width:640px}
  h3.sub{font-family:var(--sans); font-size:11px; font-weight:400; letter-spacing:.28em; text-transform:uppercase; color:var(--noir); margin:44px 0 14px}
  .card{background:var(--mist); padding:28px 30px; margin-bottom:16px}
  .card h3{margin:0 0 6px; font-family:var(--serif); font-weight:400; font-size:21px; color:var(--noir)}
  .card p{margin:0 0 18px}
  .card p.note{font-family:var(--serif); font-style:italic; color:var(--graphite)}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 22px}
  .full{grid-column:1 / -1}
  @media(max-width:640px){.grid{grid-template-columns:1fr} .card{padding:22px 18px} .wrap{padding:36px 16px 80px}}

  label,.label{display:block; font-size:10px; font-weight:400; letter-spacing:.16em; text-transform:uppercase; margin-bottom:7px; color:var(--grey)}
  input,select,textarea{width:100%; padding:11px 12px; border:1px solid var(--silver); border-radius:0; font:inherit; font-size:16px; background:var(--white); color:var(--noir); -webkit-appearance:none; appearance:none; transition:border-color .3s ease-in-out}
  input[type="date"]{min-height:46px}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--noir) 50%),linear-gradient(135deg,var(--noir) 50%,transparent 50%); background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px}
  input::placeholder,textarea::placeholder{color:var(--silver)}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--noir)}
  textarea{resize:vertical; min-height:72px}
  button{font-family:var(--sans)}
  .btn{display:inline-block; font-weight:400; letter-spacing:.14em; text-transform:uppercase; font-size:11px; padding:15px 28px; border-radius:0; border:0; cursor:pointer; transition:opacity .3s ease-in-out; text-decoration:none; background:var(--noir); color:var(--white)}
  .btn:hover{opacity:.7}
  .btn.ghost{background:transparent; color:var(--noir); border:1px solid var(--noir); padding:14px 27px}
  .btn.small{padding:10px 18px; font-size:10px}
  .btn.ghost.small{padding:9px 17px}
  .row-actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:22px}
  .x{background:none; border:0; color:var(--grey); font-size:20px; line-height:1; cursor:pointer; padding:4px 8px}
  .x:hover{color:var(--noir)}
  .muted{color:var(--grey)}
  .serif{font-family:var(--serif)}

  /* gate + setup */
  .gate{max-width:420px; margin:12vh auto 0; text-align:center; padding:0 16px}
  .gate img{width:200px; display:block; margin:0 auto 22px}
  .gate .couple{margin-bottom:28px}
  .gate form{margin-top:28px; text-align:left}
  .gate .err{color:var(--noir); font-family:var(--serif); font-style:italic; min-height:24px; margin-top:12px; text-align:center}
  .gate .btn{width:100%; margin-top:16px}

  /* progress */
  .progress{display:flex; align-items:center; gap:16px; margin:0 0 8px}
  .bar{flex:1; height:2px; background:var(--silver); position:relative}
  .bar i{position:absolute; left:0; top:0; bottom:0; background:var(--noir); transition:width .4s ease-in-out}
  .progress .caps{flex:none; letter-spacing:.2em}

  /* checklist */
  .group{margin-top:36px}
  .item{border-top:1px solid var(--mist); }
  .item:last-child{border-bottom:1px solid var(--mist)}
  .item-head{display:flex; align-items:flex-start; gap:16px; padding:16px 0}
  .tick{flex:none; width:22px; height:22px; border:1px solid var(--noir); background:var(--white); cursor:pointer; position:relative; margin-top:3px; padding:0}
  .tick[aria-checked="true"]{background:var(--noir)}
  .tick[aria-checked="true"]::after{content:""; position:absolute; left:7px; top:3px; width:6px; height:11px; border:solid var(--white); border-width:0 1.5px 1.5px 0; transform:rotate(45deg)}
  .item-main{flex:1; min-width:0; cursor:pointer}
  .item-title{font-family:var(--serif); font-size:19px; color:var(--noir); line-height:1.35}
  .item.done .item-title{color:var(--grey); text-decoration:line-through; text-decoration-color:var(--silver)}
  .item-meta{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey); margin-top:4px}
  .item-meta .noteline{text-transform:none; letter-spacing:0; font-family:var(--serif); font-style:italic; font-size:13px}
  .item-body{padding:0 0 22px 38px}
  .item-body p{margin:0 0 14px; font-family:var(--serif); font-style:italic}
  .item-body .grid{grid-template-columns:2fr 1fr}
  @media(max-width:640px){.item-body{padding-left:0} .item-body .grid{grid-template-columns:1fr}}
  .add-line{display:flex; gap:10px; margin-top:22px}
  .add-line input{flex:1}

  /* budget */
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--silver); border:1px solid var(--silver); margin-bottom:12px}
  .tile{background:var(--white); padding:18px 16px}
  .tile .label{margin-bottom:6px}
  .tile .val{font-family:var(--serif); font-size:clamp(20px,3vw,26px); color:var(--noir)}
  .tile input{font-family:var(--serif); font-size:20px; padding:4px 0; border:0; border-bottom:1px solid var(--silver)}
  @media(max-width:640px){.tiles{grid-template-columns:1fr 1fr}}
  .verdict{font-family:var(--serif); font-style:italic; margin:0 0 8px; min-height:26px}
  .cat{margin-top:34px}
  .cat-head{display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--noir); padding-bottom:8px}
  .cat-head input{flex:1; border:0; padding:0; font-family:var(--serif); font-size:21px; background:transparent}
  .cat-head .sum{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--grey); white-space:nowrap}
  .lines-head,.bline{display:grid; grid-template-columns:minmax(0,2.2fr) 1fr 1fr 1.25fr 52px 30px; gap:10px; align-items:center}
  .lines-head{padding:10px 0 4px}
  .lines-head span{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey)}
  .bline{padding:6px 0; border-bottom:1px solid var(--mist)}
  .bline input{padding:8px 8px; font-size:15px}
  .bline input.money{text-align:right}
  .paid{display:flex; align-items:center; justify-content:center; gap:6px}
  .paid .tick{width:18px; height:18px; margin:0}
  .paid .tick[aria-checked="true"]::after{left:5px; top:1px; width:5px; height:10px}
  .bline .lab{display:none}
  @media(max-width:700px){
    .lines-head{display:none}
    .bline{grid-template-columns:1fr 1fr 30px; grid-template-areas:"nm nm x" "pl ac ac" "due paid paid"; padding:14px 0; row-gap:12px}
    .bline .nm{grid-area:nm} .bline .pl{grid-area:pl} .bline .ac{grid-area:ac} .bline .due{grid-area:due} .bline .x{grid-area:x}
    .bline .paid{grid-area:paid; justify-content:flex-start; align-self:end; padding-bottom:12px}
    .bline .lab{display:block; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); margin-bottom:4px}
    .cat-head{flex-wrap:wrap} .cat-head input{flex:1 1 70%} .cat-head .sum{order:3; flex:1 1 100%}
  }
  .pay-list{margin:0; padding:0; list-style:none}
  .pay-list li{display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--silver); font-size:14px}
  .pay-list li:first-child{border-top:1px solid var(--silver)}
  .pay-list .when{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); white-space:nowrap}
  .pay-list .late{color:var(--noir); font-weight:700}

  /* simple rows (family, vendors) */
  .frow{display:grid; grid-template-columns:22px minmax(0,1fr) minmax(0,1.3fr) 30px; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--mist)}
  .frow .t{font-family:var(--serif); font-size:17px; color:var(--noir)}
  .frow.off .t{color:var(--grey)}
  .frow input.t{font-size:16px}
  @media(max-width:640px){.frow{grid-template-columns:22px 1fr 30px} .frow .names{grid-column:2 / 4}}
  .vendor{background:var(--mist); padding:22px 24px; margin-bottom:12px}
  .vendor .top{display:flex; gap:12px; align-items:center; margin-bottom:14px}
  .vendor .top input{flex:1; border:0; background:transparent; padding:0; font-family:var(--serif); font-size:20px}
  .vendor .grid{grid-template-columns:1fr 1fr 1fr}
  .vendor .quick{margin-top:10px; font-size:13px}
  .vendor .quick a{margin-right:18px; text-decoration-color:var(--silver); text-underline-offset:3px}
  @media(max-width:640px){.vendor .grid{grid-template-columns:1fr} .vendor{padding:18px 16px}}

  /* delivery timeline */
  .steps{margin:8px 0 0; padding:0; list-style:none}
  .steps li{display:grid; grid-template-columns:22px 1fr; gap:18px; padding:0 0 30px; position:relative}
  .steps li::before{content:""; position:absolute; left:10px; top:24px; bottom:0; width:1px; background:var(--silver)}
  .steps li:last-child::before{display:none}
  .dot{width:21px; height:21px; border:1px solid var(--noir); background:var(--white); margin-top:3px}
  .steps li.reached .dot{background:var(--noir)}
  .steps .t{font-family:var(--serif); font-size:20px; color:var(--noir)}
  .steps .d{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey); margin:2px 0 6px}
  .steps p{margin:0; font-size:14px}

  /* keepsakes */
  .shop{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px}
  .prod{background:var(--mist); padding:24px 22px; display:flex; flex-direction:column}
  .prod h4{margin:0 0 4px; font-family:var(--serif); font-weight:400; font-size:19px; color:var(--noir)}
  .prod .price{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--noir); margin-bottom:10px}
  .prod p{margin:0 0 16px; font-size:14px; flex:1}
  .prod .qty{display:flex; gap:10px; align-items:center; margin-bottom:14px}
  .prod .qty input{width:96px}
  .prod .qty span{font-size:12px; color:var(--grey)}
  .prod.on{background:var(--noir); color:var(--silver)}
  .prod.on h4,.prod.on .price{color:var(--white)}
  .prod.on .btn{background:var(--white); color:var(--noir)}
  .prod.on .qty span{color:var(--silver)}
  .prod.on .qty input{background:var(--charcoal); color:var(--white); border-color:var(--graphite)}
  .order{margin-top:40px; border-top:1px solid var(--noir); padding-top:24px}
  .order-line{display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid var(--mist); font-size:14px}
  .order-total{display:flex; justify-content:space-between; padding:16px 0 4px; font-family:var(--serif); font-size:22px; color:var(--noir)}

  .studio{margin-top:96px; text-align:center; font-size:10px; font-weight:300; letter-spacing:.24em; text-transform:uppercase; color:var(--grey); line-height:2.2}
  .studio a{color:var(--grey); text-decoration:none}
  .studio a:hover,.studio button:hover{opacity:.6}
  .studio button{background:none; border:0; padding:0 6px; font:inherit; letter-spacing:inherit; text-transform:inherit; color:var(--grey); cursor:pointer}
  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--noir); color:var(--white); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding:14px 22px; opacity:0; transition:opacity .4s ease-in-out; pointer-events:none; z-index:20}
  .toast.show{opacity:1}

  @media print{
    .phases,nav.tabs,.studio,.row-actions,.add-line,.x,.linkish,.btn{display:none !important}
    .wrap{padding:0; max-width:100%}
    .card,.vendor,.prod{background:#fff; border:1px solid var(--silver)}
  }
</style>
<script defer src="../assets/stats.js"></script>
</head>
<body>

<!-- ============ GATE ============ -->
<div id="gate" class="gate" hidden>
  <img class="logo" alt="de Belle Photography">
  <div class="caps">Wedding Hub</div>
  <form id="gateForm" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">→ Enter</button>
    <div class="err" id="gateErr"></div>
  </form>
</div>

<!-- ============ SETUP ============ -->
<div id="setup" class="gate" hidden>
  <img class="logo" alt="de Belle Photography">
  <div class="caps">Wedding Hub</div>
  <p class="couple">Welcome. Tell us who you are.</p>
  <form id="setupForm">
    <div class="grid">
      <div><label for="n1">Your name</label><input id="n1" required placeholder="First name"></div>
      <div><label for="n2">Your partner's name</label><input id="n2" required placeholder="First name"></div>
      <div class="full"><label for="wd">Wedding date <span class="muted" style="text-transform:none;letter-spacing:0">(leave empty if not chosen yet)</span></label><input id="wd" type="date"></div>
    </div>
    <button class="btn" type="submit">→ Open our hub</button>
  </form>
</div>

<!-- ============ HUB ============ -->
<div id="hub" class="wrap" hidden>
  <header class="brand">
    <img class="logo" alt="de Belle Photography">
    <div class="caps">Wedding Hub</div>
    <h1 class="couple" id="coupleName"></h1>
    <div class="count" id="countLine"></div>
    <div class="next-pay" id="nextPay"></div>
    <div style="margin-top:12px"><button class="linkish" id="editDetails">Edit our details</button></div>
  </header>

  <div class="phases" role="tablist">
    <button role="tab" data-phase="before">Before the Wedding</button>
    <button role="tab" data-phase="after">After the Wedding</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main id="view"></main>

  <footer class="studio">
    M O N T R É A L · E S T. 1 9 9 3<br>
    <a href="mailto:yourwedding@debellephotography.com">yourwedding@debellephotography.com</a> · <a href="tel:5148874686">514-887-4686</a><br>
    <a href="https://debellephotography.com" target="_blank" rel="noopener">debellephotography.com</a><br>
    <span style="display:inline-block;margin-top:18px">
      <button id="saveCopy">Save a copy</button> · <button id="loadCopy">Load a copy</button> · <button id="lockHub">Lock</button>
    </span>
    <input type="file" id="loadFile" accept="application/json,.json" hidden>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------
   de Belle Photography Wedding Hub
   Test build: everything is kept in this browser only (localStorage).
   The password is a soft gate for testers, not real protection: the
   page itself is public, so never put anything private in it.
------------------------------------------------------------------- */
const KEY = 'debelle.weddinghub.v1';
const UNLOCK = 'debelle.weddinghub.unlocked';
const PASS_HASH = '7f2a0a0e';                 // FNV-1a of the hub password
const STUDIO_EMAIL = 'yourwedding@debellephotography.com';
const REVIEW_URL = 'https://www.google.com/search?q=de+Belle+Photography+Montreal+reviews';
const CATALOG_URL = 'https://xdb-tools-default-rtdb.firebaseio.com/catalog/package-builder.json';
const CATALOG_CACHE = 'debelle.pkg.catalog';   // shared with the Package Builder
// Usual delivery times after the wedding, in days. Change them here.
const DELIVERY = [
  { id:'day',     t:'Your wedding day',     days:0,   p:'The day itself. We are there from the first button to the last dance.' },
  { id:'peek',    t:'A first look',         days:7,   p:'A handful of favourites, so you have something to share while we work on the rest.' },
  { id:'gallery', t:'Your photographs',     days:56,  p:'Your full gallery, each image chosen and finished by hand. It arrives by email with a private link.' },
  { id:'film',    t:'Your film',            days:112, p:'Your film, cut to music. You can leave notes on it at the exact second, right from your review link.' },

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { v = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(v) ? v : 0; };
const money = n => '$' + Math.round(n).toLocaleString('en-CA');
const fnv = s => { let x = 2166136261; for (const c of s) { x ^= c.charCodeAt(0); x = Math.imul(x, 16777619) >>> 0; } return x.toString(16); };
const parseDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fmtDate = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
const fmtShort = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
const fmtMonth = d => d.toLocaleDateString('en-GB', { month:'long', year:'numeric' });
const days = (a, b) => Math.round((b - a) / 86400000);
const noDash = s => String(s || '').replace(/\s*—\s*/g, '. ');
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }
function mail(subject, body) { location.href = 'mailto:' + STUDIO_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body); }

];

function fresh() {
  return {
    v:1, names:['', ''], date:'', phase:null, tab:{ before:'checklist', after:'delivery' },
    checklist: CHECKLIST.map(c => ({ id:uid(), t:c.t, m:c.m, hint:c.hint, go:c.go || '', done:!!c.done, note:c.note || '' })),
    budget: { total: 0, cats: BUDGET.map(([n, ls]) => ({ id:uid(), name:n, lines: ls.map(([ln, p]) => ({ id:uid(), name:ln, plan:p, act:0, due:'', paid:false })) })) },
    family: { groups: FAMILY.map(t => ({ id:uid(), t, names:'', on:true })), moments:'', notes:'' },
    vendors: VENDORS.map(r => ({ id:uid(), role:r, name:'', phone:'', email:'', note:'' })),
    links: { photo:'', video:'' },
    keep: { sel:{}, msg:'' },
  };
}
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
  if (!S || S.v !== 1) S = fresh();
  const f = fresh();
  for (const k in f) if (S[k] == null) S[k] = f[k];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
load();

/* ---------- gate + setup ---------- */
function unlocked() { try { return localStorage.getItem(UNLOCK) === PASS_HASH; } catch (e) { return false; } }
function boot() {
  $('#gate').hidden = $('#setup').hidden = $('#hub').hidden = true;
  if (!unlocked()) { $('#gate').hidden = false; setTimeout(() => $('#pw').focus(), 50); return; }
  if (!S.names[0]) { openSetup(); return; }
  $('#hub').hidden = false;
  renderAll();
}
$('#gateForm').addEventListener('submit', e => {
  e.preventDefault();
  if (fnv($('#pw').value.trim().toLowerCase()) === PASS_HASH) {
    try { localStorage.setItem(UNLOCK, PASS_HASH); } catch (err) {}
    $('#pw').value = ''; $('#gateErr').textContent = ''; boot();
  } else { $('#gateErr').textContent = 'That is not the password. Try again.'; }
});
function openSetup() {
  $('#gate').hidden = $('#hub').hidden = true; $('#setup').hidden = false;
  $('#n1').value = S.names[0]; $('#n2').value = S.names[1]; $('#wd').value = S.date;
  setTimeout(() => $('#n1').focus(), 50);
}
$('#setupForm').addEventListener('submit', e => {
  e.preventDefault();
  S.names = [$('#n1').value.trim(), $('#n2').value.trim()];
  S.date = $('#wd').value;
  S.phase = null; save(); boot();
});
$('#editDetails').onclick = openSetup;
$('#lockHub').onclick = () => { try { localStorage.removeItem(UNLOCK); } catch (e) {} boot(); };
$('#saveCopy').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type:'application/json' }));
  a.download = 'wedding-hub-' + (S.names.join('-').toLowerCase().replace(/[^a-z0-9-]+/g, '') || 'copy') + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#loadCopy').onclick = () => $('#loadFile').click();
$('#loadFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || d.v !== 1 || !Array.isArray(d.checklist)) throw 0;
    if (!confirm('Replace everything in this hub with the copy you picked?')) return;
    S = Object.assign(fresh(), d); save(); boot(); toast('Copy loaded');
  } catch (err) { alert('That file is not a Wedding Hub copy.'); }
};

/* ---------- tabs ---------- */
const TABS = {
  before: [['checklist', 'Checklist'], ['budget', 'Budget'], ['photo', 'Photography & Film'], ['schedule', 'Day Schedule'], ['family', 'Family Photos'], ['vendors', 'Vendors']],
  after:  [['delivery', 'Delivery'], ['photoreview', 'Photo Review'], ['filmreview', 'Film Review'], ['keepsakes', 'Keepsakes'], ['share', 'Share the Love']],
};
function married() { const d = parseDate(S.date); return d && d <= today(); }
function phase() { return S.phase || (married() ? 'after' : 'before'); }
function go(tab) {
  const ph = TABS.before.some(t => t[0] === tab) ? 'before' : 'after';
  S.phase = ph; S.tab[ph] = tab; save(); renderAll(); window.scrollTo({ top: $('.phases').offsetTop - 10, behavior:'smooth' });
}
document.querySelectorAll('.phases button').forEach(b => b.onclick = () => { S.phase = b.dataset.phase; save(); renderAll(); });

function renderAll() {
  const [a, b] = S.names;
  $('#coupleName').textContent = b ? a + ' & ' + b : a;
  const d = parseDate(S.date), t = today();
  let line = 'Your date is still to be chosen.';
  if (d) {
    const n = days(t, d);
    line = n > 1 ? '<b>' + n + ' days</b> until ' + fmtDate(d)
      : n === 1 ? '<b>Tomorrow.</b> ' + fmtDate(d)
      : n === 0 ? '<b>Today is the day.</b>'
      : 'Married on ' + fmtDate(d);
  }
  $('#countLine').innerHTML = line;
  const np = nextPayment();
  $('#nextPay').textContent = np && phase() === 'before' ? 'Next payment: ' + np.name + ', ' + money(np.left) + ' on ' + fmtShort(np.d) : '';
  const ph = phase();
  document.querySelectorAll('.phases button').forEach(b => b.setAttribute('aria-selected', b.dataset.phase === ph));
  const cur = S.tab[ph];
  $('#tabs').innerHTML = TABS[ph].map(([id, label]) => `<button role="tab" data-tab="${id}" aria-selected="${id === cur}">${label}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab[ph] = b.dataset.tab; save(); renderAll(); });
  const act = $('#tabs').querySelector('[aria-selected="true"]'); if (act) act.scrollIntoView({ block:'nearest', inline:'center' });
  $('#view').innerHTML = (VIEWS[cur] || VIEWS.checklist)();
  (AFTER[cur] || (() => {}))();
}

/* ---------- generic binding: data-path="a.b.0.c" data-kind="num|str" ---------- */
function setPath(path, val) {
  const ks = path.split('.'); let o = S;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}
document.addEventListener('input', e => {
  const el = e.target.closest('[data-path]'); if (!el) return;
  setPath(el.dataset.path, el.dataset.kind === 'num' ? num(el.value) : el.value);
  save();
  if (el.dataset.path.startsWith('budget')) budgetSums();
  if (el.dataset.path.startsWith('keep')) keepSums();
  if (el.dataset.path.startsWith('links')) linkButtons();
});

/* Budget */
function nextPayment() {
  const t = today(); let best = null;
  S.budget.cats.forEach(c => c.lines.forEach(l => {
    const d = parseDate(l.due); if (!d || l.paid) return;
    const left = Math.max(0, (l.plan || 0) - (l.act || 0)) || l.plan || 0;
    if (!best || d < best.d) best = { name:l.name, d, left, late: d < t };
  }));
  return best;
}

function budgetSums() {
  if (!$('#sPlan')) return;
  let P = 0, A = 0;
  S.budget.cats.forEach(c => {
    let p = 0, a = 0; c.lines.forEach(l => { p += l.plan || 0; a += l.act || 0; });
    P += p; A += a;
    const el = document.getElementById('cs-' + c.id); if (el) el.textContent = money(p) + ' planned · ' + money(a) + ' spent';
  });
  const T = S.budget.total || 0;
  $('#sPlan').textContent = money(P); $('#sAct').textContent = money(A); $('#sLeft').textContent = money(Math.max(0, P - A));
  $('#verdict').textContent = !T ? 'Write your total budget above and we will tell you how your plan compares.'
    : P > T ? 'Your plan is ' + money(P - T) + ' over your budget. Something will need to give.'
    : 'Your plan fits, with ' + money(T - P) + ' to spare.';
  const t = today(), up = [];
  S.budget.cats.forEach(c => c.lines.forEach(l => { const d = parseDate(l.due); if (d && !l.paid) up.push({ l, d }); }));
  up.sort((x, y) => x.d - y.d);
  $('#payList').innerHTML = up.length ? up.slice(0, 6).map(({ l, d }) => {
    const left = Math.max(0, (l.plan || 0) - (l.act || 0)) || l.plan || 0;
    return `<li><span>${esc(l.name)} <span class="muted">${money(left)}</span></span><span class="when${d < t ? ' late' : ''}">${d < t ? 'Overdue · ' : ''}${fmtShort(d)}</span></li>`;
  }).join('') : '<li class="muted serif" style="font-style:italic">Add a payment date to any line and it will appear here.</li>';
  const np = nextPayment();
  $('#nextPay').textContent = np ? 'Next payment: ' + np.name + ', ' + money(np.left) + ' on ' + fmtShort(np.d) : '';
}

function shop() {
  if (!SHOP) {
    let c = null; try { c = JSON.parse(localStorage.getItem(CATALOG_CACHE) || 'null'); } catch (e) {}
    SHOP = buildShop(c);
    fetch(CATALOG_URL, { cache:'no-store' }).then(r => r.ok ? r.json() : null).then(c => {
      if (!c || !c.data) return;
      try { localStorage.setItem(CATALOG_CACHE, JSON.stringify(c)); } catch (e) {}
      SHOP = buildShop(c);
      if (S.tab.after === 'keepsakes' && phase() === 'after') renderAll();
    }).catch(() => {});
  }
  return SHOP;
}
const allItems = () => shop().flatMap(s => s.items);

}

      const q = on ? sel[it.id] : (it.min || 1);
      h += `<div class="prod${on ? ' on' : ''}"><h4>${esc(it.name)}</h4><div class="price">${priceLabel(it)}</div><p>${esc(it.desc)}</p>
        ${it.kind === 'pages' || it.kind === 'qty' ? `<div class="qty"><input type="number" inputmode="numeric" min="${it.min}" step="${it.kind === 'pages' ? 2 : 5}" value="${q}" data-act="qty" data-id="${it.id}" aria-label="${it.kind === 'pages' ? 'Pages' : 'Quantity'}"><span>${it.kind === 'pages' ? 'pages' : it.unit}</span></div>` : ''}
        <div><button class="btn small${on ? '' : ' ghost'}" data-act="pick" data-id="${it.id}">${on ? 'Added' : '→ Add'}</button></div></div>`;
    });
    h += '</div>';
  });
  h += `<div class="order"><h3 class="sub" style="margin-top:0">Your request</h3><div id="orderLines"></div>
    <label for="kmsg" style="margin-top:22px">A note for us</label><textarea id="kmsg" data-path="keep.msg" placeholder="Sizes, the photographs you love, a date you would like it by">${esc(S.keep.msg)}</textarea>
    <div class="row-actions"><button class="btn" data-act="sendKeep">→ Send our request</button></div>
    <p class="muted" style="font-size:13px;margin-top:14px">Prices are an estimate before taxes. Nothing is charged until we confirm with you.</p></div>`;
  return h;
};
function keepSums() {
  const box = $('#orderLines'); if (!box) return;
  const items = allItems().filter(it => S.keep.sel[it.id] != null);
  if (!items.length) { box.innerHTML = '<p class="serif muted" style="font-style:italic">Nothing chosen yet.</p>'; return; }
  let tot = 0, req = false;
  box.innerHTML = items.map(it => {
    const q = S.keep.sel[it.id], p = priceOf(it, q);
    if (p == null) req = true; else tot += p;
    const what = it.kind === 'pages' ? ', ' + q + ' pages' : it.kind === 'qty' ? ', ' + q + ' ' + it.unit : '';
    return `<div class="order-line"><span>${esc(it.name + what)}</span><span>${p == null ? 'On request' : money(p)}</span></div>`;
  }).join('') + `<div class="order-total"><span>Estimate</span><span>${money(tot)}${req ? ' +' : ''}</span></div>`;
}
AFTER.keepsakes = keepSums;

/* Share */
VIEWS.share = () => head('Share the love', 'If your photographs and film moved you, a few words from you mean more to the next couple than anything we could say.') + `
  <div class="card"><h3>Leave us a review</h3><p>Two minutes on Google helps other couples find us, and we read every one.</p>
    <a class="btn" href="${REVIEW_URL}" target="_blank" rel="noopener">→ Write a review</a></div>
  <div class="card"><h3>Know a couple getting married?</h3><p>Send them our way. We would be honoured to tell their story too.</p>
    <button class="btn ghost" data-act="refer">→ Tell a friend</button></div>
  <div class="card"><h3>Tag us</h3><p class="note">When you share your photographs, tag @debellephotography so we can see them out in the world.</p>
    <a class="btn ghost" href="https://www.instagram.com/debellephotography/" target="_blank" rel="noopener">→ Instagram</a></div>`;

/* ---------- actions ---------- */
const findIn = (arr, id) => arr.findIndex(x => x.id === id);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT')) return;
  const id = el.dataset.id, a = el.dataset.act;
  const C = S.checklist;
  switch (a) {
    case 'tick': { const it = C[findIn(C, id)]; it.done = !it.done; break; }
    case 'open': open.has(id) ? open.delete(id) : open.add(id); renderAll(); return;
    case 'go': go(id); return;
    case 'delItem': if (!confirm('Remove this from your checklist?')) return; C.splice(findIn(C, id), 1); break;
    case 'paid': S.budget.cats.forEach(c => c.lines.forEach(l => { if (l.id === id) l.paid = !l.paid; })); break;
    case 'delLine': S.budget.cats.forEach(c => { const i = findIn(c.lines, id); if (i > -1) c.lines.splice(i, 1); }); break;
    case 'addLine': { const c = S.budget.cats[findIn(S.budget.cats, id)]; const l = { id:uid(), name:'', plan:0, act:0, due:'', paid:false }; c.lines.push(l); save(); renderAll(); document.querySelector(`[data-path="budget.cats.${S.budget.cats.indexOf(c)}.lines.${c.lines.length - 1}.name"]`).focus(); return; }
    case 'delCat': { const i = findIn(S.budget.cats, id); if (!confirm('Remove "' + S.budget.cats[i].name + '" and all its lines?')) return; S.budget.cats.splice(i, 1); break; }
    case 'grp': { const g = S.family.groups[findIn(S.family.groups, id)]; g.on = !g.on; break; }
    case 'delGrp': S.family.groups.splice(findIn(S.family.groups, id), 1); break;
    case 'delVendor': if (!confirm('Remove this vendor?')) return; S.vendors.splice(findIn(S.vendors, id), 1); break;
    case 'pick': { const it = allItems().find(x => x.id === id); if (S.keep.sel[id] != null) delete S.keep.sel[id]; else { const q = el.closest('.prod').querySelector('input'); S.keep.sel[id] = q ? Math.max(it.min, num(q.value)) : 1; } break; }
    case 'sendFamily': return sendFamily();
    case 'sendVendors': return sendVendors();
    case 'sendKeep': return sendKeep();
    case 'refer': return refer();
    default: return;
  }
  save(); renderAll();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'when') { const it = S.checklist[findIn(S.checklist, el.dataset.id)]; it.m = +el.value; save(); renderAll(); }
  if (el.dataset.act === 'qty') { const it = allItems().find(x => x.id === el.dataset.id); const q = Math.max(it.min || 1, Math.round(num(el.value))); el.value = q; if (S.keep.sel[it.id] != null) { S.keep.sel[it.id] = q; save(); } keepSums(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const t = f.t.value.trim(); if (!t) return;
  switch (f.dataset.form) {
    case 'addItem': S.checklist.push({ id:uid(), t, m:1, hint:'', go:'', done:false, note:'' }); break;
    case 'addCat': S.budget.cats.push({ id:uid(), name:t, lines:[{ id:uid(), name:'', plan:0, act:0, due:'', paid:false }] }); break;
    case 'addGrp': S.family.groups.push({ id:uid(), t, names:'', on:true }); break;
    case 'addVendor': S.vendors.push({ id:uid(), role:t, name:'', phone:'', email:'', note:'' }); break;
  }
  save(); renderAll();
});

/* ---------- emails ---------- */
const who = () => S.names.filter(Boolean).join(' & ');
const dateLine = () => { const d = parseDate(S.date); return d ? 'Wedding date: ' + fmtDate(d) : 'Wedding date: to be confirmed'; };
function sendFamily() {
  const g = S.family.groups.filter(x => x.on);
  mail('Family photos for ' + who(), [who(), dateLine(), '', 'GROUPINGS', ...g.map((x, i) => (i + 1) + '. ' + fill(x.t) + (x.names ? ': ' + x.names : '')), '',
    'MOMENTS NOT TO MISS', S.family.moments || '(none yet)', '', 'GOOD TO KNOW', S.family.notes || '(nothing)'].join('\n'));
}
function sendVendors() {
  const v = S.vendors.filter(x => x.name || x.phone || x.email);
  if (!v.length) { toast('Add at least one vendor first'); return; }
  mail('Our vendors, ' + who(), [who(), dateLine(), '', ...v.map(x => [x.role.toUpperCase(), x.name, x.phone, x.email, x.note].filter(Boolean).join('\n') + '\n')].join('\n'));
}
function sendKeep() {
  const items = allItems().filter(it => S.keep.sel[it.id] != null);
  if (!items.length) { toast('Choose something first'); return; }
  let tot = 0;
  const lines = items.map(it => { const q = S.keep.sel[it.id], p = priceOf(it, q); if (p != null) tot += p;
    return it.name + (it.kind === 'pages' ? ', ' + q + ' pages' : it.kind === 'qty' ? ', ' + q + ' ' + it.unit : '') + ': ' + (p == null ? 'price on request' : money(p)); });
  mail('Keepsakes for ' + who(), [who(), dateLine(), '', 'WE WOULD LIKE', ...lines, '', 'Estimate before taxes: ' + money(tot), '', S.keep.msg ? 'NOTE\n' + S.keep.msg : ''].join('\n'));
  if (window.xdbTrack) xdbTrack('keepsake-request', { items: items.length });
}
function refer() {
  const text = 'We loved working with de Belle Photography on our wedding. If you are planning yours, have a look: https://debellephotography.com';
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else location.href = 'mailto:?subject=' + encodeURIComponent('Our wedding photographers') + '&body=' + encodeURIComponent(text);
}

boot();
</script>
</body>
</html>
