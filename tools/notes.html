<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/account.js"></script>   <!-- site-wide account; the tool falls back to its own sign-in without it -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes — Xavier de Belle</title>
<meta name="description" content="Notes without ceremony. Open, type, done. A dash and a space makes a bullet, Enter keeps the list going, and every note syncs between your devices.">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<!-- installable app: works offline once opened, syncs when back online (pwa.js, pwa-sw.js) -->
<link rel="manifest" href="notes.webmanifest">
<link rel="apple-touch-icon" href="icons/notes-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<script src="pwa.js" data-app="notes"></script>
<style>
:root{
  --ink:#000;--paper:#fff;--volt:#ffe800;--smoke:#141414;--ash:#2a2a2a;--dust:#8a8a8a;
  --hair:#e2e2e2;--grey:#6a6a6a;
  --stack:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut:clamp(14px,3vw,28px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--stack)}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--volt);text-decoration:none}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:12px var(--gut);border-bottom:3px solid var(--paper);flex:none;
  padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand a{color:var(--paper);font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand a:hover{color:var(--volt)}
.brand h1{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;font-size:26px;line-height:1}
.brand h1 span{color:var(--volt)}
.btn{background:transparent;border:3px solid var(--paper);color:var(--paper);font-weight:900;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:9px 13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border-radius:0}
.btn:hover{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.btn.solid{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.btn.solid:hover{background:var(--paper);border-color:var(--paper)}
.sync-btn.ok{border-color:var(--ash);color:var(--dust)}
.sync-btn.ok:hover{color:var(--ink)}
.sync-btn.bad{border-color:var(--volt);color:var(--volt)}
.ghost{background:transparent;border:0;color:var(--grey);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 4px;cursor:pointer}
.ghost:hover{color:var(--ink)}

/* ---------- sync bar ---------- */
#sync-bar{display:none;align-items:center;gap:10px 18px;flex-wrap:wrap;background:var(--volt);color:var(--ink);padding:12px var(--gut);flex:none}
#sync-bar.on{display:flex}
#sync-bar .sync-dot{width:10px;height:10px;background:var(--ink);flex:none}
#sync-what{flex:1 1 280px;font-family:var(--mono);font-size:11px;line-height:1.6;letter-spacing:.04em}
#sync-bar button{border:3px solid var(--ink);background:var(--ink);color:var(--volt);font-weight:900;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 12px;cursor:pointer}
#sync-bar button+button{background:transparent;color:var(--ink)}

/* ---------- layout: list | editor ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:3px solid var(--paper)}
.side-head{display:flex;gap:8px;padding:14px var(--gut) 12px;flex:none}
.search{flex:1;min-width:0;background:transparent;border:3px solid var(--ash);color:var(--paper);padding:9px 11px;font-family:var(--mono);
  font-size:12px;letter-spacing:.06em;border-radius:0;outline:none}
.search:focus{border-color:var(--volt)}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 var(--gut) 18px}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:2px solid var(--ash);padding:13px 4px 13px 12px;
  cursor:pointer;position:relative;color:var(--paper)}
.item::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:4px;background:transparent}
.item:hover::before{background:var(--ash)}
.item.on::before{background:var(--volt)}
.item b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span{display:block;margin-top:4px;font-size:13px;color:var(--dust);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:flex;gap:8px;margin-top:7px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.item small i{font-style:normal;color:var(--volt)}
.empty-list{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust);line-height:1.8;padding:16px 4px}
.side-foot{flex:none;display:flex;gap:4px 14px;flex-wrap:wrap;padding:10px var(--gut);border-top:2px solid var(--ash)}
.side-foot .ghost{color:var(--dust)}
.side-foot .ghost:hover{color:var(--volt)}

.editor{display:flex;flex-direction:column;min-height:0;background:var(--paper);color:var(--ink)}
.ed-head{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:10px var(--gut);border-bottom:3px solid var(--ink);flex:none}
.back{display:none}
.stamp{margin-right:auto;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.ed-head .ghost.on{color:var(--ink);background:var(--volt);padding:6px 8px}
textarea#note{flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;background:transparent;color:var(--ink);
  padding:22px var(--gut) 40vh;font-family:var(--stack);font-size:18px;line-height:1.55;letter-spacing:-.005em;tab-size:2}
textarea#note::placeholder{color:#9a9a9a}
.blank{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px;padding:var(--gut)}
.blank h2{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.045em;line-height:.86;font-size:clamp(40px,7vw,84px)}
.blank h2 span{color:var(--volt);-webkit-text-stroke:2px var(--ink)}
.blank p{margin:0;max-width:44ch;font-size:15px;line-height:1.6;color:#4a4a4a}
.blank kbd{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--volt);padding:2px 6px}
.blank .btn{border-color:var(--ink);color:var(--ink)}
.blank .btn.solid{background:var(--ink);color:var(--volt);border-color:var(--ink)}
.blank .btn.solid:hover{background:var(--volt);color:var(--ink)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:none;
  align-items:center;gap:16px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);outline:3px solid var(--volt);
  padding:11px 14px;max-width:calc(100vw - 32px)}
#toast.on{display:flex}
#toast span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.5}
#toast button{background:var(--ink);color:var(--volt);border:0;font-weight:900;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 11px;cursor:pointer}

/* ---------- phones: one panel at a time ---------- */
@media (max-width:760px){
  .brand h1{font-size:22px}
  .brand a{display:none}
  .main{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0}
  .editor{display:none}
  body.editing .side{display:none}
  body.editing .editor{display:flex}
  .back{display:inline-flex;margin-right:auto}
  .stamp{order:9;flex-basis:100%;margin:0;padding-bottom:2px}
  textarea#note{font-size:17px;padding-bottom:30vh}
}
@media print{.top,#sync-bar,.side,.ed-head{display:none!important}.main{display:block}textarea#note{height:auto}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><a href="../index.html">Xavier de Belle</a><h1>Notes<span>.</span></h1></div>
  <button class="btn" type="button" data-pwa-install style="display:none" title="Install as an app: its own icon, works offline">Install app</button>
  <button class="btn sync-btn" id="btn-sync" onclick="syncClick()" style="display:none">Sign in to sync</button>
  <button class="btn" id="btn-signout" onclick="signOutNow()" style="display:none" title="Sign out of sync">Sign out</button>
</header>

<div id="sync-bar" role="status">
  <span class="sync-dot"></span>
  <span id="sync-what"></span>
  <button id="sync-keep-local" onclick="keepLocal()">Keep this device</button>
  <button id="sync-keep-cloud" onclick="keepCloud()">Keep cloud copy</button>
</div>

<main class="main">
  <section class="side" aria-label="All notes">
    <div class="side-head">
      <input class="search" id="search" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off">
      <button class="btn solid" id="btn-new" type="button" title="New note (Alt+N)">+ New</button>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <button class="ghost" id="btn-export" type="button">Export</button>
      <button class="ghost" id="btn-import" type="button">Import</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </section>

  <section class="editor" aria-label="Note">
    <div class="ed-head" id="ed-head">
      <button class="ghost back" id="btn-back" type="button">← Notes</button>
      <span class="stamp" id="stamp"></span>
      <button class="ghost" id="btn-pin" type="button" aria-pressed="false">Pin</button>
      <button class="ghost" id="btn-copy" type="button">Copy</button>
      <button class="ghost" id="btn-del" type="button">Delete</button>
    </div>
    <textarea id="note" spellcheck="true" placeholder="Start typing. The first line is the title.&#10;&#10;- a dash and a space makes a bullet"></textarea>
    <div class="blank" id="blank" hidden>
      <h2>Write it<br><span>down.</span></h2>
      <p>The first line of a note is its title. Type <kbd>-</kbd> and a space for a bullet, <kbd>1.</kbd> and a space for a numbered list. Enter keeps the list going; Enter on an empty item ends it.</p>
      <button class="btn solid" type="button" onclick="newNote()">+ New note</button>
    </div>
  </section>
</main>

<div id="toast" role="status"><span id="toast-msg"></span><button id="toast-undo" type="button">Undo</button></div>

<script>
/* ============================================================
   NOTES — Xavier de Belle
   One list of notes. The first line of a note is its title.
   Saved in this browser as you type; synced while signed in.
   ============================================================ */
var STORAGE_KEY = 'xdb.notes.v1';
var PHONE = window.matchMedia ? matchMedia('(max-width: 760px)') : { matches: false };   // same line as the CSS
var $ = function (id) { return document.getElementById(id); };

/* ---------- data ---------- */
function defaultState() {
  return { notes: [{
    id: 'welcome', pinned: false, createdAt: 0, updatedAt: 0,
    text: 'Welcome to Notes\n\nThe first line of a note is its title. Everything saves as you type.\n\n' +
          '• Type a dash and a space for a bullet\n• Enter keeps the list going\n• Enter on an empty bullet ends it\n\n' +
          '1. Numbers work the same way\n2. Like this\n\nDelete this note whenever you like.'
  }] };
}
function listOf(v) { return Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []); }
function normNote(n) {
  if (!n || typeof n !== 'object') return null;
  return {
    id: String(n.id || uid()), text: typeof n.text === 'string' ? n.text : '',
    pinned: !!n.pinned, createdAt: +n.createdAt || 0, updatedAt: +n.updatedAt || 0
  };
}
function normalise(d) {
  if (!d || typeof d !== 'object') return null;
  return { notes: listOf(d.notes).map(normNote).filter(Boolean) };
}
function uid() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function loadState() {
  try {
    var s = normalise(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'));
    if (s) return s;
  } catch (e) {}
  return defaultState();
}

var state = loadState();
var currentId = null, query = '', saveTimer = null, toastTimer = null, undoFn = null;

function saveNow() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  cloudTouch();
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 350); }

/* ---------- reading a note ---------- */
var MARK = /^\s*(?:• |\d+[.)] )/;
function lines(n) { return n.text.split('\n').map(function (l) { return l.replace(MARK, '').trim(); }).filter(Boolean); }
function titleOf(n) { return lines(n)[0] || 'New note'; }
function excerptOf(n) { return lines(n).slice(1).join('  ·  ') || 'No more text'; }
function words(t) { var m = t.match(/[^\s•]+/g); return m ? m.length : 0; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function hhmm(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function when(t) {
  if (!t) return '';
  var d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return hhmm(t);
  var y = new Date(now.getTime() - 864e5);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + (d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : '');
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function current() { return state.notes.filter(function (n) { return n.id === currentId; })[0] || null; }
function sorted() {
  return state.notes.slice().sort(function (a, b) { return (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt); });
}

/* ---------- rendering ---------- */
function renderList() {
  var q = query.trim().toLowerCase();
  var ns = sorted().filter(function (n) { return !q || n.text.toLowerCase().indexOf(q) > -1; });
  $('list').innerHTML = ns.length ? ns.map(function (n) {
    return '<button type="button" class="item' + (n.id === currentId ? ' on' : '') + '" data-id="' + esc(n.id) + '">' +
      '<b>' + esc(titleOf(n)) + '</b><span>' + esc(excerptOf(n)) + '</span>' +
      '<small>' + (n.pinned ? '<i>Pinned</i>' : '') + '<em style="font-style:normal">' + esc(when(n.updatedAt) || 'Start here') + '</em></small></button>';
  }).join('') : '<div class="empty-list">' + (q ? 'Nothing matches “' + esc(query) + '”.' : 'No notes yet. Press + New.') + '</div>';
}
function renderEditor(focus) {
  var n = current();
  $('note').hidden = !n; $('ed-head').style.visibility = n ? '' : 'hidden'; $('blank').hidden = !!n;
  if (!n) { document.body.classList.remove('editing'); return; }
  if ($('note').value !== n.text) $('note').value = n.text;
  $('btn-pin').textContent = n.pinned ? 'Pinned' : 'Pin';
  $('btn-pin').classList.toggle('on', n.pinned);
  $('btn-pin').setAttribute('aria-pressed', n.pinned ? 'true' : 'false');
  renderStamp();
  if (focus) { $('note').focus(); }
}
function renderStamp() {
  var n = current(); if (!n) return;
  var w = words(n.text);
  $('stamp').textContent = (n.updatedAt ? 'Edited ' + when(n.updatedAt) : 'Not edited yet') + ' · ' + w + ' word' + (w === 1 ? '' : 's');
}
function render(focus) { renderList(); renderEditor(focus); }

/* ---------- actions ---------- */
function open(id, focus) {
  dropIfEmpty(id);
  currentId = id;
  document.body.classList.add('editing');
  render(focus);
  if (focus) { var t = $('note'); var end = t.value.length; try { t.setSelectionRange(end, end); } catch (e) {} }
}
function newNote() {
  var n = { id: uid(), text: '', pinned: false, createdAt: Date.now(), updatedAt: Date.now() };
  state.notes.push(n);
  query = ''; $('search').value = '';
  open(n.id, true);
}
/* A note left empty is not worth keeping: it goes when you move on. */
function dropIfEmpty(nextId) {
  var n = current();
  if (n && n.id !== nextId && !n.text.trim()) {
    state.notes = state.notes.filter(function (x) { return x !== n; });
    saveNow();
  }
}
function removeCurrent() {
  var n = current(); if (!n) return;
  var at = state.notes.indexOf(n);
  state.notes.splice(at, 1);
  currentId = null;
  document.body.classList.remove('editing');
  saveNow(); render();
  if (n.text.trim()) toast('Deleted “' + titleOf(n).slice(0, 32) + '”', function () {
    state.notes.splice(at, 0, n); saveNow(); open(n.id);
  });
}
function toast(msg, undo) {
  clearTimeout(toastTimer);
  undoFn = undo || null;
  $('toast-msg').textContent = msg;
  $('toast-undo').style.display = undo ? '' : 'none';
  $('toast').classList.add('on');
  toastTimer = setTimeout(function () { $('toast').classList.remove('on'); undoFn = null; }, 5000);
}
function copyText(text) {
  function ok() { toast('Copied'); }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    var done = false; try { done = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    if (done) ok(); else toast("This browser wouldn't copy");
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
}
function exportAll() {
  var blob = new Blob([JSON.stringify({ app: 'xdb-notes', version: 1, exportedAt: new Date().toISOString(), notes: state.notes }, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  var d = new Date();
  a.href = URL.createObjectURL(blob); a.download = 'notes-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
function importFile(f) {
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var d = normalise(JSON.parse(String(fr.result)));
      if (!d || !d.notes.length) throw 0;
      var have = {}; state.notes.forEach(function (n) { have[n.id] = n; });
      var added = 0, updated = 0;
      d.notes.forEach(function (n) {
        var h = have[n.id];
        if (!h) { state.notes.push(n); added++; }
        else if (n.updatedAt > h.updatedAt) { h.text = n.text; h.pinned = n.pinned; h.updatedAt = n.updatedAt; updated++; }
      });
      saveNow(); render();
      toast('Imported: ' + added + ' new, ' + updated + ' updated');
    } catch (e) { toast("That file isn't a Notes export"); }
  };
  fr.readAsText(f);
}

/* ============================================================
   List typing — the only "formatting" there is
   - a dash (or *) and a space at the start of a line → •
   - Enter on a bullet or numbered line continues the list;
     Enter on an empty item ends it
   - Backspace on a bare bullet removes it
   - Tab / Shift+Tab indent and outdent a list line
   Edits go through execCommand so Undo still works.
   ============================================================ */
var BULLET = '• ', typing = false;
function lineStart(v, i) { return v.lastIndexOf('\n', i - 1) + 1; }
function replaceRange(ta, from, to, text) {
  var before = ta.value;
  ta.setSelectionRange(from, to);
  var ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (e) {}
  if (!ok || ta.value === before && (to > from || text)) {
    ta.value = before;
    ta.setRangeText(text, from, to, 'end');
  }
  // browsers disagree on where the caret lands after an edit at the very end; say it outright
  ta.setSelectionRange(from + text.length, from + text.length);
}
function listTyping(ta, ev) {
  if (typing) return false;
  var v = ta.value, c = ta.selectionStart;
  if (c !== ta.selectionEnd) return false;
  var type = (ev && ev.inputType) || '';
  var ls = lineStart(v, c), before = v.slice(ls, c);
  var done = false;
  typing = true;
  if (type === 'insertText' && /^\s*[-*] $/.test(before)) {
    replaceRange(ta, ls, c, before.match(/^\s*/)[0] + BULLET);
    done = true;
  } else if ((type === 'insertLineBreak' || type === 'insertParagraph' || (type === 'insertText' && ev.data == null)) && v.charAt(c - 1) === '\n') {
    var pls = lineStart(v, c - 1), prev = v.slice(pls, c - 1);
    var m = prev.match(/^(\s*)(• |(\d+)([.)]) )(.*)$/);
    if (m) {
      if (!m[5].trim()) replaceRange(ta, pls, c, '');                       // empty item: end the list
      else replaceRange(ta, c, c, m[1] + (m[3] ? (parseInt(m[3], 10) + 1) + m[4] + ' ' : BULLET));
      done = true;
    }
  } else if (type === 'deleteContentBackward' && /^\s*•$/.test(before)) {
    replaceRange(ta, c - 1, c, '');
    done = true;
  }
  typing = false;
  return done;
}
function listKeys(ta, ev) {
  if (ev.key !== 'Tab' || ev.altKey || ev.metaKey || ev.ctrlKey) return;
  var v = ta.value, c = ta.selectionStart, ls = lineStart(v, c);
  var le = v.indexOf('\n', c); if (le < 0) le = v.length;
  var line = v.slice(ls, le);
  if (!/^\s*(• |\d+[.)] )/.test(line)) return;          // Tab means Tab only inside a list
  ev.preventDefault();
  var keepSel = ta.selectionEnd - c;
  typing = true;
  if (ev.shiftKey) {
    var cut = Math.min(2, line.match(/^ */)[0].length);
    if (cut) { replaceRange(ta, ls, ls + cut, ''); ta.setSelectionRange(c - cut, c - cut + keepSel); }
  } else {

}

function paintSync() {
  var btn = syncEl('btn-sync'), out = syncEl('btn-signout'), bar = syncEl('sync-bar');
  if (!btn) return;
  if (!cloud.on) { btn.style.display = 'none'; out.style.display = 'none'; bar.classList.remove('on'); return; }

  var label, title;
  switch (cloud.status) {
    case 'working':  label = 'Syncing…';                   title = 'Talking to the cloud'; break;
    case 'synced':   label = 'Live · ' + hhmm(cloud.at);   title = 'Signed in — changes on your other devices appear here as they happen'; break;
    case 'conflict': label = 'Pick a version';             title = 'Two versions to choose between \u2014 see the note below'; break;
    case 'pending':  label = 'Access requested';           title = 'Waiting for Xavier to approve this account'; break;
    case 'private':  label = 'No access';                  title = 'This account is not on the invitation list'; break;
    case 'error':    label = isOffline(cloud.msg) ? 'Offline \u00b7 saved here' : 'Sync failed';                title = explain(cloud.msg); break;
    default:         label = 'Sign in to sync';            title = 'Keep this in step across your devices';
  }
  var acct = account();
  if (acct && cloud.authed) {
    btn.innerHTML = acct.badgeHTML() + ' <span>' + label.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) + '</span>';
    title += ' \u2014 open your account';
  } else {
    btn.textContent = label;
  }
  btn.title = title;
  btn.className = SYNC.buttonClass(cloud.status);
  btn.style.display = '';
  out.style.display = cloud.authed && !acct ? '' : 'none';   // with the site account, signing out lives in its panel

  var what = syncEl('sync-what'), kl = syncEl('sync-keep-local'), kc = syncEl('sync-keep-cloud');
  if (cloud.status === 'pending' || cloud.status === 'private' || cloud.status === 'error') {
    what.textContent = cloud.status === 'pending'
      ? 'Sync is by invitation, and your request is in. Once Xavier approves it, syncing starts here on its own. ' +
        'Until then everything keeps saving in this browser as usual. '
      : cloud.status === 'private'
      ? 'Sync on this site is by invitation, and this account isn\u2019t on the list. ' +
        'Everything still saves in this browser exactly as before, and nothing is sent anywhere. '
      : explain(cloud.msg);
    if (cloud.status !== 'error') {
      var more = document.createElement('a');
      more.href = ACCESS_URL;
      more.textContent = 'About access \u2192';
      what.appendChild(more);
    }
    kl.style.display = 'none';
    kc.style.display = 'none';
    bar.classList.add('on');
    return;
  }
  kl.style.display = '';
  kc.style.display = '';
  var b = readBackup();
  if (cloud.status === 'conflict' && cloud.pending) {
    var w = choiceWords(cloud.pending);
    what.textContent = w.text;
    kl.textContent = w.local;
    kc.textContent = w.cloud;
    bar.classList.add('on');
  } else if (b && b.shown) {
    what.textContent = b.restored
      ? 'Restored. The version you replaced (' + b.summary + ') is saved here in case you want it back.'
      : 'Done. The version you didn\u2019t keep \u2014 ' + b.label + ' (' + b.summary + ') \u2014 is saved on this device for ' + BACKUP_DAYS + ' days.';
    kl.textContent = b.restored ? 'Switch back' : 'Restore it';
    kc.textContent = 'OK';
    bar.classList.add('on');
  } else {
    bar.classList.remove('on');
  }
}

function initCloud() {
  seedMeta();
  paintSync();
  if (!cloud.on) return;

  /* Only someone who has signed in here before gets the SDK on load; a
     visitor who never touches the button never fetches it. Signed in
     anywhere on the site counts. */
  var acct = account();
  if (acct) {
    acct.registerTool({ doc: SYNC.doc, syncNow: function () { syncNow(true); } });
    acct.on(function (st) {
      if (st.user && !cloud.listening) loadSDK().then(listen).catch(function () {});   // signed in from the panel
      paintSync();
    });
  }
  if (meta().signedIn || (acct && acct.wanted())) {
    setStatus('working');
    loadSDK().then(listen).catch(function (err) { cloud.msg = errCode(err); setStatus('error'); });
  }

  document.addEventListener('visibilitychange', function () {
    if (!cloud.uid) return;
    if (document.hidden) {
      // a phone suspends the page soon after it hides: send anything unsent now
      SYNC.flush();
      if (meta().updatedAt > meta().lastSyncedAt) syncNow();
    } else {
      syncNow();
    }
  });
  window.addEventListener('focus', function () { if (cloud.uid) syncNow(); });
  window.addEventListener('online', function () { if (cloud.uid) syncNow(); });
}

/* ---------- boot ---------- */
render();
if (!PHONE.matches && state.notes.length) open(sorted()[0].id, false);
initCloud();
window.addEventListener('beforeunload', saveNow);
window.addEventListener('pagehide', saveNow);

// test hooks
window.__notes = { state: function () { return state; }, listTyping: listTyping };
</script>
</body>
</html>
