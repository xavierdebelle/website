document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

op(0.5, 'rgba(255,255,255,' + a + ')');\n      lg.addColorStop(1, 'rgba(255,255,255,0)');\n      ctx.fillStyle = lg; ctx.fillRect((x - wd) * w, 0, wd * 2 * w, h * 0.62);\n    }\n    ctx.globalCompositeOperation = 'source-over';\n    return c;\n  }\n\n  setupTile(i, builder) {\n    const THREE = window.THREE;\n    const canvas = document.getElementById('ls-canvas-' + i);\n    if (!canvas) return null;\n    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });\n    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));\n    renderer.outputEncoding = THREE.sRGBEncoding;\n    renderer.toneMapping = THREE.ACESFilmicToneMapping;\n    renderer.toneMappingExposure = this.cfg.exposure;\n    const scene = new THREE.Scene();\n    scene.background = new THREE.Color(0x000000);\n    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);\n    camera.position.set(0, 0, 5);\n    const envTex = new THREE.CanvasTexture(this.envCanvas);\n    envTex.mapping = THREE.EquirectangularReflectionMapping;\n    envTex.encoding = THREE.sRGBEncoding;\n    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 3, 4); scene.add(key);\n    const rim = new THREE.DirectionalLight(0xbcd2ff, 1.3); rim.position.set(-3, -1, -3); scene.add(rim);\n    scene.add(new THREE.AmbientLight(0x303030, 0.5));\n    const api = builder({ THREE, scene, camera, envTex });\n    const fit = () => {\n      const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;\n      renderer.setSize(w, h, false);\n      camera.aspect = w / h; camera.updateProjectionMatrix();\n    };\n    const ro = new ResizeObserver(fit); ro.observe(canvas); this._obs.push(ro); fit();\n    return { renderer, scene, camera, update: api.update, mat: api.mat };\n  }\n\n  initGL() {\n    const THREE = window.THREE;\n    this.envCanvas = this.makeEnvCanvas();\n    const TwoPi = Math.PI * 2;\n\n    const builders = [\n      // 01 — Tumbling icosahedron\n      ({ THREE, scene, camera, envTex }) => {\n        const geo = new THREE.IcosahedronGeometry(1.4, 0);\n        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.045, envMap: envTex, envMapIntensity: 1.3, flatShading: true });\n        const mesh = new THREE.Mesh(geo, mat); scene.add(mesh);\n        camera.position.set(0, 0, 4.7);\n        return { mat, update: (p) => { mesh.rotation.x = p; mesh.rotation.y = p; } };\n      },\n      // 02 — Morphing mercury blob\n      ({ THREE, scene, camera, envTex }) => {\n        const geo = new THREE.IcosahedronGeometry(1.2, 18);\n        const base = Float32Array.from(geo.attributes.position.array);\n        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05, envMap: envTex, envMapIntensity: 1.25 });\n        const mesh = new THREE.Mesh(geo, mat); scene.add(mesh);\n        camera.position.set(0, 0, 4.2);\n        const pos = geo.attributes.position, arr = pos.array;\n        return { mat, update: (p) => {\n          for (let i = 0; i < arr.length; i += 3) {\n            const bx = base[i], by = base[i + 1], bz = base[i + 2];\n            const d = 0.13 * Math.sin(2.6 * bx + p) + 0.12 * Math.sin(2.7 * by - p) + 0.12 * Math.sin(2.8 * bz + p)\n              + 0.05 * Math.sin(5 * bx + 5 * by - 2 * p) + 0.05 * Math.sin(5 * bz - 5 * by + 2 * p);\n            const s = 1 + d;\n            arr[i] = bx * s; arr[i + 1] = by * s; arr[i + 2] = bz * s;\n          }\n          pos.needsUpdate = true; geo.computeVertexNormals();\n          mesh.rotation.y = p;\n        } };\n      },\n      // 03 — Rotating torus knot\n      ({ THREE, scene, camera, envTex }) => {\n        const geo = new THREE.TorusKnotGeometry(0.72, 0.25, 260, 36, 2, 3);\n        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.045, envMap: envTex, envMapIntensity: 1.25 });\n        const mesh = new THREE.Mesh(geo, mat); scene.add(mesh);\n        camera.position.set(0, 0, 4.2);\n        return { mat, update: (p) => { mesh.rotation.x = p; mesh.rotation.z = p; } };\n      },\n      // 04 — Undulating wave field\n      ({ THREE, scene, camera, envTex }) => {\n        const geo = new THREE.PlaneGeometry(9, 9, 150, 150);\n        const base = Float32Array.from(geo.attributes.position.array);\n        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.04, envMap: envTex, envMapIntensity: 1.2, side: THREE.DoubleSide });\n        const mesh = new THREE.Mesh(geo, mat); mesh.rotation.x = -Math.PI / 2.04; mesh.position.y = -0.45; scene.add(mesh);\n        camera.position.set(0, 1.75, 3.35); camera.lookAt(0, -0.25, -1.3);\n        const pos = geo.attributes.position, arr = pos.array;\n        return { mat, update: (p) => {\n          for (let i = 0; i < arr.length; i += 3) {\n            const bx = base[i], by = base[i + 1];\n            arr[i + 2] = 0.20 * Math.sin(1.5 * bx + p) + 0.16 * Math.sin(1.25 * by - p)\n              + 0.10 * Math.sin(0.9 * (bx + by) + 2 * p) + 0.06 * Math.sin(2.2 * bx - 1.8 * by - p);\n          }\n          pos.needsUpdate = true; geo.computeVertexNormals();\n        } };\n      },\n      // 05 — Twisting coil ribbon\n      ({ THREE, scene, camera, envTex }) => {\n        const geo = new THREE.BoxGeometry(1.65, 2.7, 0.14, 16, 200, 2);\n        const base = Float32Array.from(geo.attributes.position.array);\n        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05, envMap: envTex, envMapIntensity: 1.25 });\n        const mesh = new THREE.Mesh(geo, mat); mesh.rotation.x = 0.18; scene.add(mesh);\n        camera.position.set(0, 0, 4.9);\n        const pos = geo.attributes.position, arr = pos.array;\n        return { mat, update: (p) => {\n          const dens = 1.1 + 0.85 * Math.sin(p);\n          for (let i = 0; i < arr.length; i += 3) {\n            const bx = base[i], by = base[i + 1], bz = base[i + 2];\n            const ang = by * dens, c = Math.cos(ang), s = Math.sin(ang);\n            arr[i] = bx * c - bz * s; arr[i + 1] = by; arr[i + 2] = bx * s + bz * c;\n          }\n          pos.needsUpdate = true; geo.computeVertexNormals();\n          mesh.rotation.y = p;\n        } };\n      },\n      // 06 — Undulating chrome ring\n      ({ THREE, scene, camera, envTex }) => {\n        const geo = new THREE.TorusGeometry(0.95, 0.34, 40, 240);\n        const base = Float32Array.from(geo.attributes.position.array);\n        const nrm = Float32Array.from(geo.attributes.normal.array);\n        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05, envMap: envTex, envMapIntensity: 1.25 });\n        const mesh = new THREE.Mesh(geo, mat); mesh.rotation.x = 0.62; scene.add(mesh);\n        camera.position.set(0, 0, 4.0);\n        const pos = geo.attributes.position, arr = pos.array;\n        return { mat, update: (p) => {\n          for (let i = 0; i < arr.length; i += 3) {\n            const bx = base[i], by = base[i + 1];\n            const ang = Math.atan2(by, bx);\n            const disp = 0.12 * Math.sin(6 * ang + p) + 0.07 * Math.sin(10 * ang - 2 * p);\n            arr[i] = bx + nrm[i] * disp; arr[i + 1] = by + nrm[i + 1] * disp; arr[i + 2] = base[i + 2] + nrm[i + 2] * disp;\n          }\n          pos.needsUpdate = true; geo.computeVertexNormals();\n          mesh.rotation.z = p;\n        } };\n      }\n    ];\n\n    for (let i = 0; i < 6; i++) {\n      const a = this.setupTile(i, builders[i]);\n      if (a) { this.anims.push(a); this.mats.push(a.mat); this._baseRough.push(a.mat.roughness); }\n    }\n    this.applyConfig();\n\n    const clock = new THREE.Clock();\n    const loop = () => {\n      this._raf = requestAnimationFrame(loop);\n      const dt = Math.min(clock.getDelta(), 0.05);\n      if (!this.cfg.paused) this.t += dt;\n      const phase = (this.t % this.cfg.loopSeconds) / this.cfg.loopSeconds * TwoPi;\n      for (const a of this.anims) { a.update(phase); a.renderer.render(a.scene, a.camera); }\n    };\n    loop();\n\n    for (let i = 0; i < 6; i++) {\n      const cell = document.getElementById('ls-cell-' + i);\n      if (cell) cell.addEventListener('click', () => {\n        if (document.fullscreenElement) document.exitFullscreen();\n        else if (cell.requestFullscreen) cell.requestFullscreen();\n      });\n    }\n  }\n\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
